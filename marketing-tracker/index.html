<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Tracker</title>
<script>
/* ============================================================
   CONFIG — edit this block to point the tracker at your data.
   ============================================================
   mode: "local" — drag CSV files onto the page or pick them with the file
                   picker. The last loaded files are remembered in this
                   browser until you press "Clear data".
         "urls"  — fetch every entry in `sources` on load. Use the CSV link
                   from Google Sheets: File > Share > Publish to web >
                   (pick the Initiatives tab) > Comma-separated values.
   kind (optional, per source): "moments" or "vertical". Leave it out and
   the tracker works it out from the rows.
*/
const CONFIG = {
  mode: "local",
  sources: [
    // { label: "Seasonal Moments", url: "https://docs.google.com/spreadsheets/d/e/.../pub?gid=0&single=true&output=csv", kind: "moments" },
    // { label: "S Market",         url: "https://docs.google.com/spreadsheets/d/e/.../pub?gid=0&single=true&output=csv" },
  ],
};
</script>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #dfe3e8;
  --border-strong: #c5ccd5;
  --text: #17202b;
  --text-2: #5a6573;
  --text-3: #8a94a1;
  --accent: #1f6feb;
  --error: #c62828;
  --error-bg: #fdecec;
  --warn: #a35c00;
  --warn-bg: #fff4e0;
  --ok: #1b7a3a;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);

  /* Vertical colours (bars, legend, chips) */
  --v-smk: #2563eb;
  --v-rst: #dc2626;
  --v-snm: #d97706;
  --v-grc: #16a34a;
  --v-sld: #0891b2;
  --v-srv: #7c3aed;
  --v-nvt: #db2777;
  --v-cvt: #475569;
  --v-unknown: #9ca3af;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 12px;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); }
button.link:hover { text-decoration: underline; background: none; }

/* ---------- Header ---------- */
.app-header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.app-header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.app-header .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 14px; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--text); color: #fff; }
.issue-badge {
  display: inline-flex; gap: 6px; align-items: center;
}
.count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: center; }
.count.error { background: var(--error-bg); color: var(--error); }
.count.warning { background: var(--warn-bg); color: var(--warn); }
.count.zero { background: var(--surface-2); color: var(--text-3); }

main { padding: 16px 20px 40px; max-width: 1600px; margin: 0 auto; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card > header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.card > header h2 { font-size: 14px; margin: 0; font-weight: 650; }
.card > header .spacer { flex: 1; }
.card.collapsed > :not(header) { display: none; }
.card.collapsed > header { border-bottom: 0; }
.chev { display: inline-block; transition: transform .15s; color: var(--text-3); }
.card.collapsed .chev { transform: rotate(-90deg); }
.card-toggle { border: 0; background: none; padding: 0; display: flex; gap: 8px; align-items: center; }
.card-toggle:hover { background: none; }

table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.grid th { font-weight: 600; color: var(--text-2); background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }
.scroll { overflow: auto; max-height: 420px; }

/* ---------- Loader ---------- */
.loader-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 48px 20px;
  text-align: center;
  background: var(--surface);
}
.dropzone h2 { margin: 0 0 6px; font-size: 18px; }
.dropzone p { margin: 0 0 16px; color: var(--text-2); }
.drop-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(31, 111, 235, .12);
  border: 3px dashed var(--accent);
  display: none; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600; color: var(--accent);
  pointer-events: none;
}
body.dragging .drop-overlay { display: flex; }
.kind-tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.load-error { color: var(--error); }

/* ---------- Issues ---------- */
.issue-filters { display: inline-flex; gap: 4px; }
.issue-filters button { padding: 2px 10px; font-size: 12px; border-radius: 12px; }
.issue-filters button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.sev { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; }
.sev.error { color: var(--error); background: var(--error-bg); }
.sev.warning { color: var(--warn); background: var(--warn-bg); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #f7f9fc; }
.empty-note { padding: 14px; color: var(--text-2); }

/* ---------- Data table ---------- */
tr.has-error td:first-child { box-shadow: inset 3px 0 0 var(--error); }
tr.has-warning td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: #fff3b0; } to { background: transparent; } }
.vdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.bad-value { color: var(--error); text-decoration: underline wavy var(--error); text-underline-offset: 3px; }

/* ---------- Period toolbar (month + week views) ---------- */
.period-bar { flex-wrap: wrap; }
.period-nav { display: inline-flex; align-items: center; gap: 4px; }
.period-nav button { padding: 4px 10px; font-size: 16px; line-height: 1; }
.period-nav h2 { font-size: 16px !important; min-width: 190px; text-align: center; }
input[type="month"] { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); }

/* ---------- Legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-2); align-items: center; }
.legend .group { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .group-title { font-weight: 600; color: var(--text); margin-right: 2px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .sw-bar { width: 26px; height: 12px; border-radius: 3px; display: inline-block; position: relative; }
.legend .sep { width: 1px; align-self: stretch; background: var(--border); }

/* ---------- Timeline ---------- */
.tl-scroll { overflow-x: auto; }
.tl { --label-w: 210px; --row-h: 28px; min-width: 980px; position: relative; font-size: 12px; }
.tl-row { display: flex; min-height: var(--row-h); }
.tl-label { flex: 0 0 var(--label-w); width: var(--label-w); padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--surface); position: relative; z-index: 3; }
.tl-track { flex: 1; position: relative; min-width: 0; }

.tl-head { border-bottom: 1px solid var(--border-strong); background: var(--surface); }
.tl-head .tl-row { min-height: 0; }
.tl-weeks .tl-track, .tl-days .tl-track { height: 22px; }
.tl-weeks .tl-label, .tl-days .tl-label { color: var(--text-3); font-size: 11px; }
.wk-label { position: absolute; top: 0; height: 22px; display: flex; align-items: center; padding-left: 6px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--border-strong); }
.wk-label.partial { color: var(--text-3); font-weight: 500; }
.day-cell { position: absolute; top: 0; height: 22px; display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.day-cell b { color: var(--text-2); font-weight: 600; }
.day-cell.sun { border-left: 1px solid var(--border-strong); }
.day-cell.today b { background: var(--error); color: #fff; border-radius: 9px; padding: 0 5px; }

.tl-body { position: relative; }
.tl-grid { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 0; pointer-events: none; z-index: 0; }
.tl-grid .weekend { position: absolute; top: 0; bottom: 0; background: rgba(23, 32, 43, .025); }
.tl-grid .wk-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); }
.tl-grid .today-line { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--error); z-index: 4; }
.tl-grid .today-line::before { content: ""; position: absolute; top: -4px; left: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--error); }

.tl-lane-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px 6px; background: var(--surface-2); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
.tl-lane-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--text); }
.tl-lane-head .muted { font-size: 12px; }
.tl-group-first { border-top: 1px solid var(--border); }
.tl-campaigns .tl-lane-head + .tl-group-first { border-top: 0; }
.tl-group-head { cursor: pointer; font-weight: 600; color: var(--text); }
.tl-group-head:hover { background: var(--surface-2); }
.tl-group-head .chev { font-size: 10px; width: 10px; }
.tl-group-head.collapsed .chev { transform: rotate(-90deg); }
.tl-group-head .n { color: var(--text-3); font-weight: 500; }
.tl-empty { padding: 8px 14px; color: var(--text-3); font-style: italic; position: relative; z-index: 3; }

.tl-campaigns { position: relative; }
.tl-bands { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 0; pointer-events: none; z-index: 0; }
.band { position: absolute; top: 0; bottom: 0; background: rgba(71, 85, 105, .045); border-left: 1px dashed rgba(71, 85, 105, .4); border-right: 1px dashed rgba(71, 85, 105, .4); transition: background .15s; }
.band.hl { background: rgba(71, 85, 105, .16); border-color: rgba(71, 85, 105, .8); }

/* Bars: colour = vertical (--c), style = status */
.bar {
  --c: var(--v-unknown);
  position: absolute; top: 3px; height: calc(var(--row-h) - 6px);
  border-radius: 5px; border: 1.5px solid var(--c);
  padding: 0 7px; display: flex; align-items: center;
  font-size: 12px; font-weight: 600; text-align: left;
  z-index: 2; cursor: pointer; min-width: 6px;
}
.bar:hover { filter: brightness(.95); box-shadow: 0 1px 4px rgba(0,0,0,.18); z-index: 5; }
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; pointer-events: none; }
.bar.lbl-right .bar-label, .bar.lbl-left .bar-label { position: absolute; color: var(--text); overflow: visible; }
.bar.lbl-right .bar-label { left: calc(100% + 5px); }
.bar.lbl-left .bar-label { right: calc(100% + 5px); }

.bar.st-idea     { background: var(--surface); border-style: dashed; color: color-mix(in srgb, var(--c) 75%, #000); }
.bar.st-planning { background: color-mix(in srgb, var(--c) 18%, #fff); border-color: color-mix(in srgb, var(--c) 55%, #fff); color: color-mix(in srgb, var(--c) 60%, #000); }
.bar.st-live     { background: var(--c); color: #fff; }
.bar.st-complete { background: color-mix(in srgb, var(--c) 30%, #fff); border-color: color-mix(in srgb, var(--c) 30%, #fff); color: color-mix(in srgb, var(--c) 35%, #8a94a1); }
.bar.st-paused   { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 32%, #fff) 0 4px, #fff 4px 8px); color: color-mix(in srgb, var(--c) 60%, #000); }
.bar.st-none     { background: var(--surface); border-style: dotted; color: var(--text-2); }
.bar.st-complete .bar-label { text-decoration: none; }
.bar.lbl-right.st-complete .bar-label, .bar.lbl-left.st-complete .bar-label { color: var(--text-3); }

/* Clipped at the month edge: square edge + arrow */
.bar.clip-l { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-width: 0; padding-left: 16px; }
.bar.clip-r { border-top-right-radius: 0; border-bottom-right-radius: 0; border-right-width: 0; padding-right: 16px; }
.bar.clip-l::before, .bar.clip-r::after { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; line-height: 1; opacity: .85; }
.bar.clip-l::before { content: "◀"; left: 2px; }
.bar.clip-r::after { content: "▶"; right: 2px; }
.bar.lbl-right.clip-r .bar-label { left: calc(100% + 5px); }

.bar .idot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex: none; box-shadow: 0 0 0 1.5px #fff; }
.bar .idot.error { background: var(--error); }
.bar .idot.warning { background: #e08a00; }

.mini-bar { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--c); opacity: .55; }

.tl-note { padding: 10px 14px; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); }
.tl-note:empty { display: none; }

/* ---------- Status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; border: 1px solid transparent; white-space: nowrap; }
.chip.st-idea { border: 1px dashed #8a94a1; color: #5a6573; background: #fff; }
.chip.st-planning { background: #e6efff; color: #1a4fb5; border-color: #c4d6fb; }
.chip.st-live { background: #1b7a3a; color: #fff; }
.chip.st-complete { background: #eef0f3; color: #8a94a1; }
.chip.st-paused { background: repeating-linear-gradient(135deg, #fde7c2 0 4px, #fff 4px 8px); color: #8a4b00; border-color: #f2c47a; }
.chip.st-none { background: var(--error-bg); color: var(--error); }
.chip.tier { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }

/* ---------- Weekly view ---------- */
.week-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.week-col { border-right: 1px solid var(--border); min-width: 0; }
.week-col:last-child { border-right: 0; }
.week-col > h3 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); background: var(--surface-2); display: flex; gap: 8px; align-items: baseline; }
.week-col > h3 .muted { font-weight: 500; }
.week-col .wk-empty { padding: 14px; color: var(--text-3); font-style: italic; }
.wk-tier { padding: 10px 14px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.wk-vertical { padding: 6px 14px 4px; font-size: 12px; font-weight: 600; display: flex; align-items: center; }
.wk-card {
  --c: var(--v-unknown);
  display: block; width: calc(100% - 28px); margin: 0 14px 8px; text-align: left;
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px;
  padding: 8px 10px; background: var(--surface);
}
.wk-card:hover { background: #f9fafb; box-shadow: var(--shadow); }
.wk-card .t { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.wk-card .name { font-weight: 650; font-size: 13px; }
.wk-card .meta { color: var(--text-2); font-size: 12px; margin-top: 3px; }
.wk-card .meta b { font-weight: 600; color: var(--text); }
.wk-card .parent { color: var(--text-2); font-size: 12px; margin-top: 3px; }

/* ---------- Filters ---------- */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 14px; }
.filter-bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.filter-bar select, .ms > summary { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); font-size: 13px; color: var(--text); }
.filter-bar select.active, .ms.active > summary { border-color: var(--accent); background: #eef4ff; }
.ms { position: relative; }
.ms > summary { list-style: none; cursor: pointer; min-width: 150px; }
.ms > summary::-webkit-details-marker { display: none; }
.ms > summary::after { content: "▾"; float: right; margin-left: 8px; color: var(--text-3); }
.ms-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(16,24,40,.14); padding: 6px; min-width: 210px; }
.ms-menu label { display: flex; padding: 5px 8px; border-radius: 5px; color: var(--text); font-size: 13px; cursor: pointer; }
.ms-menu label:hover { background: var(--surface-2); }
.ms-menu .ms-actions { display: flex; gap: 12px; padding: 4px 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-size: 12px; }
.filter-note { font-size: 12px; color: var(--text-2); }

/* ---------- Side panel ---------- */
.panel-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .25); z-index: 40; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 41;
  background: var(--surface); box-shadow: -8px 0 32px rgba(16,24,40,.18);
  display: flex; flex-direction: column;
}
.panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); border-top: 5px solid var(--c, var(--v-unknown)); }
.panel-head .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-head h2 { margin: 8px 0 4px; font-size: 19px; line-height: 1.25; }
.panel-head .close { margin-left: auto; border: 0; font-size: 22px; line-height: 1; padding: 2px 8px; color: var(--text-2); }
.panel-body { overflow-y: auto; padding: 4px 18px 24px; }
.panel dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 12px 0; font-size: 13px; }
.panel dt { color: var(--text-2); }
.panel dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.panel h4 { margin: 18px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.panel .text { white-space: pre-wrap; font-size: 13px; margin: 0; }
.panel .text.empty { color: var(--text-3); font-style: italic; }
.panel ul.bullets { margin: 0; padding-left: 18px; font-size: 13px; }
.panel .rel {
  --c: var(--v-unknown);
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; background: var(--surface);
}
.panel .rel:hover { background: var(--surface-2); }
.panel .rel .grow { flex: 1; min-width: 0; }
.panel .rel .sub { font-size: 12px; color: var(--text-2); }
.panel .issue { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.ch { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin: 0 4px 4px 0; }
.bar.pulse { animation: pulse 1.4s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,111,235,.7); } 100% { box-shadow: 0 0 0 10px rgba(31,111,235,0); } }

.print-header { display: none; }

@media (max-width: 900px) {
  .week-body { grid-template-columns: 1fr; }
  .week-col { border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 12px 16px 32px; }
  .app-header { padding: 10px 16px; }
}

/* ---------- Print (landscape A4/A3, size set by the Print control) ---------- */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 11px; }
  .app-header, #emptyState, #sourcesCard, #issuesCard, #filtersCard, .panel, .panel-backdrop,
  .period-bar input, .period-bar button, .drop-overlay, .tl-note button.link { display: none !important; }

  .print-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--text); }
  .print-header h1 { margin: 0; font-size: 18px; }

.placeholder { padding: 40px; text-align: center; color: var(--text-2); }
.hidden { display: none !important; }

<body>

<main>

    <div class="scroll" style="max-height:none" id="dataBody"></div>
  </section>
</main>

<div id="panelRoot"></div>

<script>
/* CORE:BEGIN — pure data logic, no DOM. tools/check.mjs runs this block in Node. */

const COLUMNS = [
  "id", "name", "tier", "parent_id", "vertical", "campaign_type",
  "start_date", "end_date", "status", "owner", "channels",
  "brief", "target_audience", "goal", "kpis", "key_message", "top_highlights",
  "budget_qar", "notes",
];

const MOMENT = "Seasonal Moment";
const BRAND = "Brand Campaign";
const TACTICAL = "Tactical Campaign";

// Keep in sync with tools/build_templates.py
const ALLOWED = {
  tier: [MOMENT, BRAND, TACTICAL],
  vertical: ["S Market", "Restaurants", "Snoomart", "Grocery", "SLaundry", "Services", "New Ventures", "Cross-vertical"],
  campaign_type: ["Hero", "Promo", "Tactical", "Occasion", "Recurrent", "USP", "Segmented", "Engagement", "Adoption", "Habit Builder"],
  status: ["Idea", "Planning", "Live", "Complete", "Paused"],
};

const VERTICAL_CODES = {
  "S Market": "SMK", "Restaurants": "RST", "Snoomart": "SNM", "Grocery": "GRC",
  "SLaundry": "SLD", "Services": "SRV", "New Ventures": "NVT", "Cross-vertical": "CVT",
};
const TIER_ID_CODES = { [BRAND]: "BC", [TACTICAL]: "TC" };

/* ---------- CSV ---------- */

// RFC 4180: quoted cells may hold commas, line breaks and "" (an escaped quote).
// Returns { records: string[][], unterminated: boolean }.
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  text = text.replace(/\r\n?/g, "\n");
  const records = [];
  let rec = [], field = "", inQuotes = false, fieldStarted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"' && !fieldStarted) {
      inQuotes = true; fieldStarted = true;
    } else if (c === ",") {
      rec.push(field); field = ""; fieldStarted = false;
    } else if (c === "\n") {
      rec.push(field); records.push(rec);
      rec = []; field = ""; fieldStarted = false;
    } else {
      field += c; fieldStarted = true;
    }
  }
  if (fieldStarted || rec.length) { rec.push(field); records.push(rec); }
  return { records, unterminated: inQuotes };
}

/* ---------- Dates (whole days since 1970-01-01, UTC; no time zones) ---------- */

const DAY_MS = 86400000;

function parseISODate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const dt = new Date(Date.UTC(y, mo - 1, d));
  if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return null;
  return dt.getTime() / DAY_MS;
}
function dayToDate(n) { return new Date(n * DAY_MS); }
function dayToISO(n) { return dayToDate(n).toISOString().slice(0, 10); }
function dayFromYMD(y, m, d) { return Date.UTC(y, m, d) / DAY_MS; }       // m is 0-based
function weekday(n) { return ((n + 4) % 7 + 7) % 7; }                     // 0 = Sunday
function weekStart(n) { return n - weekday(n); }                          // weeks run Sun..Sat
function todayDay() { const t = new Date(); return dayFromYMD(t.getFullYear(), t.getMonth(), t.getDate()); }

const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function fmtDay(n) { const d = dayToDate(n); return `${d.getUTCDate()} ${MONTHS_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function fmtDayShort(n) { const d = dayToDate(n); return `${DAYS_SHORT[weekday(n)]} ${d.getUTCDate()} ${MONTHS_SHORT[d.getUTCMonth()]}`; }

/* ---------- Load + merge + validate ---------- */

function normHeader(h) { return h.trim().toLowerCase().replace(/[\s-]+/g, "_"); }

// Case- and spacing-insensitive match against an allowed list.
// Returns the canonical value, "" for blank, or null if not allowed.
function canonical(list, value) {
  const v = value.trim().replace(/\s+/g, " ");
  if (!v) return "";
  const lower = v.toLowerCase();
  return list.find(x => x.toLowerCase() === lower) ?? null;
}

function looksLikeDate(s) { return /\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}/.test(s); }

/**
 * sources: [{ label, text, origin: "file"|"url", kind?: "moments"|"vertical", loadError? }]
 * Returns { rows, byKey, byId, issues, sources }.
 * Every non-blank CSV row becomes a row object, whatever its problems.
 */
function buildDataset(sources) {
  const rows = [];
  const issues = [];
  const summaries = [];

  const addIssue = (severity, src, row, field, message) => {
    const issue = {
      severity, field, message,
      source: src.label,
      sheetRow: row ? row._sheetRow : null,
      id: row ? row.id : "",
      rowKey: row ? row._key : null,
    };
    issues.push(issue);
    if (row) row._issues.push(issue);
    return issue;
  };

  sources.forEach((src, sourceIdx) => {
    const summary = {
      label: src.label, origin: src.origin, kind: src.kind || null, kindInferred: !src.kind,
      rowCount: 0, blankRows: 0, errors: 0, warnings: 0, loadError: src.loadError || null,
    };
    summaries.push(summary);
    if (src.loadError) { addIssue("error", src, null, null, `Could not load: ${src.loadError}`); return; }

    const { records, unterminated } = parseCSV(src.text || "");
    if (unterminated) addIssue("error", src, null, null, "File ends inside a quoted cell (a \" is missing its closing quote). The last row may be incomplete.");
    if (!records.length || records[0].every(c => !c.trim())) {
      addIssue("error", src, null, null, "File is empty or has no header row.");
      return;
    }

    const header = records[0].map(normHeader);
    const colIndex = {};
    header.forEach((h, i) => { if (h && !(h in colIndex)) colIndex[h] = i; });
    const missing = COLUMNS.filter(c => !(c in colIndex));
    const extra = header.filter(h => h && !COLUMNS.includes(h));
    if (missing.length) addIssue("error", src, null, null, `Header is missing column${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}`);
    if (extra.length) addIssue("warning", src, null, null, `Header has unknown column${extra.length > 1 ? "s" : ""} (ignored): ${extra.join(", ")}`);

    const fileRows = [];
    for (let r = 1; r < records.length; r++) {
      const cells = records[r];
      const get = c => (c in colIndex ? (cells[colIndex[c]] ?? "") : "").trim();
      const values = {};
      COLUMNS.forEach(c => { values[c] = get(c); });

      // Blank rows, including template rows where only the pre-filled tier/vertical are set.
      // Anything else (even content only in unknown columns) is kept so it gets flagged.
      const knownIdx = new Set(["tier", "vertical"].map(c => colIndex[c]));
      const hasContent = cells.some((c, i) => c.trim() && !knownIdx.has(i));
      if (!hasContent) { summary.blankRows++; continue; }

      const row = {
        ...values,
        _key: `${sourceIdx}:${r + 1}`,
        _source: src.label,
        _sourceIdx: sourceIdx,
        _sheetRow: r + 1,       // header is sheet row 1
        _issues: [],
        _parent: null,
        _children: [],
      };
      if (cells.length > header.length && cells.slice(header.length).some(c => c.trim())) {
        addIssue("warning", src, row, null, `Row has ${cells.length} cells but the header has ${header.length}; the extra cells were ignored. Check for a missing quote.`);
      }
      fileRows.push(row);
    }
    summary.rowCount = fileRows.length;

    // Work out what kind of file this is
    if (!summary.kind) {
      const moments = fileRows.filter(r => canonical(ALLOWED.tier, r.tier) === MOMENT).length;
      summary.kind = fileRows.length && moments > fileRows.length / 2 ? "moments" : "vertical";
    }
    fileRows.forEach(r => { r._fileKind = summary.kind; });
    rows.push(...fileRows);
  });

  /* ---- Per-row checks ---- */
  const srcOf = r => sources[r._sourceIdx];
  for (const r of rows) {
    const src = srcOf(r);

    if (!r.id) addIssue("error", src, r, "id", "Missing id.");
    if (!r.name) addIssue("error", src, r, "name", "Missing name.");

    // Allowed values
    for (const field of ["tier", "vertical", "campaign_type", "status"]) {
      const raw = r[field];
      const c = canonical(ALLOWED[field], raw);
      if (c === null) {
        addIssue("error", src, r, field, `${field} "${raw}" is not an allowed value. Allowed: ${ALLOWED[field].join(", ")}.`);
        r[`_bad_${field}`] = true;
      } else {
        r[field] = c;
        if (!c) {
          const required = field === "tier" || field === "vertical" || field === "status" || (field === "campaign_type" && r.tier && r.tier !== MOMENT);
          if (required) addIssue("error", src, r, field, `Missing ${field}.`);
        }
      }
    }

    // Tier vs file kind
    if (r.tier === MOMENT && r._fileKind === "vertical") {
      addIssue("error", src, r, "tier", "Seasonal moment found in a vertical file. Moments belong only in the shared Seasonal Moments sheet.");
    } else if ((r.tier === BRAND || r.tier === TACTICAL) && r._fileKind === "moments") {
      addIssue("error", src, r, "tier", `${r.tier} found in the Seasonal Moments file. Campaigns belong in their vertical's sheet.`);
    }

    // Dates
    r._start = null; r._end = null;
    for (const [field, key] of [["start_date", "_start"], ["end_date", "_end"]]) {
      const raw = r[field];
      if (!raw) { addIssue("error", src, r, field, `Missing ${field}.`); continue; }
      const d = parseISODate(raw);
      if (d === null) {
        const hint = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? "is not a real calendar date" : looksLikeDate(raw) ? "must be in YYYY-MM-DD format" : "is not a date";
        addIssue("error", src, r, field, `${field} "${raw}" ${hint}.`);
        r[`_bad_${field}`] = true;
      } else r[key] = d;
    }
    if (r._start !== null && r._end !== null && r._end < r._start) {
      addIssue("error", src, r, "end_date", `end_date ${r.end_date} is before start_date ${r.start_date}.`);
      r._bad_end_date = true;
    }

    // id format (warning)
    if (r.id && r.tier) {
      if (r.tier === MOMENT) {
        if (!/^SM-\d{3,}$/i.test(r.id)) addIssue("warning", src, r, "id", `id "${r.id}" doesn't follow the SM-001 pattern for seasonal moments.`);
      } else if (VERTICAL_CODES[r.vertical]) {
        const code = VERTICAL_CODES[r.vertical], tc = TIER_ID_CODES[r.tier];
        if (!new RegExp(`^${code}-${tc}-\\d{3,}$`, "i").test(r.id)) {
          addIssue("warning", src, r, "id", `id "${r.id}" doesn't follow ${code}-${tc}-001 for a ${r.tier} in ${r.vertical}.`);
        }
      }
    }

    // Budget (warning)
    r._budget = null;
    if (r.budget_qar) {
      const n = Number(r.budget_qar.replace(/[,\s]/g, "").replace(/^QAR/i, ""));
      if (Number.isFinite(n)) r._budget = n;
      else addIssue("warning", src, r, "budget_qar", `budget_qar "${r.budget_qar}" is not a number.`);
    }

    r._channels = r.channels ? r.channels.split(";").map(s => s.trim()).filter(Boolean) : [];
  }

  /* ---- Cross-row checks ---- */
  const byKey = new Map(rows.map(r => [r._key, r]));
  const byId = new Map();   // UPPERCASE id -> [rows], in load order
  for (const r of rows) {
    if (!r.id) continue;
    const k = r.id.toUpperCase();
    if (!byId.has(k)) byId.set(k, []);
    byId.get(k).push(r);
  }
  const where = r => `${r._source} row ${r._sheetRow}`;
  for (const [, list] of byId) {
    if (list.length < 2) continue;
    for (const r of list) {
      const others = list.filter(o => o !== r).map(where).join("; ");
      addIssue("error", srcOf(r), r, "id", `Duplicate id "${r.id}": also used in ${others}.`);
    }
  }

  for (const r of rows) {
    const src = srcOf(r);
    if (!r.parent_id) {
      if (r.tier === TACTICAL) addIssue("warning", src, r, "parent_id", "Tactical campaign has no parent. Link it to a brand campaign or seasonal moment.");
      continue;
    }
    if (r.tier === MOMENT) {
      addIssue("warning", src, r, "parent_id", `Seasonal moments don't have parents; parent_id "${r.parent_id}" is ignored.`);
      continue;
    }
    const candidates = byId.get(r.parent_id.toUpperCase());
    if (!candidates) {
      addIssue("error", src, r, "parent_id", `parent_id "${r.parent_id}" doesn't match any id in the loaded files.`);
      r._bad_parent_id = true;
      continue;
    }
    const p = candidates[0];
    if (p === r) { addIssue("error", src, r, "parent_id", "Row is its own parent."); r._bad_parent_id = true; continue; }
    r._parent = p._key;
    p._children.push(r._key);

    if (r.tier === BRAND && p.tier !== MOMENT) {
      addIssue("warning", src, r, "parent_id", `Brand campaign's parent should be a seasonal moment, but ${p.id} is a ${p.tier || "row with no tier"}.`);
    } else if (r.tier === TACTICAL && p.tier !== MOMENT && p.tier !== BRAND) {
      addIssue("warning", src, r, "parent_id", `Tactical campaign's parent should be a brand campaign or seasonal moment, but ${p.id} is a ${p.tier || "row with no tier"}.`);
    }

    if (r._start !== null && r._end !== null && p._start !== null && p._end !== null &&
        (r._start < p._start || r._end > p._end)) {
      const parts = [];
      if (r._start < p._start) parts.push(`starts ${r.start_date}, before its parent starts (${p.start_date})`);
      if (r._end > p._end) parts.push(`ends ${r.end_date}, after its parent ends (${p.end_date})`);
      addIssue("warning", src, r, "start_date", `Dates fall outside parent ${p.id} "${p.name}": ${parts.join("; ")}.`);
    }
  }

  // Counts per source
  for (const i of issues) {
    const s = summaries.find(x => x.label === i.source);
    if (s) s[i.severity === "error" ? "errors" : "warnings"]++;
  }
  // Sort: file-level first, then by source order and row
  const order = new Map(sources.map((s, i) => [s.label, i]));
  issues.sort((a, b) => (order.get(a.source) - order.get(b.source)) || ((a.sheetRow ?? 0) - (b.sheetRow ?? 0)) || (a.severity === b.severity ? 0 : a.severity === "error" ? -1 : 1));

  return { rows, byKey, byId, issues, sources: summaries };
}

/* CORE:END */
</script>

<script>
/* ================= UI ================= */

const STORAGE_KEY = "marketingTracker.localSources.v1";
const VERTICAL_VAR = {
  "S Market": "--v-smk", "Restaurants": "--v-rst", "Snoomart": "--v-snm", "Grocery": "--v-grc",
  "SLaundry": "--v-sld", "Services": "--v-srv", "New Ventures": "--v-nvt", "Cross-vertical": "--v-cvt",
};
const verticalColor = v => `var(${VERTICAL_VAR[v] || "--v-unknown"})`;

const state = {
  sources: [],          // [{ label, text, origin, kind?, loadError? }]
  data: null,           // result of buildDataset
  view: "month",
  issueFilter: "all",
  cursor: todayDay(),   // day number; the month/week shown is the one containing it
  collapsed: new Set(), // "lane|vertical" keys of collapsed vertical groups
  filters: { verticals: null, tier: "", campaign_type: "", status: "", owner: "" }, // verticals: null = all, else Set
  verticalMenuOpen: false,
  panelKey: null,       // row shown in the side panel
  printWidth: null,     // px width of the printable area while printing
};

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- Loading ---------- */

function storageGet() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { return null; }
}
function storageSet(v) {
  try { v ? localStorage.setItem(STORAGE_KEY, JSON.stringify(v)) : localStorage.removeItem(STORAGE_KEY); } catch { /* storage unavailable */ }
}

async function addFiles(fileList) {
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === "text/csv");
  if (!files.length) return;
  const loaded = await Promise.all(files.map(f => f.text().then(
    text => ({ label: f.name, text, origin: "file" }),
    err => ({ label: f.name, text: "", origin: "file", loadError: String(err) }),
  )));
  // A file with the same name replaces the earlier one, so re-dropping an updated export just works.
  for (const s of loaded) {
    const i = state.sources.findIndex(x => x.label === s.label);
    if (i >= 0) state.sources[i] = s; else state.sources.push(s);
  }
  if (CONFIG.mode === "local") storageSet(state.sources.filter(s => s.origin === "file" && !s.loadError).map(({ label, text }) => ({ label, text })));
  rebuild();
}

async function loadUrls() {
  const fetched = await Promise.all(CONFIG.sources.map(async s => {
    const base = { label: s.label || s.url, origin: "url", kind: s.kind };
    try {
      const res = await fetch(s.url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("got a web page instead of CSV. Use the 'Publish to web' CSV link.");
      return { ...base, text };
    } catch (e) {
      return { ...base, text: "", loadError: e.message || String(e) };
    }
  }));
  // Keep any files dropped on top of the URL sources
  state.sources = [...fetched, ...state.sources.filter(s => s.origin === "file")];
  rebuild();
}

function clearData() {
  state.sources = state.sources.filter(s => s.origin === "url");
  storageSet(null);
  rebuild();
}

function rebuild() {
  state.data = buildDataset(state.sources);
  render();
}

/* ---------- Rendering ---------- */

function render() {
  renderLoaderBar();
  const has = state.sources.length > 0;
  $("#emptyState").classList.toggle("hidden", has);
  $("#sourcesCard").classList.toggle("hidden", !has);
  $("#issuesCard").classList.toggle("hidden", !has);
  $("#filtersCard").classList.toggle("hidden", !has);
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  if (!has) return;
  renderSources();
  renderIssues();
  renderFilters();
  renderPrintHeader();
  const viewEl = { month: "#viewMonth", week: "#viewWeek", data: "#viewData" }[state.view];
  $(viewEl).classList.remove("hidden");
  if (state.view === "data") renderData();
  else if (state.view === "month") renderMonth();
  else if (state.view === "week") renderWeek();
  renderPanel();
}

/* ---------- Monthly roadmap ---------- */

const LANES = [
  { tier: MOMENT, title: "Seasonal Moments", empty: "No seasonal moments this month" },
  { tier: BRAND, title: "Brand Campaigns", empty: "No brand campaigns this month" },
  { tier: TACTICAL, title: "Tactical Campaigns", empty: "No tactical campaigns this month" },
];
const STATUS_LABELS = ["Idea", "Planning", "Live", "Complete", "Paused"];

function cursorMonth() { const d = dayToDate(state.cursor); return [d.getUTCFullYear(), d.getUTCMonth()]; }

let measureCtx = null;
function textWidth(s) {
  if (!measureCtx) {
    measureCtx = document.createElement("canvas").getContext("2d");
    measureCtx.font = `600 12px ${getComputedStyle(document.body).fontFamily}`;
  }
  return measureCtx.measureText(s).width;
}

const barName = r => r.name || r.id || "(no name)";

// Greedy row packing. Each bar claims its own span plus its label when the
// label doesn't fit inside and has to sit beside the bar.
function packBars(items, mStart, mEnd, pxPerDay, trackPx) {
  const sorted = [...items].sort((a, b) => a._start - b._start || b._end - a._end || barName(a).localeCompare(barName(b)));
  const rowEnds = [], rows = [];
  for (const r of sorted) {
    const s = Math.max(r._start, mStart), e = Math.min(r._end, mEnd);
    const x0 = (s - mStart) * pxPerDay, x1 = (e - mStart + 1) * pxPerDay;
    const clipPad = (r._start < mStart ? 16 : 0) + (r._end > mEnd ? 16 : 0);
    const labelW = textWidth(barName(r)) + 16 + clipPad + (r._issues.length ? 12 : 0);
    let pos = "in", ext0 = x0, ext1 = x1;
    if (labelW > x1 - x0) {
      const outW = labelW - clipPad;
      if (x1 + 5 + outW <= trackPx) { pos = "right"; ext1 = x1 + 5 + outW; }
      else if (x0 - 5 - outW >= 0) { pos = "left"; ext0 = x0 - 5 - outW; }
    }
    let i = rowEnds.findIndex(end => end + 6 <= ext0);
    if (i < 0) { i = rowEnds.length; rowEnds.push(0); rows.push([]); }
    rowEnds[i] = ext1;
    rows[i].push({ r, s, e, pos });
  }
  return rows;
}

const pct = (d, mStart, n) => `${((d - mStart) / n) * 100}%`;

function barTitle(r) {
  const p = r._parent ? state.data.byKey.get(r._parent) : null;
  return [
    barName(r),
    `${fmtDay(r._start)} – ${fmtDay(r._end)}`,
    [r.vertical, r.campaign_type, r.status].filter(Boolean).join(" · "),
    p ? `Parent: ${p.name || p.id}` : "",
    r._issues.length ? `${r._issues.length} data issue${r._issues.length > 1 ? "s" : ""}` : "",
  ].filter(Boolean).join("\n");
}

function barHTML(b, mStart, n) {
  const { r } = b;
  const cls = [
    "bar",
    `st-${STATUS_LABELS.includes(r.status) ? r.status.toLowerCase() : "none"}`,
    r._start < b.s ? "clip-l" : "",
    r._end > b.e ? "clip-r" : "",
    b.pos !== "in" ? `lbl-${b.pos}` : "",
  ].filter(Boolean).join(" ");
  const sev = r._issues.some(i => i.severity === "error") ? "error" : r._issues.length ? "warning" : "";
  const width = ((b.e - b.s + 1) / n) * 100;
  return `<button class="${cls}" data-row="${esc(r._key)}" ${r.tier === MOMENT ? `data-moment="${esc(r._key)}"` : ""}
    style="left:${pct(b.s, mStart, n)};width:${width}%;--c:${verticalColor(r.vertical)}" title="${esc(barTitle(r))}">
    <span class="bar-label">${sev ? `<span class="idot ${sev}"></span>` : ""}${esc(barName(r))}</span></button>`;
}

function renderMonth() {
  const [y, m] = cursorMonth();
  const mStart = dayFromYMD(y, m, 1), mEnd = dayFromYMD(y, m + 1, 1) - 1, n = mEnd - mStart + 1;
  const today = todayDay();
  $("#monthTitle").textContent = `${MONTHS_LONG[m]} ${y}`;
  $("#monthJump").value = `${y}-${String(m + 1).padStart(2, "0")}`;

  const allRows = state.data.rows;
  const rows = allRows.filter(passes);
  const dated = rows.filter(r => r._start !== null && r._end !== null);
  const undated = rows.filter(r => r._start === null || r._end === null);
  const inMonth = dated.filter(r => r._start <= mEnd && r._end >= mStart);
  $("#monthCount").textContent = `${inMonth.length} initiative${inMonth.length === 1 ? "" : "s"} this month`;

  // Legend: verticals present in the data, then status styles
  const verticals = ALLOWED.vertical.filter(v => allRows.some(r => r.vertical === v));
  $("#monthLegend").innerHTML = `
    <span class="group"><span class="group-title">Vertical</span>${verticals.map(v =>
      `<span class="item"><span class="sw" style="background:${verticalColor(v)}"></span>${esc(v)}</span>`).join("")}</span>
    <span class="sep"></span>
    <span class="group"><span class="group-title">Status</span>${STATUS_LABELS.map(s =>
      `<span class="item"><span class="sw-bar bar st-${s.toLowerCase()}" style="position:relative;top:0;height:12px;--c:var(--v-smk);padding:0"></span>${s}</span>`).join("")}</span>
    <span class="sep"></span>
    <span class="group"><span class="item"><span class="sw" style="background:rgba(71,85,105,.14);border:1px dashed rgba(71,85,105,.5)"></span>Seasonal moment period</span>
    <span class="item">◀ ▶ Continues past the month</span></span>`;

  // Pixel geometry, used only to decide label placement and row packing
  const tl = $("#timeline");
  const labelW = state.printWidth ? 150 : 210;   // matches --label-w on screen and in print
  const trackPx = (state.printWidth || Math.max(980, tl.parentElement.clientWidth)) - labelW;
  const pxPerDay = trackPx / n;

  // Header: week labels (weeks start Sunday) and day numbers
  let weeks = "", days = "";
  for (let ws = weekStart(mStart); ws <= mEnd; ws += 7) {
    const a = Math.max(ws, mStart), b = Math.min(ws + 6, mEnd);
    const partial = ws < mStart;
    weeks += `<div class="wk-label ${partial ? "partial" : ""}" style="left:${pct(a, mStart, n)};width:${((b - a + 1) / n) * 100}%"
      title="Week of ${fmtDayShort(ws)}">${(b - a + 1) * pxPerDay > 120 ? `Week of ${fmtDayShort(ws)}` : fmtDayShort(ws)}</div>`;
  }
  for (let d = mStart; d <= mEnd; d++) {
    const wd = weekday(d);
    days += `<div class="day-cell ${wd === 0 ? "sun" : ""} ${d === today ? "today" : ""}" style="left:${pct(d, mStart, n)};width:${100 / n}%">
      ${pxPerDay >= 30 ? `<span>${"SMTWTFS"[wd]}</span>` : ""}<b>${dayToDate(d).getUTCDate()}</b></div>`;
  }

  // Background grid: Fri/Sat weekend shading, Sunday week lines, today
  let grid = "";
  for (let d = mStart; d <= mEnd; d++) {
    const wd = weekday(d);
    if (wd === 5) grid += `<div class="weekend" style="left:${pct(d, mStart, n)};width:${(Math.min(2, mEnd - d + 1) / n) * 100}%"></div>`;
    if (wd === 0 && d > mStart) grid += `<div class="wk-line" style="left:${pct(d, mStart, n)}"></div>`;
  }
  if (today >= mStart && today <= mEnd) grid += `<div class="today-line" style="left:calc(${pct(today, mStart, n)} + ${100 / n / 2}%)" title="Today, ${fmtDay(today)}"></div>`;

  // The first packed row carries the group label (if any); the rest leave the label column blank.
  const barRows = (items, firstLabel = "") => packBars(items, mStart, mEnd, pxPerDay, trackPx)
    .map((row, i) => `<div class="tl-row ${i === 0 && firstLabel ? "tl-group-first" : ""}">${i === 0 && firstLabel ? firstLabel : `<div class="tl-label"></div>`}<div class="tl-track">${row.map(b => barHTML(b, mStart, n)).join("")}</div></div>`).join("");

  const laneHead = (lane, count) => `<div class="tl-lane-head"><h3>${lane.title}</h3><span class="muted">${count}</span></div>`;

  // Seasonal moments lane
  const momentLane = LANES[0];
  const moments = inMonth.filter(r => r.tier === MOMENT);
  let body = laneHead(momentLane, moments.length) + (moments.length ? barRows(moments) : `<div class="tl-empty">${momentLane.empty}</div>`);

  // Campaign lanes, grouped by vertical, with moment bands behind them
  const bands = moments.map(r => {
    const s = Math.max(r._start, mStart), e = Math.min(r._end, mEnd);
    return `<div class="band" data-band="${esc(r._key)}" style="left:${pct(s, mStart, n)};width:${((e - s + 1) / n) * 100}%"></div>`;
  }).join("");
  let campaigns = "";
  const unclassified = inMonth.filter(r => !ALLOWED.tier.includes(r.tier));
  const campaignLanes = [...LANES.slice(1)];
  if (unclassified.length) campaignLanes.push({ tier: null, title: "Unclassified (missing or invalid tier)", empty: "" });
  for (const lane of campaignLanes) {
    const items = lane.tier ? inMonth.filter(r => r.tier === lane.tier) : unclassified;
    campaigns += laneHead(lane, items.length);
    if (!items.length) { campaigns += `<div class="tl-empty">${lane.empty}</div>`; continue; }
    const groups = new Map();
    for (const r of items) {
      const v = r.vertical || "(no vertical)";
      if (!groups.has(v)) groups.set(v, []);
      groups.get(v).push(r);
    }
    const order = [...groups.keys()].sort((a, b) => {
      const ia = ALLOWED.vertical.indexOf(a), ib = ALLOWED.vertical.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    for (const v of order) {
      const list = groups.get(v);
      const key = `${lane.title}|${v}`;
      const collapsed = state.collapsed.has(key);
      const minis = collapsed ? list.map(r => {
        const s = Math.max(r._start, mStart), e = Math.min(r._end, mEnd);
        return `<div class="mini-bar" style="left:${pct(s, mStart, n)};width:${((e - s + 1) / n) * 100}%;--c:${verticalColor(r.vertical)}"></div>`;
      }).join("") : "";
      const label = `<div class="tl-label tl-group-head ${collapsed ? "collapsed" : ""}" data-group="${esc(key)}" role="button" aria-expanded="${!collapsed}" tabindex="0"
        title="${collapsed ? "Expand" : "Collapse"} ${esc(v)}"><span class="chev">▾</span><span class="vdot" style="background:${verticalColor(v)};margin:0"></span>${esc(v)} <span class="n">${list.length}</span></div>`;
      if (collapsed) campaigns += `<div class="tl-row tl-group-first">${label}<div class="tl-track">${minis}</div></div>`;
      else campaigns += barRows(list, label);
    }
  }
  body += `<div class="tl-campaigns"><div class="tl-bands">${bands}</div>${campaigns}</div>`;

  tl.innerHTML = `
    <div class="tl-head">
      <div class="tl-row tl-weeks"><div class="tl-label">Week (Sun–Sat)</div><div class="tl-track">${weeks}</div></div>
      <div class="tl-row tl-days"><div class="tl-label"></div><div class="tl-track">${days}</div></div>
    </div>
    <div class="tl-body"><div class="tl-grid">${grid}</div>${body}</div>`;

  $("#monthNote").innerHTML = undated.length
    ? `${undated.length} initiative${undated.length === 1 ? " isn't" : "s aren't"} on the timeline because of missing or invalid dates:
       ${undated.map(r => `<button class="link" data-row="${esc(r._key)}">${esc(r.id || barName(r))}</button>`).join(", ")}. See Data issues.`
    : "";
}

function renderLoaderBar() {
  const bits = [];
  if (CONFIG.mode === "urls") bits.push(`<button data-action="reload">Reload sheets</button>`);
  bits.push(`<button data-action="pick">${CONFIG.mode === "urls" ? "Add CSV files" : "Add or replace CSV files"}</button>`);
  if (state.sources.some(s => s.origin === "file")) bits.push(`<button data-action="clear">Clear data</button>`);
  $("#loaderBar").innerHTML = bits.join("");
}

function countChip(n, sev) {
  return `<span class="count ${n ? sev : "zero"}" title="${n} ${sev}${n === 1 ? "" : "s"}">${n}</span>`;
}

function renderSources() {
  const { sources, rows } = state.data;
  $("#sourcesSummary").textContent = `${sources.length} file${sources.length === 1 ? "" : "s"}, ${rows.length} initiatives`;
  $("#sourcesBody").innerHTML = `
    <table class="grid">
      <thead><tr><th>Source</th><th>Type</th><th class="num">Rows</th><th>Errors</th><th>Warnings</th><th>Notes</th></tr></thead>
      <tbody>${sources.map(s => `
        <tr>
          <td><strong>${esc(s.label)}</strong> <span class="faint">${s.origin === "url" ? "· sheet URL" : "· local file"}</span></td>
          <td>${s.loadError ? "" : `<span class="kind-tag">${s.kind === "moments" ? "Seasonal moments" : "Vertical"}${s.kindInferred ? "" : " (set in config)"}</span>`}</td>
          <td class="num">${s.rowCount}</td>
          <td>${countChip(s.errors, "error")}</td>
          <td>${countChip(s.warnings, "warning")}</td>
          <td class="muted">${s.loadError ? `<span class="load-error">${esc(s.loadError)}</span>` : s.blankRows ? `${s.blankRows} blank row${s.blankRows === 1 ? "" : "s"} skipped` : ""}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}

function renderIssues() {
  const { issues } = state.data;
  const nErr = issues.filter(i => i.severity === "error").length;
  const nWarn = issues.length - nErr;
  $("#issuesCounts").innerHTML = `${countChip(nErr, "error")} ${countChip(nWarn, "warning")}`;
  document.querySelectorAll("#issueFilters button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.sev === state.issueFilter)));
  const shown = issues.filter(i => state.issueFilter === "all" || i.severity === state.issueFilter);
  if (!issues.length) { $("#issuesBody").innerHTML = `<div class="empty-note">No issues found.</div>`; return; }
  if (!shown.length) { $("#issuesBody").innerHTML = `<div class="empty-note">No ${state.issueFilter}s.</div>`; return; }
  $("#issuesBody").innerHTML = `
    <table class="grid">
      <thead><tr><th></th><th>Where</th><th>id</th><th>Problem</th></tr></thead>
      <tbody>${shown.map(i => `
        <tr class="${i.rowKey ? "clickable" : ""}" ${i.rowKey ? `data-row="${esc(i.rowKey)}"` : ""}>
          <td><span class="sev ${i.severity}">${i.severity === "error" ? "Error" : "Warning"}</span></td>
          <td style="white-space:nowrap">${esc(i.source)}${i.sheetRow ? ` <span class="muted">· row ${i.sheetRow}</span>` : ` <span class="muted">· file</span>`}</td>
          <td class="mono">${esc(i.id)}</td>
          <td>${esc(i.message)}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
}

function renderData() {
  const { byKey } = state.data;
  const rows = state.data.rows.filter(passes);
  $("#dataSummary").textContent = `${rows.length} of ${state.data.rows.length} rows from ${state.data.sources.length} files`;
  const cell = (r, f, text = r[f]) => r[`_bad_${f}`] ? `<span class="bad-value">${esc(text || "—")}</span>` : esc(text);
  $("#dataBody").innerHTML = `
    <table class="grid">
      <thead><tr><th>id</th><th>Name</th><th>Tier</th><th>Parent</th><th>Vertical</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Channels</th><th>Source</th><th>Issues</th></tr></thead>
      <tbody>${rows.map(r => {
        const err = r._issues.some(i => i.severity === "error"), warn = r._issues.length && !err;
        const p = r._parent ? byKey.get(r._parent) : null;
        return `<tr id="row-${esc(r._key)}" data-row="${esc(r._key)}" class="clickable ${err ? "has-error" : warn ? "has-warning" : ""}">
          <td class="mono">${esc(r.id) || `<span class="bad-value">—</span>`}</td>
          <td>${esc(r.name)}</td>
          <td>${cell(r, "tier")}</td>
          <td>${p ? `<span class="mono">${esc(p.id)}</span> <span class="muted">${esc(p.name)}</span>` : cell(r, "parent_id")}</td>
          <td style="white-space:nowrap">${r.vertical ? `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>` : ""}${cell(r, "vertical")}</td>
          <td>${cell(r, "campaign_type")}</td>
          <td style="white-space:nowrap">${cell(r, "start_date")}</td>
          <td style="white-space:nowrap">${cell(r, "end_date")}</td>
          <td>${cell(r, "status")}</td>
          <td class="muted">${esc(r._channels.join(", "))}</td>
          <td class="muted" style="white-space:nowrap">${esc(r._source)} · ${r._sheetRow}</td>
          <td>${r._issues.length ? r._issues.map(i => `<span class="sev ${i.severity}" title="${esc(i.message)}">${i.severity === "error" ? "E" : "W"}</span>`).join(" ") : ""}</td>
        </tr>`;
      }).join("")}
      </tbody>
    </table>`;
}

/* ---------- Filters ---------- */

const NO_OWNER = "(no owner)";

// Seasonal moments ignore the vertical, campaign type and owner filters,
// so every vertical always sees the moments it plans around.
function passes(r) {
  const f = state.filters;
  if (f.tier && r.tier !== f.tier) return false;
  if (f.status && r.status !== f.status) return false;
  if (r.tier === MOMENT) return true;
  if (f.verticals && !f.verticals.has(r.vertical)) return false;
  if (f.campaign_type && r.campaign_type !== f.campaign_type) return false;
  if (f.owner && (r.owner || NO_OWNER) !== f.owner) return false;
  return true;
}

function filterParts() {
  const f = state.filters, parts = [];
  if (f.verticals) parts.push(`Vertical: ${f.verticals.size ? [...f.verticals].join(", ") : "none"}`);
  if (f.tier) parts.push(`Tier: ${f.tier}`);
  if (f.campaign_type) parts.push(`Type: ${f.campaign_type}`);
  if (f.status) parts.push(`Status: ${f.status}`);
  if (f.owner) parts.push(`Owner: ${f.owner}`);
  return parts;
}

function uniqueSorted(values, order) {
  const set = [...new Set(values)];
  return set.sort((a, b) => {
    const ia = order ? order.indexOf(a) : -1, ib = order ? order.indexOf(b) : -1;
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
}

function renderFilters() {
  const rows = state.data.rows, f = state.filters;
  const campaigns = rows.filter(r => r.tier !== MOMENT);
  const vOpts = uniqueSorted(campaigns.map(r => r.vertical).filter(Boolean), ALLOWED.vertical);
  const typeOpts = uniqueSorted(campaigns.map(r => r.campaign_type).filter(Boolean), ALLOWED.campaign_type);
  const ownerOpts = uniqueSorted(campaigns.map(r => r.owner || NO_OWNER));

  const sel = (name, label, options) => `
    <label>${label}
      <select data-filter="${name}" class="${f[name] ? "active" : ""}">
        <option value="">All</option>
        ${uniqueSorted([...options, ...(f[name] ? [f[name]] : [])], options).map(o => `<option ${f[name] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
      </select>
    </label>`;

  const vSummary = !f.verticals ? "All" : !f.verticals.size ? "None" : f.verticals.size <= 2 ? [...f.verticals].join(", ") : `${f.verticals.size} selected`;
  const shown = rows.filter(passes).length;
  $("#filterBar").innerHTML = `
    <label>Vertical
      <details class="ms ${f.verticals ? "active" : ""}" ${state.verticalMenuOpen ? "open" : ""}>
        <summary>${esc(vSummary)}</summary>
        <div class="ms-menu">
          <div class="ms-actions"><button class="link" data-action="all-verticals">All verticals</button></div>
          ${vOpts.map(v => `<label><input type="checkbox" data-vertical="${esc(v)}" ${!f.verticals || f.verticals.has(v) ? "checked" : ""}>
            <span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</label>`).join("") || `<div class="faint" style="padding:6px 8px">No campaigns loaded</div>`}
        </div>
      </details>
    </label>
    ${sel("tier", "Tier", ALLOWED.tier)}
    ${sel("campaign_type", "Type", typeOpts)}
    ${sel("status", "Status", ALLOWED.status)}
    ${sel("owner", "Owner", ownerOpts)}
    <span class="filter-note">Showing ${shown} of ${rows.length}${filterParts().length ? ` · seasonal moments stay visible across verticals · <button class="link" data-action="clear-filters">Clear filters</button>` : ""}</span>`;
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.filter) {
    state.filters[t.dataset.filter] = t.value;
    render();
  } else if (t.dataset.vertical !== undefined) {
    const all = [...document.querySelectorAll("[data-vertical]")];
    const checked = all.filter(c => c.checked).map(c => c.dataset.vertical);
    state.filters.verticals = checked.length === all.length ? null : new Set(checked);
    render();
  }
});
document.addEventListener("toggle", e => {
  if (e.target.classList?.contains("ms")) state.verticalMenuOpen = e.target.open;
}, true);

/* ---------- Weekly view ---------- */

const TIER_ORDER = [MOMENT, BRAND, TACTICAL];
const TIER_PLURAL = { [MOMENT]: "Seasonal Moments", [BRAND]: "Brand Campaigns", [TACTICAL]: "Tactical Campaigns" };

function statusChip(status) {
  const known = STATUS_LABELS.includes(status);
  return `<span class="chip st-${known ? status.toLowerCase() : "none"}">${esc(status || "No status")}</span>`;
}

function weekCard(r, ws, we, kind) {
  const p = r._parent ? state.data.byKey.get(r._parent) : null;
  let when;
  if (kind === "launching") {
    when = `Launches <b>${fmtDayShort(r._start)}</b>` +
      (r._end === r._start ? " · one day" : r._end <= we ? ` · ends ${fmtDayShort(r._end)}` : ` · runs to ${fmtDay(r._end)}`);
  } else if (kind === "ending") {
    when = `Ends <b>${fmtDayShort(r._end)}</b> · started ${fmtDay(r._start)}`;
  } else {
    when = `Since ${fmtDay(r._start)} · until <b>${fmtDay(r._end)}</b>`;
  }
  const facts = [
    `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>${esc(r.vertical || "No vertical")}`,
    r.campaign_type ? esc(r.campaign_type) : "",
    `Owner: ${r.owner ? `<b>${esc(r.owner)}</b>` : `<span class="faint">none</span>`}`,
  ].filter(Boolean).join(" · ");
  let parent = "";
  if (p) parent = `↳ Parent: ${esc(p.name || p.id)}`;
  else if (r.parent_id) parent = `↳ Parent: <span class="bad-value">${esc(r.parent_id)}</span> (not found)`;
  else if (r.tier !== MOMENT) parent = `↳ <span class="faint">No parent</span>`;
  return `<button class="wk-card" data-row="${esc(r._key)}" style="--c:${verticalColor(r.vertical)}">
    <div class="t"><span class="name">${r._issues.length ? `<span class="idot ${r._issues.some(i => i.severity === "error") ? "error" : "warning"}" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:${r._issues.some(i => i.severity === "error") ? "var(--error)" : "#e08a00"}"></span>` : ""}${esc(barName(r))}</span>${statusChip(r.status)}</div>
    <div class="meta">${when}</div>
    <div class="meta">${facts}</div>
    <div class="meta">Channels: ${r._channels.length ? esc(r._channels.join(", ")) : `<span class="faint">none</span>`}</div>
    ${parent ? `<div class="parent">${parent}</div>` : ""}
  </button>`;
}

function weekSection(items, ws, we, kind) {
  let html = "";
  const tiers = [...TIER_ORDER, null];
  for (const tier of tiers) {
    const inTier = items.filter(r => tier ? r.tier === tier : !TIER_ORDER.includes(r.tier));
    if (!inTier.length) continue;
    html += `<div class="wk-tier">${tier ? TIER_PLURAL[tier] : "Unclassified (missing or invalid tier)"}</div>`;
    const verticals = uniqueSorted(inTier.map(r => r.vertical || "(no vertical)"), ALLOWED.vertical);
    for (const v of verticals) {
      const list = inTier.filter(r => (r.vertical || "(no vertical)") === v)
        .sort((a, b) => a._start - b._start || a._end - b._end || barName(a).localeCompare(barName(b)));
      if (tier !== MOMENT) html += `<div class="wk-vertical"><span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</div>`;
      html += list.map(r => weekCard(r, ws, we, kind)).join("");
    }
  }
  return html;
}

function renderWeek() {
  const ws = weekStart(state.cursor), we = ws + 6;
  const endDate = dayToDate(we);
  $("#weekTitle").textContent = `Week of ${fmtDayShort(ws)}`;
  $("#weekRange").textContent = `${fmtDayShort(ws)} – ${fmtDayShort(we)} ${endDate.getUTCFullYear()}`;
  $("#weekJump").value = dayToISO(state.cursor);

  const rows = state.data.rows.filter(passes);
  const dated = rows.filter(r => r._start !== null && r._end !== null);
  // Each initiative lands in exactly one section.
  const sections = [
    ["launching", "Launching this week", dated.filter(r => r._start >= ws && r._start <= we), "Nothing launching this week"],
    ["live", "Live this week", dated.filter(r => r._start < ws && r._end > we), "Nothing running through this week"],
    ["ending", "Ending this week", dated.filter(r => r._start < ws && r._end >= ws && r._end <= we), "Nothing ending this week"],
  ];
  $("#weekBody").innerHTML = sections.map(([kind, title, items, empty]) => `
    <div class="week-col">
      <h3>${title} <span class="muted">${items.length}</span></h3>
      ${items.length ? weekSection(items, ws, we, kind) : `<div class="wk-empty">${empty}</div>`}
    </div>`).join("");
  renderUndatedNote("#weekNote", rows);
}

function renderUndatedNote(sel, rows) {
  const undated = rows.filter(r => r._start === null || r._end === null);
  $(sel).innerHTML = undated.length
    ? `${undated.length} initiative${undated.length === 1 ? " isn't" : "s aren't"} shown because of missing or invalid dates:
       ${undated.map(r => `<button class="link" data-row="${esc(r._key)}">${esc(r.id || barName(r))}</button>`).join(", ")}. See Data issues.`
    : "";
}

/* ---------- Side panel ---------- */

function openPanel(key) { state.panelKey = key; renderPanel(); }
function closePanel() { state.panelKey = null; renderPanel(); }

function relCard(r) {
  const dates = r._start !== null && r._end !== null ? `${fmtDay(r._start)} – ${fmtDay(r._end)}` : "invalid dates";
  return `<button class="rel" data-row="${esc(r._key)}" style="--c:${verticalColor(r.vertical)}">
    <span class="grow"><strong>${esc(barName(r))}</strong>
      <div class="sub">${[r.tier, r.vertical, dates].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="sub faint">${esc(r._source)} · row ${r._sheetRow}</div></span>
    ${statusChip(r.status)}</button>`;
}

function renderPanel() {
  const root = $("#panelRoot");
  const r = state.panelKey && state.data ? state.data.byKey.get(state.panelKey) : null;
  if (!r) { root.innerHTML = ""; return; }
  const { byKey } = state.data;
  const p = r._parent ? byKey.get(r._parent) : null;
  const children = r._children.map(k => byKey.get(k)).sort((a, b) => (a._start ?? 1e9) - (b._start ?? 1e9) || barName(a).localeCompare(barName(b)));
  const bad = f => r[`_bad_${f}`];
  const val = (f, text = r[f]) => text ? (bad(f) ? `<span class="bad-value">${esc(text)}</span>` : esc(text)) : `<span class="faint">—</span>`;
  const days = r._start !== null && r._end !== null ? r._end - r._start + 1 : null;
  const textBlock = (label, f) => {
    const v = r[f];
    let body;
    if (!v) body = `<p class="text empty">Not filled in</p>`;
    else if (f === "top_highlights" && v.includes(";")) body = `<ul class="bullets">${v.split(";").map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
    else body = `<p class="text">${esc(v)}</p>`;
    return `<h4>${label}</h4>${body}`;
  };

  root.innerHTML = `
    <div class="panel-backdrop" data-action="close-panel"></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head" style="--c:${verticalColor(r.vertical)}">
        <div class="top">
          <span class="chip tier">${esc(r.tier || "No tier")}</span>${statusChip(r.status)}
          <button class="close" data-action="close-panel" aria-label="Close">×</button>
        </div>
        <h2 id="panelTitle">${esc(barName(r))}</h2>
        <div class="muted"><span class="mono">${esc(r.id || "no id")}</span> · ${esc(r._source)}, row ${r._sheetRow}</div>
      </div>
      <div class="panel-body">
        <dl>
          <dt>Vertical</dt><dd>${r.vertical ? `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>` : ""}${val("vertical")}</dd>
          <dt>Campaign type</dt><dd>${val("campaign_type")}</dd>
          <dt>Dates</dt><dd>${r._start !== null ? fmtDayShort(r._start) + " " + dayToDate(r._start).getUTCFullYear() : val("start_date")} – ${r._end !== null ? fmtDayShort(r._end) + " " + dayToDate(r._end).getUTCFullYear() : val("end_date")}${days ? ` <span class="muted">(${days} day${days === 1 ? "" : "s"})</span>` : ""}</dd>
          <dt>Owner</dt><dd>${val("owner")}</dd>
          <dt>Channels</dt><dd>${r._channels.length ? r._channels.map(c => `<span class="ch">${esc(c)}</span>`).join("") : `<span class="faint">—</span>`}</dd>
          <dt>Budget</dt><dd>${r._budget !== null ? `QAR ${r._budget.toLocaleString("en-US")}` : r.budget_qar ? `<span class="bad-value">${esc(r.budget_qar)}</span>` : `<span class="faint">—</span>`}</dd>
          <dt>Source</dt><dd>${esc(r._source)} · row ${r._sheetRow}</dd>
        </dl>
        ${r._start !== null && r._end !== null ? `<button data-action="locate" data-key="${esc(r._key)}">Show on month roadmap</button>` : ""}

        ${r._issues.length ? `<h4>Data issues (${r._issues.length})</h4>${r._issues.map(i => `<div class="issue"><span class="sev ${i.severity}">${i.severity === "error" ? "Error" : "Warning"}</span><span>${esc(i.message)}</span></div>`).join("")}` : ""}

        <h4>Parent</h4>
        ${p ? relCard(p) : r.parent_id ? `<p class="text"><span class="bad-value">${esc(r.parent_id)}</span> doesn't match any loaded id.</p>` : `<p class="text empty">${r.tier === MOMENT ? "Seasonal moments have no parent" : "No parent"}</p>`}

        <h4>Children (${children.length})</h4>
        ${children.length ? children.map(relCard).join("") : `<p class="text empty">No initiatives link to this one</p>`}

        ${textBlock("Brief", "brief")}
        ${textBlock("Target audience", "target_audience")}
        ${textBlock("Goal", "goal")}
        ${textBlock("KPIs", "kpis")}
        ${textBlock("Key message", "key_message")}
        ${textBlock("Top highlights", "top_highlights")}
        ${textBlock("Notes", "notes")}
      </div>
    </aside>`;
  root.querySelector(".close").focus({ preventScroll: true });
}

function locate(key) {
  const r = state.data.byKey.get(key);
  if (!r || r._start === null) return;
  state.panelKey = null;
  state.view = "month";
  const visibleStart = r._start;
  state.cursor = visibleStart;
  render();
  const bar = document.querySelector(`.bar[data-row="${CSS.escape(key)}"]`);
  if (bar) {
    bar.scrollIntoView({ block: "center", behavior: "smooth" });
    bar.classList.remove("pulse"); void bar.offsetWidth; bar.classList.add("pulse");
  }
}

/* ---------- Print ---------- */

const PAPER_WIDTH_MM = { A4: 297, A3: 420 };
const PRINT_MARGIN_MM = 10;

function applyPaperSize() {
  const size = $("#paperSize").value;
  let el = document.getElementById("pageSize");
  if (!el) { el = document.createElement("style"); el.id = "pageSize"; document.head.appendChild(el); }
  el.textContent = `@page { size: ${size} landscape; margin: ${PRINT_MARGIN_MM}mm; }`;
  try { localStorage.setItem("marketingTracker.paper", size); } catch { /* ignore */ }
}

function renderPrintHeader() {
  let title;
  if (state.view === "week") {
    const ws = weekStart(state.cursor);
    title = `Marketing plan · Week of ${fmtDayShort(ws)} ${dayToDate(ws).getUTCFullYear()}`;
  } else if (state.view === "month") {
    const [y, m] = cursorMonth();
    title = `Marketing plan · ${MONTHS_LONG[m]} ${y}`;
  } else title = "Marketing plan · All initiatives";
  const parts = filterParts();
  $("#printHeader").innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="sub">${parts.length ? esc(parts.join(" · ")) + "<br>" : ""}
      Sources: ${esc(state.data.sources.map(s => s.label).join(", "))}<br>
      Printed ${fmtDay(todayDay())}</div>`;
}

window.addEventListener("beforeprint", () => {
  // Re-pack bars for the paper width so labels beside bars don't collide.
  const mm = PAPER_WIDTH_MM[$("#paperSize").value] - 2 * PRINT_MARGIN_MM;
  state.printWidth = Math.floor(mm / 25.4 * 96);
  if (state.view === "month" && state.data?.rows.length) renderMonth();
});
window.addEventListener("afterprint", () => {
  state.printWidth = null;
  if (state.view === "month" && state.data?.rows.length) renderMonth();
});

/* ---------- Events ---------- */

document.addEventListener("click", e => {
  if (state.verticalMenuOpen && !e.target.closest(".ms")) { state.verticalMenuOpen = false; renderFilters(); }
  const t = e.target.closest("[data-action],[data-view],[data-toggle],[data-sev],[data-row],[data-nav],[data-group]");
  if (!t) return;
  if (t.dataset.action === "pick") $("#filePicker").click();
  else if (t.dataset.action === "clear") clearData();
  else if (t.dataset.action === "reload") loadUrls();
  else if (t.dataset.action === "today") { state.cursor = todayDay(); render(); }
  else if (t.dataset.action === "close-panel") closePanel();
  else if (t.dataset.action === "locate") locate(t.dataset.key);
  else if (t.dataset.action === "print") { if (state.view === "data") { state.view = "month"; render(); } window.print(); }
  else if (t.dataset.action === "clear-filters") { state.filters = { verticals: null, tier: "", campaign_type: "", status: "", owner: "" }; render(); }
  else if (t.dataset.action === "all-verticals") { state.filters.verticals = null; render(); }
  else if (t.dataset.nav) { step(+t.dataset.nav); }
  else if (t.dataset.group) {
    const k = t.dataset.group;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    render();
  }
  else if (t.dataset.view) { state.view = t.dataset.view; render(); }
  else if (t.dataset.toggle) $(`#${t.dataset.toggle}`).classList.toggle("collapsed");
  else if (t.dataset.sev) { state.issueFilter = t.dataset.sev; renderIssues(); }
  else if (t.dataset.row) openPanel(t.dataset.row);
});
$("#filePicker").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });

function step(dir) {
  if (state.view === "week") state.cursor += 7 * dir;
  else { const [y, m] = cursorMonth(); state.cursor = dayFromYMD(y, m + dir, 1); }
  render();
}
$("#weekJump").addEventListener("change", e => {
  const d = parseISODate(e.target.value || "");
  if (d !== null) { state.cursor = d; render(); }
});
$("#paperSize").addEventListener("change", applyPaperSize);
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.panelKey) closePanel(); });
$("#monthJump").addEventListener("change", e => {
  const [y, m] = (e.target.value || "").split("-").map(Number);
  if (y && m) { state.cursor = dayFromYMD(y, m - 1, 1); render(); }
});
document.addEventListener("keydown", e => {
  const g = e.target.closest?.("[data-group]");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); g.click(); }
});
// Hovering a seasonal moment highlights its band behind the campaigns
document.addEventListener("mouseover", e => {
  const m = e.target.closest?.("[data-moment]");
  document.querySelectorAll(".band.hl").forEach(b => b.classList.remove("hl"));
  if (m) document.querySelector(`.band[data-band="${CSS.escape(m.dataset.moment)}"]`)?.classList.add("hl");
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.view === "month" && state.data?.rows.length) renderMonth(); }, 120);
});

let dragDepth = 0;
document.addEventListener("dragenter", e => { if (e.dataTransfer?.types.includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove("dragging"); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

/* ---------- Start ---------- */

try { const paper = localStorage.getItem("marketingTracker.paper"); if (paper) $("#paperSize").value = paper; } catch { /* ignore */ }
applyPaperSize();

if (CONFIG.mode === "urls") {
  render();
  loadUrls();
} else {
  const saved = storageGet();
  if (Array.isArray(saved)) state.sources = saved.map(s => ({ ...s, origin: "file" }));
  rebuild();
}
</script>
</body>
</html>
