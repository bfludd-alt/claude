<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Tracker</title>
<script>
// Show script errors on the page instead of failing silently (the Apps Script
// web app has no visible console). Kept tiny and first, so it runs even if a
// later script is broken.
function showScriptError(message, line) {
  var show = function () {
    var box = document.getElementById("scriptError") || document.body.insertBefore(document.createElement("div"), document.body.firstChild);
    box.id = "scriptError";
    box.style.cssText = "background:#fdecec;color:#8f1d1d;border:1px solid #c62828;padding:10px 14px;margin:8px;border-radius:6px;font:13px/1.4 sans-serif;white-space:pre-wrap";
    box.textContent = "The tracker hit a script error, so parts of the page may be missing:\n" + message + (line ? " (line " + line + ")" : "") +
      "\nBrowser: " + navigator.userAgent + "\nSend this message to whoever maintains the tracker.";
  };
  document.body ? show() : document.addEventListener("DOMContentLoaded", show);
}
window.addEventListener("error", function (e) {
  showScriptError(String(e.message || e.error || "unknown error"), e.lineno);
});
// Errors inside async code arrive here instead of as "error" events.
window.addEventListener("unhandledrejection", function (e) {
  var r = e.reason;
  showScriptError(String((r && (r.stack || r.message)) || r || "unknown error"));
});
</script>
<script>
/* ============================================================
   CONFIG — edit this block to point the tracker at your data.
   ============================================================
   publishedId  The id in the "Publish to web" link of the whole spreadsheet:
                https://docs.google.com/spreadsheets/d/e/<publishedId>/pub?output=csv
                (File > Share > Publish to web > Entire document > CSV)

   sources      One entry per tab: { label, type, sheetUrl }
     label      The tab's name. For campaign tabs it's also the vertical.
     type       "moments"     the shared Seasonal Moments tab
                "campaigns"   a vertical's brand and tactical campaigns
                "kpi_engine"  the forecasting engine's KPI tab (title row 1, header row 2)
     sheetUrl   The tab's normal link, copied from the address bar with the tab open:
                https://docs.google.com/spreadsheets/d/<sheet id>/edit?gid=<tab id>#gid=<tab id>

   Everything else is worked out from these: each tab's published CSV link,
   the "Edit in sheet" links, and the vertical of each campaign tab.

   mode         How the page loads data when it is NOT running as the Apps Script
                web app (inside Apps Script it always reads the tabs directly):
                "local" (default) start with the drop zone; drop CSV exports.
                "urls"  fetch each tab's "Publish to web" CSV link.
                Dropping CSV files on the page works in every mode.

   In the Apps Script web app only `label` and `type` are used: tabs are found
   by name and the edit links come from the spreadsheet itself. `sheetUrl` and
   `publishedId` are only needed for the "urls" mode and for edit links on
   dropped files.
*/
const CONFIG = {
  mode: "local",
  publishedId: "2PACX-1vTBY2uU0M5EwJeEiWFK2y06GTMz881OKAonyKdnk3oT0qR7JbU07h4BoKEuLzHIMpn4KkrTH4e3eH4k",
  sources: [
    { label: "Seasonal Moments", type: "moments",    sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=680008376#gid=680008376" },
    { label: "S Market",         type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=1579014905#gid=1579014905" },
    { label: "Restaurants",      type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=692704700#gid=692704700" },
    { label: "Snoomart",         type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=446324488#gid=446324488" },
    { label: "Grocery",          type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=1905035169#gid=1905035169" },
    { label: "S Laundry",        type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=736725729#gid=736725729" },
    { label: "Services",         type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=2033078747#gid=2033078747" },
    { label: "New Ventures",     type: "campaigns",  sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=312703355#gid=312703355" },
    { label: "KPI Forecast",     type: "kpi_engine", sheetUrl: "https://docs.google.com/spreadsheets/d/1OaZGZvHlUkY_aj_yv5Isew1L2acdSrsE15JZylrYmJI/edit?gid=1008622602#gid=1008622602" },
  ],

  // Values allowed in relevant_verticals that are audiences, not campaign verticals.
  informationalAudiences: ["Brand", "City"],

  // KPI definitions. unit: "count" or "QAR". agg: "sum" (added up over days).
  // derived: [numerator, denominator]; recalculated from the totals, never summed or averaged.
  kpiDefinitions: {
    orders:  { label: "Orders", unit: "count", agg: "sum", direction: "higher_is_better" },
    gmv_qar: { label: "GMV",    unit: "QAR",   agg: "sum", direction: "higher_is_better" },
    aov_qar: { label: "AOV",    unit: "QAR",   derived: ["gmv_qar", "orders"], direction: "higher_is_better" },
  },

  // Status colours. "scenarios": green at/above forecast, amber below forecast
  // but at/above bear, red below bear, blue above bull. Sources or KPIs without
  // bear/bull (and derived KPIs such as AOV) use the threshold instead:
  // red more than thresholdPct below forecast, blue more than thresholdPct above.
  kpiStatus: { mode: "scenarios", thresholdPct: 5 },
};
</script>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #dfe3e8;
  --border-strong: #c5ccd5;
  --text: #17202b;
  --text-2: #5a6573;
  --text-3: #8a94a1;
  --accent: #1f6feb;
  --error: #c62828;
  --error-bg: #fdecec;
  --warn: #a35c00;
  --warn-bg: #fff4e0;
  --ok: #1b7a3a;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);

  /* Vertical colours (bars, legend, chips) */
  --v-smk: #2563eb;
  --v-rst: #dc2626;
  --v-snm: #d97706;
  --v-grc: #16a34a;
  --v-sld: #0891b2;
  --v-srv: #7c3aed;
  --v-nvt: #db2777;
  --v-cvt: #475569;
  --v-unknown: #9ca3af;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 12px;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); }
button.link:hover { text-decoration: underline; background: none; }

/* ---------- Header ---------- */
.app-header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.app-header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.app-header .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 14px; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--text); color: #fff; }
.issue-badge {
  display: inline-flex; gap: 6px; align-items: center;
}
.count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: center; }
.count.error { background: var(--error-bg); color: var(--error); }
.count.warning { background: var(--warn-bg); color: var(--warn); }
.count.zero { background: var(--surface-2); color: var(--text-3); }

main { padding: 16px 20px 40px; max-width: 1600px; margin: 0 auto; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card > header {
  display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.card > header h2 { font-size: 14px; margin: 0; font-weight: 650; }
.card > header .spacer { flex: 1; }
.card.collapsed > :not(header) { display: none; }
.card.collapsed > header { border-bottom: 0; }
.chev { display: inline-block; transition: transform .15s; color: var(--text-3); }
.card.collapsed .chev { transform: rotate(-90deg); }
.card-toggle { border: 0; background: none; padding: 0; display: flex; gap: 8px; align-items: center; }
.card-toggle:hover { background: none; }

table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.grid th { font-weight: 600; color: var(--text-2); background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }
.scroll { overflow: auto; max-height: 420px; }

/* ---------- Loader ---------- */
.loader-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 48px 20px;
  text-align: center;
  background: var(--surface);
}
.dropzone h2 { margin: 0 0 6px; font-size: 18px; }
.dropzone p { margin: 0 0 16px; color: var(--text-2); }
.drop-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(31, 111, 235, .12);
  border: 3px dashed var(--accent);
  display: none; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600; color: var(--accent);
  pointer-events: none;
}
body.dragging .drop-overlay { display: flex; }
.kind-tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.load-error { color: var(--error); }

/* ---------- Issues ---------- */
.issue-filters { display: inline-flex; gap: 4px; }
.issue-filters button { padding: 2px 10px; font-size: 12px; border-radius: 12px; }
.issue-filters button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.sev { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; }
.sev.error { color: var(--error); background: var(--error-bg); }
.sev.warning { color: var(--warn); background: var(--warn-bg); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #f7f9fc; }
.empty-note { padding: 14px; color: var(--text-2); }

/* ---------- Data table ---------- */
tr.has-error td:first-child { box-shadow: inset 3px 0 0 var(--error); }
tr.has-warning td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: #fff3b0; } to { background: transparent; } }
.vdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.bad-value { color: var(--error); text-decoration: underline wavy var(--error); text-underline-offset: 3px; }

/* ---------- Period toolbar (month + week views) ---------- */
.period-bar { flex-wrap: wrap; }
.period-nav { display: inline-flex; align-items: center; gap: 4px; }
.period-nav button { padding: 4px 10px; font-size: 16px; line-height: 1; }
.period-nav h2 { font-size: 16px !important; min-width: 190px; text-align: center; }
input[type="month"] { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); }

/* ---------- Legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-2); align-items: center; }
.legend .group { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .group-title { font-weight: 600; color: var(--text); margin-right: 2px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .sw-bar { width: 26px; height: 12px; border-radius: 3px; display: inline-block; position: relative; }
.legend .sep { width: 1px; align-self: stretch; background: var(--border); }

/* ---------- Timeline ---------- */
.tl-scroll { overflow-x: auto; }
.tl { --label-w: 210px; --row-h: 28px; min-width: 980px; position: relative; font-size: 12px; }
.tl-row { display: flex; min-height: var(--row-h); }
.tl-label { flex: 0 0 var(--label-w); width: var(--label-w); padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--surface); position: relative; z-index: 3; }
.tl-track { flex: 1; position: relative; min-width: 0; }

.tl-head { border-bottom: 1px solid var(--border-strong); background: var(--surface); }
.tl-head .tl-row { min-height: 0; }
.tl-weeks .tl-track, .tl-days .tl-track { height: 22px; }
.tl-weeks .tl-label, .tl-days .tl-label { color: var(--text-3); font-size: 11px; }
.wk-label { position: absolute; top: 0; height: 22px; display: flex; align-items: center; padding-left: 6px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--border-strong); }
.wk-label.partial { color: var(--text-3); font-weight: 500; }
.day-cell { position: absolute; top: 0; height: 22px; display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.day-cell b { color: var(--text-2); font-weight: 600; }
.day-cell.sun { border-left: 1px solid var(--border-strong); }
.day-cell.today b { background: var(--error); color: #fff; border-radius: 9px; padding: 0 5px; }

.tl-body { position: relative; }
.tl-grid { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 0; pointer-events: none; z-index: 0; }
.tl-grid .weekend { position: absolute; top: 0; bottom: 0; background: rgba(23, 32, 43, .025); }
.tl-grid .wk-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); }
.tl-grid .today-line { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--error); z-index: 4; }
.tl-grid .today-line::before { content: ""; position: absolute; top: -4px; left: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--error); }

.tl-lane-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px 6px; background: var(--surface-2); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
.tl-lane-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--text); }
.tl-lane-head .muted { font-size: 12px; }
.tl-group-first { border-top: 1px solid var(--border); }
.tl-campaigns .tl-lane-head + .tl-group-first { border-top: 0; }
.tl-group-head { cursor: pointer; font-weight: 600; color: var(--text); }
.tl-group-head:hover { background: var(--surface-2); }
.tl-group-head .chev { font-size: 10px; width: 10px; }
.tl-group-head.collapsed .chev { transform: rotate(-90deg); }
.tl-group-head .n { color: var(--text-3); font-weight: 500; }
.tl-empty { padding: 8px 14px; color: var(--text-3); font-style: italic; position: relative; z-index: 3; }

.tl-campaigns { position: relative; }
.tl-bands { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 0; pointer-events: none; z-index: 0; }
.band { position: absolute; top: 0; bottom: 0; background: rgba(71, 85, 105, .045); border-left: 1px dashed rgba(71, 85, 105, .4); border-right: 1px dashed rgba(71, 85, 105, .4); transition: background .15s; }
.band.t1 { background: rgba(71, 85, 105, .1); border-left: 1px solid rgba(71, 85, 105, .6); border-right: 1px solid rgba(71, 85, 105, .6); }
.band.hl { background: rgba(71, 85, 105, .2); border-color: rgba(71, 85, 105, .85); }
.bar.tentative { border-style: dashed; border-color: color-mix(in srgb, var(--c) 80%, #000); }

/* Bars: colour = vertical (--c), style = status */
.bar {
  --c: var(--v-unknown);
  position: absolute; top: 3px; height: calc(var(--row-h) - 6px);
  border-radius: 5px; border: 1.5px solid var(--c);
  padding: 0 7px; display: flex; align-items: center;
  font-size: 12px; font-weight: 600; text-align: left;
  z-index: 2; cursor: pointer; min-width: 6px;
}
.bar:hover { filter: brightness(.95); box-shadow: 0 1px 4px rgba(0,0,0,.18); z-index: 5; }
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; pointer-events: none; }
.bar.lbl-right .bar-label, .bar.lbl-left .bar-label { position: absolute; color: var(--text); overflow: visible; }
.bar.lbl-right .bar-label { left: calc(100% + 5px); }
.bar.lbl-left .bar-label { right: calc(100% + 5px); }

.bar.st-idea     { background: var(--surface); border-style: dashed; color: color-mix(in srgb, var(--c) 75%, #000); }
.bar.st-planning { background: color-mix(in srgb, var(--c) 18%, #fff); border-color: color-mix(in srgb, var(--c) 55%, #fff); color: color-mix(in srgb, var(--c) 60%, #000); }
.bar.st-live     { background: var(--c); color: #fff; }
.bar.st-complete { background: color-mix(in srgb, var(--c) 30%, #fff); border-color: color-mix(in srgb, var(--c) 30%, #fff); color: color-mix(in srgb, var(--c) 35%, #8a94a1); }
.bar.st-paused   { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 32%, #fff) 0 4px, #fff 4px 8px); color: color-mix(in srgb, var(--c) 60%, #000); }
.bar.st-none     { background: var(--surface); border-style: dotted; color: var(--text-2); }
.bar.st-complete .bar-label { text-decoration: none; }
.bar.lbl-right.st-complete .bar-label, .bar.lbl-left.st-complete .bar-label { color: var(--text-3); }

/* Clipped at the month edge: square edge + arrow */
.bar.clip-l { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-width: 0; padding-left: 16px; }
.bar.clip-r { border-top-right-radius: 0; border-bottom-right-radius: 0; border-right-width: 0; padding-right: 16px; }
.bar.clip-l::before, .bar.clip-r::after { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; line-height: 1; opacity: .85; }
.bar.clip-l::before { content: "◀"; left: 2px; }
.bar.clip-r::after { content: "▶"; right: 2px; }
.bar.lbl-right.clip-r .bar-label { left: calc(100% + 5px); }

.bar .idot { margin-right: 5px; box-shadow: 0 0 0 1.5px #fff; }

.mini-bar { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--c); opacity: .55; }

.tl-note { padding: 10px 14px; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); }
.tl-note:empty { display: none; }

/* ---------- Status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; border: 1px solid transparent; white-space: nowrap; }
.chip.st-idea { border: 1px dashed #8a94a1; color: #5a6573; background: #fff; }
.chip.st-planning { background: #e6efff; color: #1a4fb5; border-color: #c4d6fb; }
.chip.st-live { background: #1b7a3a; color: #fff; }
.chip.st-complete { background: #eef0f3; color: #8a94a1; }
.chip.st-paused { background: repeating-linear-gradient(135deg, #fde7c2 0 4px, #fff 4px 8px); color: #8a4b00; border-color: #f2c47a; }
.chip.st-none { background: var(--error-bg); color: var(--error); }
.chip.tier { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.chip.prio { background: #fff; color: var(--text); border-color: var(--border-strong); font-variant-numeric: tabular-nums; }
.chip.prio.bad { color: var(--error); border-color: var(--error); }
.chip.tent { background: #fff7e6; color: #8a4b00; border: 1px dashed #d99a3a; }
.tent { color: #8a4b00; }
.chips { display: inline-flex; gap: 4px; flex: none; }
.ch.info { background: #fff; border-style: dashed; color: var(--text-2); }

/* ---------- Weekly view ---------- */
.week-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.week-col { border-right: 1px solid var(--border); min-width: 0; }
.week-col:last-child { border-right: 0; }
.week-col > h3 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); background: var(--surface-2); display: flex; gap: 8px; align-items: baseline; }
.week-col > h3 .muted { font-weight: 500; }
.week-col .wk-empty { padding: 14px; color: var(--text-3); font-style: italic; }
.wk-tier { padding: 10px 14px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.wk-vertical { padding: 6px 14px 4px; font-size: 12px; font-weight: 600; display: flex; align-items: center; }
.wk-card {
  --c: var(--v-unknown);
  display: block; width: calc(100% - 28px); margin: 0 14px 8px; text-align: left;
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px;
  padding: 8px 10px; background: var(--surface);
}
.wk-card:hover { background: #f9fafb; box-shadow: var(--shadow); }
.wk-card .t { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.wk-card .name { font-weight: 650; font-size: 13px; }
.wk-card .meta { color: var(--text-2); font-size: 12px; margin-top: 3px; }
.wk-card .meta b { font-weight: 600; color: var(--text); }
.wk-card .parent { color: var(--text-2); font-size: 12px; margin-top: 3px; }

/* ---------- Filters ---------- */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 14px; }
.filter-bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.filter-bar select, .ms > summary { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); font-size: 13px; color: var(--text); }
.filter-bar select.active, .ms.active > summary { border-color: var(--accent); background: #eef4ff; }
.ms { position: relative; }
.ms > summary { list-style: none; cursor: pointer; min-width: 150px; }
.ms > summary::-webkit-details-marker { display: none; }
.ms > summary::after { content: "▾"; float: right; margin-left: 8px; color: var(--text-3); }
.ms-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(16,24,40,.14); padding: 6px; min-width: 210px; }
.ms-menu label { display: flex; padding: 5px 8px; border-radius: 5px; color: var(--text); font-size: 13px; cursor: pointer; }
.ms-menu label:hover { background: var(--surface-2); }
.ms-menu .ms-actions { display: flex; gap: 12px; padding: 4px 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-size: 12px; }
.filter-note { font-size: 12px; color: var(--text-2); }

/* ---------- Side panel ---------- */
.panel-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .25); z-index: 40; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 41;
  background: var(--surface); box-shadow: -8px 0 32px rgba(16,24,40,.18);
  display: flex; flex-direction: column;
}
.panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); border-top: 5px solid var(--c, var(--v-unknown)); }
.panel-head .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-head h2 { margin: 8px 0 4px; font-size: 19px; line-height: 1.25; }
.panel-head .close { margin-left: auto; border: 0; font-size: 22px; line-height: 1; padding: 2px 8px; color: var(--text-2); }
.panel-body { overflow-y: auto; padding: 4px 18px 24px; }
.panel dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 12px 0; font-size: 13px; }
.panel dt { color: var(--text-2); }
.panel dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.panel h4 { margin: 18px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.panel .text { white-space: pre-wrap; font-size: 13px; margin: 0; }
.panel .text.empty { color: var(--text-3); font-style: italic; }
.panel ul.bullets { margin: 0; padding-left: 18px; font-size: 13px; }
.panel .rel {
  --c: var(--v-unknown);
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; background: var(--surface);
}
.panel .rel:hover { background: var(--surface-2); }
.panel .rel .grow { flex: 1; min-width: 0; }
.panel .rel .sub { font-size: 12px; color: var(--text-2); }
.panel .issue { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.ch { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin: 0 4px 4px 0; }
.bar.pulse { animation: pulse 1.4s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,111,235,.7); } 100% { box-shadow: 0 0 0 10px rgba(31,111,235,0); } }

.print-header { display: none; }

@media (max-width: 900px) {
  .week-body { grid-template-columns: 1fr; }
  .week-col { border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 12px 16px 32px; }
  .app-header { padding: 10px 16px; }
}

/* ---------- Print (landscape A4/A3, size set by the Print control) ---------- */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 11px; }
  .app-header, #emptyState, #sourcesCard, #issuesCard, #filtersCard, .panel, .panel-backdrop,
  .period-bar input, .period-bar button, .drop-overlay, .tl-note button.link { display: none !important; }
  main { padding: 0; max-width: none; }
  .card { box-shadow: none; border: 0; margin: 0; }
  .print-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--text); }
  .print-header h1 { margin: 0; font-size: 18px; }
  .print-header .sub { font-size: 10px; color: var(--text-2); text-align: right; }
  .period-bar { display: none !important; }
  .legend { padding: 4px 0 6px; border-bottom: 0; }
  .tl-scroll { overflow: visible; }
  .tl { min-width: 0 !important; width: 100%; --label-w: 150px; }
  .tl.has-kpi { --mtd-w: 150px; }
  #tip, .kpi-toggles, .kpi-prompt button, .notice, .btn { display: none !important; }
  .tl-head { border-top: 1px solid var(--border-strong); }
  .tl-row, .tl-lane-head, .wk-card { break-inside: avoid; }
  .tl-lane-head { break-after: avoid; }
  .tl-group-head .chev { visibility: hidden; }
  .bar:hover { box-shadow: none; filter: none; }
  .tl-note { border-top: 0; padding: 4px 0; }
  .week-body { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .week-col { border-right: 1px solid var(--border); border-bottom: 0; }
  .wk-card { box-shadow: none; padding: 4px 8px; margin-bottom: 4px; }
  .wk-card .name { font-size: 11px; }
  .wk-card .meta, .wk-card .parent { font-size: 10px; margin-top: 1px; }
  .wk-tier { padding-top: 6px; }
  .wk-vertical { padding: 3px 14px 2px; }
  .week-col > h3 { padding: 6px 10px; }
}

/* ---------- KPI strip (month) ---------- */
:root {
  --k-green-bg: #d9f2e1; --k-green: #14532d;
  --k-amber-bg: #fdecc8; --k-amber: #7c4a03;
  --k-red-bg: #fbd5d5;   --k-red: #8f1d1d;
  --k-over: #2563eb;
}
.tl { --mtd-w: 0px; }
.tl.has-kpi { --mtd-w: 172px; }
.tl-row { padding-right: var(--mtd-w); position: relative; }
.tl-grid, .tl-bands { right: var(--mtd-w); }
.tl-kpi-head { display: flex; align-items: center; gap: 10px; padding: 6px 14px 4px; background: var(--surface-2); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
.tl-kpi-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.kpi-scope { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #fff; border: 1px solid var(--border-strong); color: var(--text-2); }
.kpi-row { min-height: 34px; }
.kpi-row .tl-label { font-weight: 600; color: var(--text); }
.kpi-row .tl-label .unit { color: var(--text-3); font-weight: 500; font-size: 11px; }
.kc {
  position: absolute; top: 3px; bottom: 3px; margin: 0 1px; padding: 0;
  border: 0; border-radius: 3px; z-index: 2; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em;
}
.kc.s-green, .s-green-cell { background: var(--k-green-bg); color: var(--k-green); }
.kc.s-amber, .s-amber-cell { background: var(--k-amber-bg); color: var(--k-amber); }
.kc.s-red, .s-red-cell { background: var(--k-red-bg); color: var(--k-red); }
.kc.s-over, .s-over-cell { background: var(--k-green-bg); color: var(--k-green); box-shadow: inset 0 0 0 2px var(--k-over); }
.kc.s-no_actual { background: transparent; color: var(--text-3); font-weight: 500; font-style: italic; box-shadow: inset 0 0 0 1px var(--border); }
.kc:hover { filter: brightness(.95); }
.kc.sm { font-size: 8.5px; letter-spacing: -.03em; }
.kc.today { outline: 2px solid var(--error); outline-offset: -1px; }
.mtd {
  position: absolute; right: 0; top: 0; bottom: 0; width: var(--mtd-w);
  border-left: 1px solid var(--border-strong); background: var(--surface); z-index: 3;
  padding: 2px 8px; display: flex; flex-direction: column; justify-content: center; font-size: 11px; line-height: 1.25;
  cursor: default;
}
.mtd .top { display: flex; align-items: center; gap: 6px; font-weight: 650; }
.mtd .sub { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtd-head { position: absolute; right: 0; top: 0; bottom: 0; width: var(--mtd-w); border-left: 1px solid var(--border-strong); display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--surface); }
.st-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
.st-dot.s-green { background: #22a052; } .st-dot.s-amber { background: #e08a00; } .st-dot.s-red { background: var(--error); }
.st-dot.s-over { background: #22a052; box-shadow: 0 0 0 2px var(--k-over); } .st-dot.s-no_actual, .st-dot.s-none { background: var(--border-strong); }
.kpi-prompt { padding: 10px 14px; font-size: 13px; color: var(--text-2); background: #f8fafc; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kpi-toggles { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--text-2); }
.kpi-toggles label { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--border-strong); border-radius: 12px; cursor: pointer; }
.kpi-toggles label:has(input:checked) { background: var(--text); color: #fff; border-color: var(--text); }
.kpi-toggles input { display: none; }
.actuals-through { font-size: 12px; color: var(--text-2); padding: 2px 10px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; }

/* Hover card for KPI cells */
#tip {
  position: fixed; z-index: 60; pointer-events: none; display: none;
  background: #111827; color: #f9fafb; border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45;
  box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 300px;
}
#tip h5 { margin: 0 0 4px; font-size: 12px; }
#tip table { border-collapse: collapse; }
#tip td { padding: 0 10px 0 0; white-space: nowrap; }
#tip td.v { text-align: right; font-variant-numeric: tabular-nums; }
#tip .st { margin-top: 4px; font-weight: 600; }

/* ---------- KPI table (week) ---------- */
.week-kpi { border-bottom: 1px solid var(--border); overflow-x: auto; }
.week-kpi table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.week-kpi th, .week-kpi td { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
.week-kpi thead th { background: var(--surface-2); font-weight: 600; color: var(--text-2); position: sticky; top: 0; }
.week-kpi thead th.dayh { cursor: pointer; }
.week-kpi thead th.dayh:hover { color: var(--accent); }
.week-kpi thead th.today { color: var(--error); }
.week-kpi th.rowh { text-align: left; font-weight: 500; color: var(--text-2); }
.week-kpi tr.kname th { text-align: left; background: #fafbfc; font-weight: 700; color: var(--text); border-top: 1px solid var(--border-strong); }
.week-kpi td.wk-total { border-left: 2px solid var(--border-strong); font-weight: 600; }
.week-kpi td.na { color: var(--text-3); font-style: italic; }
.week-kpi td.neg { color: var(--k-red); } .week-kpi td.pos { color: var(--k-green); }
.week-kpi .foot { padding: 6px 14px; font-size: 11px; color: var(--text-2); }

/* ---------- Buttons, menus, notices ---------- */
a.btn, span.btn { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; color: inherit; border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 6px 12px; white-space: nowrap; }
a.btn:hover { background: var(--surface-2); }
.btn-sm, a.btn.btn-sm, span.btn.btn-sm { padding: 2px 8px; font-size: 12px; border-radius: 5px; }
button.btn { border: 1px solid var(--border-strong); }
span.btn.disabled { color: var(--text-3); border-style: dashed; cursor: not-allowed; }
.menu-link { display: block; padding: 6px 8px; border-radius: 5px; color: var(--text); text-decoration: none; font-size: 13px; }
.menu-link:hover { background: var(--surface-2); }
.notice { position: fixed; left: 50%; transform: translateX(-50%); top: 64px; z-index: 50; background: #111827; color: #f9fafb; padding: 8px 14px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13px; max-width: min(720px, calc(100vw - 32px)); }
.notice button { margin-left: 6px; }
.notice button.link { color: #cbd5e1; }
.panel-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }

/* ---------- Issues: actions and dismissals ---------- */
.issue-actions { white-space: nowrap; text-align: right; }
.issue-actions > * { margin-left: 4px; }
tr.dismiss-form td { background: #f8fafc; }
tr.dismiss-form input { width: min(360px, 60vw); padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: 5px; margin: 0 6px; }
.dismissed-box { border-top: 1px solid var(--border); }
.dismissed-box > summary { padding: 8px 14px; cursor: pointer; font-size: 13px; color: var(--text-2); }
tr.is-dismissed td, .issue.is-dismissed { opacity: .7; }
.sev.dismissed { opacity: .45; text-decoration: line-through; }
.bar .idot.dismissed, .idot.dismissed { background: #fff; box-shadow: 0 0 0 1.5px var(--error); }
.idot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.idot.error { background: var(--error); }
.idot.warning { background: #e08a00; }

/* ---------- Day panel ---------- */
.day-headline { margin: 12px 0 4px; padding: 8px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; background: var(--surface-2); }
.day-kpi { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.day-kpi-head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--surface-2); font-size: 13px; }
.day-kpi-head .spacer { flex: 1; }
.day-kpi table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.day-kpi th, .day-kpi td { padding: 5px 8px; border-top: 1px solid var(--border); text-align: right; vertical-align: top; }
.day-kpi thead th { color: var(--text-2); font-weight: 600; border-top: 0; }
.day-kpi tbody th { text-align: left; font-weight: 600; }
.day-kpi td.na { color: var(--text-3); font-style: italic; }
.day-kpi .faint { font-size: 11px; }
.chip.kst { background: var(--surface-2); color: var(--text-2); border-color: var(--border); white-space: normal; text-align: left; }
.day-vertical { display: flex; align-items: center; font-weight: 600; font-size: 13px; margin: 10px 0 6px; }
.day-vertical .faint { margin-left: 6px; font-weight: 500; }
.day-cell[data-day] { cursor: pointer; }
.day-cell[data-day]:hover b { color: var(--accent); }

/* Calendar tint by orders status */
.tl-grid .tint { position: absolute; top: 0; bottom: 0; }
.tint.t-green { background: rgba(34, 160, 82, .09); }
.tint.t-over { background: rgba(37, 99, 235, .10); }
.tint.t-amber { background: rgba(224, 138, 0, .12); }
.tint.t-red { background: rgba(198, 40, 40, .13); }

.dialog { position: fixed; z-index: 45; left: 50%; top: 10vh; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); background: var(--surface); border-radius: 10px; box-shadow: 0 12px 40px rgba(16,24,40,.25); padding: 16px 18px; }
.dialog h3 { margin: 0 0 6px; font-size: 16px; }
.dialog p { margin: 0 0 10px; color: var(--text-2); font-size: 13px; }
.dialog textarea { width: 100%; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--border-strong); border-radius: 6px; padding: 8px; resize: vertical; }
.dialog-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
.dialog-actions .spacer { flex: 1; }

.placeholder { padding: 40px; text-align: center; color: var(--text-2); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="drop-overlay">Drop CSV files to load them</div>

<header class="app-header">
  <h1>Marketing Tracker</h1>
  <span class="actuals-through hidden" id="actualsThrough"></span>
  <div class="seg" role="group" aria-label="View">
    <button data-view="month" aria-pressed="true">Month</button>
    <button data-view="week" aria-pressed="false">Week</button>
    <button data-view="data" aria-pressed="false">Data</button>
  </div>
  <div class="spacer"></div>
  <div class="loader-bar" id="loaderBar"></div>
  <div class="loader-bar">
    <select id="paperSize" aria-label="Paper size for printing">
      <option value="A4">A4 landscape</option>
      <option value="A3">A3 landscape</option>
    </select>
    <button data-action="print">Print</button>
  </div>
  <input type="file" id="filePicker" accept=".csv,text/csv,.json,application/json" multiple hidden>
  <input type="file" id="dismissImport" accept=".json,application/json" hidden>
  <div class="notice hidden" id="notice" role="status"></div>
</header>

<main>
  <section id="emptyState" class="dropzone">
    <h2>Starting the tracker…</h2>
    <p>If this message stays for more than a few seconds, the page's script didn't start. Look for a red error message above, or reload the page.</p>
  </section>

  <section id="sourcesCard" class="card hidden">
    <header>
      <button class="card-toggle" data-toggle="sourcesCard"><span class="chev">▾</span><h2>Loaded sources</h2></button>
      <span class="muted" id="sourcesSummary"></span>
    </header>
    <div id="sourcesBody" style="overflow-x:auto"></div>
  </section>

  <section id="issuesCard" class="card hidden">
    <header>
      <button class="card-toggle" data-toggle="issuesCard"><span class="chev">▾</span><h2>Data issues</h2></button>
      <span class="issue-badge" id="issuesCounts"></span>
      <div class="spacer"></div>
      <button class="btn btn-sm" data-action="export-dismissals" title="Save the dismissed issues as a JSON file to share with the team">Export dismissals</button>
      <button class="btn btn-sm" data-action="import-dismissals" title="Load a dismissals JSON file exported by someone else">Import dismissals</button>
      <div class="issue-filters" id="issueFilters">
        <button data-sev="all" aria-pressed="true">All</button>
        <button data-sev="error" aria-pressed="false">Errors</button>
        <button data-sev="warning" aria-pressed="false">Warnings</button>
      </div>
    </header>
    <div class="scroll" id="issuesBody"></div>
  </section>

  <section id="filtersCard" class="card hidden">
    <div class="filter-bar" id="filterBar"></div>
  </section>

  <div class="print-header" id="printHeader"></div>

  <section id="viewMonth" class="card view hidden">
    <header class="period-bar">
      <div class="period-nav">
        <button data-nav="-1" aria-label="Previous month">‹</button>
        <h2 id="monthTitle"></h2>
        <button data-nav="1" aria-label="Next month">›</button>
      </div>
      <input type="month" id="monthJump" aria-label="Jump to month">
      <button data-action="today">Today</button>
      <span class="muted" id="monthCount"></span>
      <span class="kpi-toggles" id="kpiToggles"></span>
    </header>
    <div class="legend" id="monthLegend"></div>
    <div class="tl-scroll"><div class="tl" id="timeline"></div></div>
    <div class="tl-note" id="monthNote"></div>
  </section>
  <section id="viewWeek" class="card view hidden">
    <header class="period-bar">
      <div class="period-nav">
        <button data-nav="-1" aria-label="Previous week">‹</button>
        <h2 id="weekTitle"></h2>
        <button data-nav="1" aria-label="Next week">›</button>
      </div>
      <input type="date" id="weekJump" aria-label="Jump to the week containing a date">
      <button data-action="today">This week</button>
      <span class="muted" id="weekRange"></span>
    </header>
    <div class="week-kpi" id="weekKpi"></div>
    <div class="week-body" id="weekBody"></div>
    <div class="tl-note" id="weekNote"></div>
  </section>
  <section id="viewData" class="card view hidden">
    <header><h2>All initiatives</h2><span class="muted" id="dataSummary"></span></header>
    <div class="scroll" style="max-height:none" id="dataBody"></div>
  </section>
</main>

<div id="panelRoot"></div>
<div id="tip" role="tooltip"></div>
<div id="dialogRoot"></div>

<script>
/* CORE:BEGIN — pure data logic, no DOM. tools/check.mjs runs this block in Node. */

// Columns of the campaign and seasonal moment sheets, matched by header name.
// Any missing column is read as blank, except the required ones.
const COLUMNS = [
  "id", "name", "tier", "parent_id", "vertical", "relevant_verticals", "sub_vertical",
  "campaign_type", "priority", "date_confidence", "start_date", "end_date", "status",
  "owner", "channels", "objective", "brief", "target_audience", "goal", "kpis",
  "key_message", "top_highlights", "budget_qar", "notes",
];
const REQUIRED_COLUMNS = ["id", "name", "tier", "start_date", "end_date"];

const MOMENT = "Seasonal Moment";
const BRAND = "Brand Campaign";
const TACTICAL = "Tactical Campaign";

// Keep in sync with tools/build_templates.py
const ALLOWED = {
  tier: [MOMENT, BRAND, TACTICAL],
  vertical: ["S Market", "Restaurants", "Snoomart", "Grocery", "SLaundry", "Services", "New Ventures", "Cross-vertical"],
  campaign_type: ["Hero", "Promo", "Tactical", "Occasion", "Recurrent", "USP", "Segmented", "Engagement", "Adoption", "Habit Builder"],
  status: ["Idea", "Planning", "Live", "Complete", "Paused"],
  priority_campaign: ["P0", "P1", "P2", "P3"],
  priority_moment: ["T1", "T2", "T3"],
  date_confidence: ["Confirmed", "Fixed date", "Tentative", "Tentative (lunar)", "School-specific", "Planning window"],
};
const FIRM_DATE_CONFIDENCE = ["Confirmed", "Fixed date"];

const VERTICAL_CODES = {
  "S Market": "SMK", "Restaurants": "RST", "Snoomart": "SNM", "Grocery": "GRC",
  "SLaundry": "SLD", "Services": "SRV", "New Ventures": "NVT", "Cross-vertical": "CVT",
};
const TIER_ID_CODES = { [BRAND]: "BC", [TACTICAL]: "TC" };

// Issue types: code -> label used for "Dismiss all of this type".
const ISSUE_TYPES = {
  load_failed: "File could not be loaded",
  unterminated_quote: "Unclosed quote in file",
  empty_file: "Empty file",
  missing_columns: "Missing required columns",
  unknown_columns: "Unknown columns",
  extra_cells: "Row has extra cells",
  missing_id: "Missing id",
  missing_name: "Missing name",
  invalid_value: "Value not in the allowed list",
  missing_value: "Missing required value",
  unknown_relevant_vertical: "Unknown value in relevant_verticals",
  moment_in_vertical_file: "Seasonal moment in a vertical file",
  campaign_in_moments_file: "Campaign in the moments file",
  missing_date: "Missing date",
  invalid_date: "Invalid date",
  end_before_start: "End date before start date",
  date_format: "Date typed as D/M/YYYY",
  vertical_mismatch: "Row's vertical differs from its tab",
  id_pattern: "id doesn't follow the pattern",
  budget_nan: "Budget is not a number",
  duplicate_id: "Duplicate id",
  moment_has_parent: "Seasonal moment has a parent",
  parent_not_found: "Parent not found",
  self_parent: "Row is its own parent",
  parent_wrong_tier: "Parent is the wrong tier",
  tactical_no_parent: "Tactical campaign with no parent",
  outside_parent: "Dates outside the parent's dates",
};

/* ---------- CSV ---------- */

// RFC 4180: quoted cells may hold commas, line breaks and "" (an escaped quote).
// Returns { records: string[][], unterminated: boolean }.
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  text = text.replace(/\r\n?/g, "\n");
  const records = [];
  let rec = [], field = "", inQuotes = false, fieldStarted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"' && !fieldStarted) {
      inQuotes = true; fieldStarted = true;
    } else if (c === ",") {
      rec.push(field); field = ""; fieldStarted = false;
    } else if (c === "\n") {
      rec.push(field); records.push(rec);
      rec = []; field = ""; fieldStarted = false;
    } else {
      field += c; fieldStarted = true;
    }
  }
  if (fieldStarted || rec.length) { rec.push(field); records.push(rec); }
  return { records, unterminated: inQuotes };
}

/* ---------- Dates ----------
   A date is a whole calendar day, stored as a day number (days since
   1970-01-01). There is no time of day and no time zone, so a date can never
   shift. "Today" is taken from the viewer's local clock. */

const DAY_MS = 86400000;

function dayFromYMD(y, m, d) { return Date.UTC(y, m, d) / DAY_MS; }       // m is 0-based
function validYMD(y, m, d) {
  const dt = new Date(Date.UTC(y, m, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m && dt.getUTCDate() === d;
}
function parseISODate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m || !validYMD(+m[1], +m[2] - 1, +m[3])) return null;
  return dayFromYMD(+m[1], +m[2] - 1, +m[3]);
}
const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const DAYS_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
// DD-Mmm-YY (e.g. 14-May-26), as written by the forecasting engine. Four-digit years also accepted.
function parseDMYDate(s) {
  const m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2}|\d{4})$/.exec(s);
  if (!m) return null;
  const mo = MONTHS_SHORT.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
  const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  if (mo < 0 || !validYMD(y, mo, +m[1])) return null;
  return dayFromYMD(y, mo, +m[1]);
}
function dayToDate(n) { return new Date(n * DAY_MS); }                    // read with getUTC* only
function dayToISO(n) { return dayToDate(n).toISOString().slice(0, 10); }
function dayParts(n) { const d = dayToDate(n); return [d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()]; }
function weekday(n) { return ((n + 4) % 7 + 7) % 7; }                     // 0 = Sunday
function weekStart(n) { return n - weekday(n); }                          // weeks run Sun..Sat
function monthBounds(y, m) { return [dayFromYMD(y, m, 1), dayFromYMD(y, m + 1, 1) - 1]; }
function todayDay() { const t = new Date(); return dayFromYMD(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmtDay(n) { const [y, m, d] = dayParts(n); return `${d} ${MONTHS_SHORT[m]} ${y}`; }
function fmtDayShort(n) { const [, m, d] = dayParts(n); return `${DAYS_SHORT[weekday(n)]} ${d} ${MONTHS_SHORT[m]}`; }

/* ---------- Issues ---------- */

// The fingerprint identifies an issue across reloads: its type, the row it is
// about (id, or source + row when there is no id; date for KPI issues) and
// the values that caused it. Change the data and the fingerprint changes.
function makeIssue({ severity, code, src, row = null, field = null, message, values = [], day = null, sheetRow, id }) {
  const issueId = id ?? (row ? row.id : "");
  const where = issueId || (day !== null ? `${src.label}@${dayToISO(day)}` : `${src.label}#${sheetRow ?? row?._sheetRow ?? "file"}`);
  return {
    severity, code, field, message, values,
    source: src.label,
    sourceIdx: src._idx,
    sheetRow: sheetRow ?? (row ? row._sheetRow : null),
    id: issueId,
    rowKey: row ? row._key : null,
    day,
    fingerprint: [code, where, day !== null ? dayToISO(day) : "", ...values.map(v => String(v ?? ""))].join("|"),
  };
}

/* ---------- Load + merge + validate ---------- */

function normHeader(h) { return h.trim().toLowerCase().replace(/[\s-]+/g, "_"); }

// Case- and spacing-insensitive match against an allowed list.
// Returns the canonical value, "" for blank, or null if not allowed.
function canonical(list, value) {
  const v = value.trim().replace(/\s+/g, " ");
  if (!v) return "";
  const lower = v.toLowerCase();
  return list.find(x => x.toLowerCase() === lower) ?? null;
}

function looksLikeDate(s) { return /\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}/.test(s); }

/**
 * Campaign and seasonal moment rows.
 * sources: [{ label, text, origin, kind?: "moments"|"vertical", loadError?, _idx }]
 * options: { informationalAudiences: ["Brand", "City"] }
 * Returns { rows, byKey, byId, issues, summaries }.
 * Every non-blank CSV row becomes a row object, whatever its problems.
 */
function buildPlan(sources, options = {}) {
  const informational = options.informationalAudiences || [];
  const rows = [];
  const issues = [];
  const summaries = [];
  const add = (o) => { const i = makeIssue(o); issues.push(i); if (o.row) o.row._issues.push(i); return i; };

  for (const src of sources) {
    const summary = {
      label: src.label, origin: src.origin, sourceIdx: src._idx, kind: src.kind || null, kindInferred: !src.kind,
      rowCount: 0, blankRows: 0, missingOptional: [], loadError: src.loadError || null,
    };
    summaries.push(summary);
    if (src.loadError) { add({ severity: "error", code: "load_failed", src, message: `Could not load: ${src.loadError}`, values: [src.loadError] }); continue; }

    const { records, unterminated } = src._records ? { records: src._records, unterminated: src._unterminated } : parseCSV(src.text || "");
    if (unterminated) add({ severity: "error", code: "unterminated_quote", src, message: "File ends inside a quoted cell (a \" is missing its closing quote). The last row may be incomplete." });
    if (!records.length || records[0].every(c => !c.trim())) {
      add({ severity: "error", code: "empty_file", src, message: "File is empty or has no header row." });
      continue;
    }

    const header = records[0].map(normHeader);
    const colIndex = {};
    header.forEach((h, i) => { if (h && !(h in colIndex)) colIndex[h] = i; });
    const missingRequired = REQUIRED_COLUMNS.filter(c => !(c in colIndex));
    summary.missingOptional = COLUMNS.filter(c => !(c in colIndex) && !REQUIRED_COLUMNS.includes(c));
    const extra = header.filter(h => h && !COLUMNS.includes(h));
    if (missingRequired.length) add({ severity: "error", code: "missing_columns", src, message: `Header is missing required column${missingRequired.length > 1 ? "s" : ""}: ${missingRequired.join(", ")}`, values: missingRequired });
    if (extra.length) add({ severity: "warning", code: "unknown_columns", src, message: `Header has unknown column${extra.length > 1 ? "s" : ""} (ignored): ${extra.join(", ")}`, values: extra });

    const fileRows = [];
    for (let r = 1; r < records.length; r++) {
      const cells = records[r];
      const get = c => (c in colIndex ? (cells[colIndex[c]] ?? "") : "").trim();
      const values = {};
      COLUMNS.forEach(c => { values[c] = get(c); });

      // Blank rows, including template rows where only the pre-filled tier/vertical are set.
      // Anything else (even content only in unknown columns) is kept so it gets flagged.
      const prefilled = new Set(["tier", "vertical"].map(c => colIndex[c]));
      if (!cells.some((c, i) => c.trim() && !prefilled.has(i))) { summary.blankRows++; continue; }

      const row = {
        ...values,
        _key: `${src._idx}:${r + 1}`,
        _source: src.label,
        _sourceIdx: src._idx,
        _sheetRow: r + 1,       // header is sheet row 1
        _issues: [],
        _parent: null,
        _children: [],
      };
      if (cells.length > header.length && cells.slice(header.length).some(c => c.trim())) {
        add({ severity: "warning", code: "extra_cells", src, row, message: `Row has ${cells.length} cells but the header has ${header.length}; the extra cells were ignored. Check for a missing quote.`, values: [cells.length] });
      }
      fileRows.push(row);
    }
    summary.rowCount = fileRows.length;

    // Work out what kind of file this is
    if (!summary.kind) {
      const moments = fileRows.filter(r => canonical(ALLOWED.tier, r.tier) === MOMENT).length;
      summary.kind = fileRows.length && moments > fileRows.length / 2 ? "moments" : "vertical";
    }
    fileRows.forEach(r => { r._fileKind = summary.kind; });
    rows.push(...fileRows);
  }

  /* ---- Per-row checks ---- */
  const srcOf = r => sources.find(s => s._idx === r._sourceIdx);
  const checkList = (r, src, field, list, required) => {
    const raw = r[field];
    const c = canonical(list, raw);
    if (c === null) {
      add({ severity: "error", code: "invalid_value", src, row: r, field, message: `${field} "${raw}" is not an allowed value. Allowed: ${list.join(", ")}.`, values: [field, raw] });
      r[`_bad_${field}`] = true;
    } else {
      r[field] = c;
      if (!c && required) add({ severity: "error", code: "missing_value", src, row: r, field, message: `Missing ${field}.`, values: [field] });
    }
  };

  for (const r of rows) {
    const src = srcOf(r);

    if (!r.id) add({ severity: "error", code: "missing_id", src, row: r, field: "id", message: "Missing id." });
    if (!r.name) add({ severity: "error", code: "missing_name", src, row: r, field: "name", message: "Missing name." });

    checkList(r, src, "tier", ALLOWED.tier, true);
    // On a vertical's tab a blank vertical means the tab's vertical.
    if (!r.vertical && src.tabVertical && canonical(ALLOWED.tier, r.tier) !== MOMENT) r.vertical = src.tabVertical;
    checkList(r, src, "vertical", ALLOWED.vertical, true);
    if (src.tabVertical && r.vertical && !r._bad_vertical && r.tier !== MOMENT && r.vertical !== src.tabVertical) {
      add({ severity: "warning", code: "vertical_mismatch", src, row: r, field: "vertical", message: `Vertical is "${r.vertical}" but this is the ${src.tabVertical} tab.`, values: [r.vertical, src.tabVertical] });
    }
    checkList(r, src, "status", ALLOWED.status, true);
    const isMoment = r.tier === MOMENT;
    // Moments hold MarCom's moment type in campaign_type (any value); campaigns use the strict list.
    if (!isMoment) checkList(r, src, "campaign_type", ALLOWED.campaign_type, !!r.tier && !r._bad_tier);
    // Priority: T1-T3 for moments, P0-P3 for campaigns. Optional.
    if (r.tier) checkList(r, src, "priority", isMoment ? ALLOWED.priority_moment : ALLOWED.priority_campaign, false);
    checkList(r, src, "date_confidence", ALLOWED.date_confidence, false);
    r._tentative = isMoment && !!r.date_confidence && !FIRM_DATE_CONFIDENCE.includes(r.date_confidence);

    // relevant_verticals: blank or "All" = every vertical. Informational values
    // (Brand, City) are kept but don't match a vertical. Anything else is a warning.
    r._relevantAll = false; r._relevant = new Set(); r._audiences = [];
    const relParts = r.relevant_verticals.split(";").map(s => s.trim()).filter(Boolean);
    if (!relParts.length) r._relevantAll = true;
    for (const part of relParts) {
      if (part.toLowerCase() === "all") { r._relevantAll = true; continue; }
      const v = canonical(ALLOWED.vertical, part);
      if (v) { r._relevant.add(v); continue; }
      const info = canonical(informational, part);
      if (info) { r._audiences.push(info); continue; }
      r._audiences.push(part);
      add({ severity: "warning", code: "unknown_relevant_vertical", src, row: r, field: "relevant_verticals", message: `relevant_verticals has "${part}", which is not a vertical or a known audience (${informational.join(", ") || "none configured"}).`, values: [part] });
    }

    // Tier vs file kind
    if (isMoment && r._fileKind === "vertical") {
      add({ severity: "error", code: "moment_in_vertical_file", src, row: r, field: "tier", message: "Seasonal moment found in a vertical file. Moments belong only in the shared Seasonal Moments sheet." });
    } else if ((r.tier === BRAND || r.tier === TACTICAL) && r._fileKind === "moments") {
      add({ severity: "error", code: "campaign_in_moments_file", src, row: r, field: "tier", message: `${r.tier} found in the Seasonal Moments file. Campaigns belong in their vertical's sheet.`, values: [r.tier] });
    }

    // Dates
    r._start = null; r._end = null;
    for (const [field, key] of [["start_date", "_start"], ["end_date", "_end"]]) {
      const raw = r[field];
      if (!raw) { add({ severity: "error", code: "missing_date", src, row: r, field, message: `Missing ${field}.`, values: [field] }); continue; }
      let d = parseISODate(raw);
      if (d === null && (d = parseSlashDate(raw)) !== null) {
        add({ severity: "warning", code: "date_format", src, row: r, field, message: `${field} "${raw}" was read as ${fmtDay(d)} (day/month/year). Use YYYY-MM-DD so it can't be misread.`, values: [field, raw] });
      }
      if (d === null) {
        const hint = /^\d{4}-\d{2}-\d{2}$/.test(raw) ? "is not a real calendar date" : looksLikeDate(raw) ? "must be in YYYY-MM-DD format (or D/M/YYYY)" : "is not a date";
        add({ severity: "error", code: "invalid_date", src, row: r, field, message: `${field} "${raw}" ${hint}.`, values: [field, raw] });
        r[`_bad_${field}`] = true;
      } else r[key] = d;
    }
    if (r._start !== null && r._end !== null && r._end < r._start) {
      add({ severity: "error", code: "end_before_start", src, row: r, field: "end_date", message: `end_date ${r.end_date} is before start_date ${r.start_date}.`, values: [r.start_date, r.end_date] });
      r._bad_end_date = true;
    }

    // id format (warning)
    if (r.id && r.tier) {
      if (isMoment) {
        if (!/^SM-\d{3,}$/i.test(r.id)) add({ severity: "warning", code: "id_pattern", src, row: r, field: "id", message: `id "${r.id}" doesn't follow the SM-001 pattern for seasonal moments.`, values: [r.tier, r.vertical] });
      } else if (VERTICAL_CODES[r.vertical]) {
        const code = VERTICAL_CODES[r.vertical], tc = TIER_ID_CODES[r.tier];
        if (!new RegExp(`^${code}-${tc}-\\d{3,}$`, "i").test(r.id)) {
          add({ severity: "warning", code: "id_pattern", src, row: r, field: "id", message: `id "${r.id}" doesn't follow ${code}-${tc}-001 for a ${r.tier} in ${r.vertical}.`, values: [r.tier, r.vertical] });
        }
      }
    }

    // Budget (warning)
    r._budget = null;
    if (r.budget_qar) {
      const n = Number(r.budget_qar.replace(/[,\s]/g, "").replace(/^QAR/i, ""));
      if (Number.isFinite(n)) r._budget = n;
      else add({ severity: "warning", code: "budget_nan", src, row: r, field: "budget_qar", message: `budget_qar "${r.budget_qar}" is not a number.`, values: [r.budget_qar] });
    }

    r._channels = r.channels ? r.channels.split(";").map(s => s.trim()).filter(Boolean) : [];
  }

  /* ---- Cross-row checks ---- */
  const byKey = new Map(rows.map(r => [r._key, r]));
  const byId = new Map();   // UPPERCASE id -> [rows], in load order
  for (const r of rows) {
    if (!r.id) continue;
    const k = r.id.toUpperCase();
    if (!byId.has(k)) byId.set(k, []);
    byId.get(k).push(r);
  }
  const where = r => `${r._source} row ${r._sheetRow}`;
  for (const [, list] of byId) {
    if (list.length < 2) continue;
    for (const r of list) {
      const others = list.filter(o => o !== r).map(where);
      add({ severity: "error", code: "duplicate_id", src: srcOf(r), row: r, field: "id", message: `Duplicate id "${r.id}": also used in ${others.join("; ")}.`, values: [r._source, ...others] });
    }
  }

  for (const r of rows) {
    const src = srcOf(r);
    if (!r.parent_id) {
      if (r.tier === TACTICAL) add({ severity: "warning", code: "tactical_no_parent", src, row: r, field: "parent_id", message: "Tactical campaign has no parent. Link it to a brand campaign or seasonal moment." });
      continue;
    }
    if (r.tier === MOMENT) {
      add({ severity: "warning", code: "moment_has_parent", src, row: r, field: "parent_id", message: `Seasonal moments don't have parents; parent_id "${r.parent_id}" is ignored.`, values: [r.parent_id] });
      continue;
    }
    const candidates = byId.get(r.parent_id.toUpperCase());
    if (!candidates) {
      add({ severity: "error", code: "parent_not_found", src, row: r, field: "parent_id", message: `parent_id "${r.parent_id}" doesn't match any id in the loaded files.`, values: [r.parent_id] });
      r._bad_parent_id = true;
      continue;
    }
    const p = candidates[0];
    if (p === r) { add({ severity: "error", code: "self_parent", src, row: r, field: "parent_id", message: "Row is its own parent." }); r._bad_parent_id = true; continue; }
    r._parent = p._key;
    p._children.push(r._key);

    if (r.tier === BRAND && p.tier !== MOMENT) {
      add({ severity: "warning", code: "parent_wrong_tier", src, row: r, field: "parent_id", message: `Brand campaign's parent should be a seasonal moment, but ${p.id} is a ${p.tier || "row with no tier"}.`, values: [p.id, p.tier] });
    } else if (r.tier === TACTICAL && p.tier !== MOMENT && p.tier !== BRAND) {
      add({ severity: "warning", code: "parent_wrong_tier", src, row: r, field: "parent_id", message: `Tactical campaign's parent should be a brand campaign or seasonal moment, but ${p.id} is a ${p.tier || "row with no tier"}.`, values: [p.id, p.tier] });
    }

    if (r._start !== null && r._end !== null && p._start !== null && p._end !== null &&
        (r._start < p._start || r._end > p._end)) {
      const parts = [];
      if (r._start < p._start) parts.push(`starts ${r.start_date}, before its parent starts (${p.start_date})`);
      if (r._end > p._end) parts.push(`ends ${r.end_date}, after its parent ends (${p.end_date})`);
      add({ severity: "warning", code: "outside_parent", src, row: r, field: "start_date", message: `Dates fall outside parent ${p.id} "${p.name}": ${parts.join("; ")}.`, values: [p.id, r.start_date, r.end_date, p.start_date, p.end_date] });
    }
  }

  return { rows, byKey, byId, issues, summaries };
}
/* ---------- KPI forecasts ---------- */

// Forecasting engine export, read in its native layout:
//   row 1  title, e.g. "LAYER 1 — Orders & GMV | 180-Day Tracking" (skipped)
//   row 2  header (cells contain line breaks and "Err%" repeats, so columns are read by position)
//   row 3+ one row per day
// Column 2 (Day) and the Err% columns are ignored: weekdays come from the date
// and attainment is recalculated.
const ENGINE_LAYOUT = {
  date: 0,
  kpis: {
    orders:  { bear: 2, forecast: 3, bull: 4, actual: 5 },
    gmv_qar: { bear: 9, forecast: 10, bull: 11, actual: 12 },
  },
  firstDataRow: 3,   // sheet row of the first day
};
const KPI_TOTAL = "Total";
const SCENARIO_FIELDS = ["forecast", "bear", "bull", "actual"];

Object.assign(ISSUE_TYPES, {
  kpi_not_kpi_file: "KPI source isn't in a known KPI layout",
  kpi_layout: "KPI tab isn't in the engine layout",
  kpi_vertical_unset: "KPI file's vertical isn't set",
  kpi_duplicate_source: "Two KPI files for the same vertical",
  kpi_unknown_vertical: "Unknown vertical in a KPI source",
  kpi_unknown_kpi: "Unknown KPI",
  kpi_bad_date: "Unreadable KPI date",
  kpi_bad_number: "Unreadable KPI number",
  kpi_duplicate_date: "Duplicate KPI date",
  kpi_gap: "Gap in the KPI dates",
  kpi_forecast_range: "Forecast outside the bear–bull range",
  kpi_missing_actual: "Past day with no actual",
});

// Numbers may carry thousands separators and quotes ("101,623", "10,077,762.51").
// Returns null for blank, NaN for anything unreadable.
// "102.9%" -> 1.029.
function parseNumber(s) {
  let t = String(s ?? "").replace(/["'\s,]/g, "");
  if (!t) return null;
  const pct = t.endsWith("%");
  if (pct) t = t.slice(0, -1);
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
  return Number(pct ? `${t}e-2` : t);   // "102.9e-2" parses exactly; 102.9 / 100 doesn't
}
function parseAnyDate(s) { const t = s.trim(); return parseISODate(t) ?? parseDMYDate(t); }
// D/M/YYYY (day first), e.g. 5/11/2026 = 5 Nov 2026. Accepted, but flagged:
// a typed date like this is easy to misread as month-first.
function parseSlashDate(s) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s.trim());
  if (!m || !validYMD(+m[3], +m[2] - 1, +m[1])) return null;
  return dayFromYMD(+m[3], +m[2] - 1, +m[1]);
}

// What kind of file is this? Decided from the contents, never the file name.
function detectFileType(records) {
  const first = (records[0] || []).map(c => c.trim());
  const second = (records[1] || []).map(c => c.trim());
  if (/^layer\b/i.test(first[0] || "")) return "kpi_engine";
  if ((second[0] || "").toLowerCase() === "date" && /bear/i.test(second[2] || "")) return "kpi_engine";
  const h = first.map(normHeader);
  if (h.includes("date") && h.includes("kpi") && (h.includes("forecast") || h.includes("actual"))) return "kpi_long";
  return "plan";
}
function engineLayer(records) {
  const m = /layer\s*(\d+)/i.exec((records[0] || [])[0] || "");
  return m ? +m[1] : null;
}
// The vertical an engine file belongs to: the config entry wins, else Layer 1 = Total.
function engineVertical(src, records) {
  if (src.vertical) return src.vertical;
  const layer = engineLayer(records);
  return layer === 1 || layer === null ? KPI_TOTAL : null;
}
const KPI_VERTICALS = () => [KPI_TOTAL, ...ALLOWED.vertical.filter(v => v !== "Cross-vertical")];

/**
 * KPI sources: forecasting engine exports and long-format files
 * (date, vertical, kpi, forecast, forecast_bear, forecast_bull, actual).
 * Long-format actuals override the engine's for the same date, vertical and KPI;
 * their forecast (with its bear and bull) only fills days that have no forecast.
 * options: { kpiDefinitions, kpiStatus: { mode, thresholdPct }, today }
 */
function buildKpi(sources, options = {}) {
  const defs = options.kpiDefinitions || {};
  const baseKpis = Object.keys(defs).filter(k => !defs[k].derived);
  const today = options.today ?? todayDay();
  const issues = [], summaries = [];
  const add = (o) => { const i = makeIssue(o); issues.push(i); return i; };
  const verticals = new Map();   // vertical -> { name, sources: [sourceIdx], statusMode, series: Map(kpi -> Map(day -> point)) }
  const knownVerticals = KPI_VERTICALS();

  const vEntry = (name, statusMode) => {
    if (!verticals.has(name)) verticals.set(name, { name, sources: [], statusMode: statusMode || null, series: new Map(baseKpis.map(k => [k, new Map()])) });
    const v = verticals.get(name);
    if (statusMode && !v.statusMode) v.statusMode = statusMode;
    return v;
  };
  const checkRange = (src, p, kpi, day, sheetRow, vertical) => {
    if (p.forecast == null || p.bear == null || p.bull == null) return;
    const lo = Math.min(p.bear, p.bull), hi = Math.max(p.bear, p.bull);
    if (p.forecast < lo || p.forecast > hi) {
      add({ severity: "warning", code: "kpi_forecast_range", src, day, sheetRow, field: kpi, id: vertical,
        message: `${defs[kpi]?.label || kpi} forecast ${fmtNum(p.forecast)} on ${fmtDay(day)} is outside the bear–bull range (${fmtNum(p.bear)} – ${fmtNum(p.bull)}).`,
        values: [kpi, p.bear, p.forecast, p.bull] });
    }
  };
  const flagGaps = (src, days, sheetRowOf, vertical) => {
    const sorted = [...days].sort((a, b) => a - b);
    for (let i = 1; i < sorted.length; i++) {
      const missing = sorted[i] - sorted[i - 1] - 1;
      if (missing > 0) {
        const from = sorted[i - 1] + 1, to = sorted[i] - 1;
        add({ severity: "warning", code: "kpi_gap", src, day: from, sheetRow: sheetRowOf(sorted[i]), id: vertical,
          message: `No rows for ${missing === 1 ? fmtDay(from) : `${fmtDay(from)} – ${fmtDay(to)} (${missing} days)`}.`, values: [dayToISO(from), dayToISO(to)] });
      }
    }
  };

  const engines = sources.filter(s => s._fileType === "kpi_engine");
  const longs = sources.filter(s => s._fileType === "kpi_long");

  /* ---- Engine exports ---- */
  for (const src of engines) {
    const records = src._records;
    const layer = engineLayer(records);
    let vertical = engineVertical(src, records);
    const summary = { label: src.label, origin: src.origin, sourceIdx: src._idx, kind: "kpi_engine", layer, vertical: null, rowCount: 0, blankRows: 0, firstDay: null, lastDay: null };
    summaries.push(summary);
    if (!vertical) {
      add({ severity: "warning", code: "kpi_vertical_unset", src, sheetRow: 1,
        message: `Layer ${layer ?? "?"} KPI file with no vertical set. Add a KPI entry for this file in the config with its vertical; shown as "Unassigned" until then.`, values: [layer] });
      vertical = "Unassigned";
    } else if (!knownVerticals.some(k => k.toLowerCase() === vertical.toLowerCase())) {
      add({ severity: "warning", code: "kpi_unknown_vertical", src, sheetRow: 1, message: `KPI vertical "${vertical}" isn't a known vertical (${knownVerticals.join(", ")}).`, values: [vertical] });
    } else vertical = knownVerticals.find(k => k.toLowerCase() === vertical.toLowerCase());
    summary.vertical = vertical;
    const ve = verticals.get(vertical);
    if (ve && ve.sources.some(i => sources.find(s => s._idx === i)?._fileType === "kpi_engine")) {
      const other = sources.find(s => s._idx === ve.sources[0]);
      add({ severity: "error", code: "kpi_duplicate_source", src, sheetRow: 1,
        message: `Another engine file for ${vertical} is already loaded (${other?.label}). This one was ignored; remove one of them.`, values: [vertical, other?.label] });
      summary.ignored = true;
      continue;
    }
    const v = vEntry(vertical, src.statusMode);
    v.sources.push(src._idx);
    // Layout check: title in row 1, header starting "Date" in row 2.
    const headerCell = ((records[1] || [])[0] || "").trim();
    if (headerCell.toLowerCase() !== "date") {
      add({ severity: "error", code: "kpi_layout", src, sheetRow: 2, id: vertical,
        message: `Expected the engine layout: a title in row 1 and a header starting with "Date" in row 2, then one row per day. Row 2 starts with "${headerCell}".`, values: [headerCell] });
    }

    const seen = new Map();   // day -> sheet row
    for (let r = 2; r < records.length; r++) {
      const cells = records[r];
      const sheetRow = r + 1;
      if (!cells.some(c => c.trim())) { summary.blankRows++; continue; }
      const raw = (cells[ENGINE_LAYOUT.date] || "").trim();
      let day = parseAnyDate(raw);
      if (day === null && (day = parseSlashDate(raw)) !== null) {
        add({ severity: "warning", code: "date_format", src, day, sheetRow, id: vertical, message: `Date "${raw}" was read as ${fmtDay(day)} (day/month/year). The engine format is DD-Mmm-YY, e.g. 14-May-26.`, values: [raw] });
      }
      if (day === null) {
        add({ severity: "error", code: "kpi_bad_date", src, sheetRow, id: vertical, message: `Date "${raw}" can't be read. Expected DD-Mmm-YY, e.g. 14-May-26.`, values: [raw] });
        continue;
      }
      if (seen.has(day)) {
        add({ severity: "error", code: "kpi_duplicate_date", src, day, sheetRow, id: vertical, message: `${fmtDay(day)} appears more than once (rows ${seen.get(day)} and ${sheetRow}); the first row is used.`, values: [seen.get(day), sheetRow] });
        continue;
      }
      seen.set(day, sheetRow);
      summary.rowCount++;
      for (const [kpi, cols] of Object.entries(ENGINE_LAYOUT.kpis)) {
        if (!v.series.has(kpi)) v.series.set(kpi, new Map());
        const p = { forecast: null, bear: null, bull: null, actual: null, rows: {} };
        for (const f of SCENARIO_FIELDS) {
          const n = parseNumber(cells[cols[f]]);
          if (Number.isNaN(n)) {
            add({ severity: "error", code: "kpi_bad_number", src, day, sheetRow, field: kpi, id: vertical,
              message: `${defs[kpi]?.label || kpi} ${f} "${cells[cols[f]]}" on ${fmtDay(day)} isn't a number.`, values: [kpi, f, cells[cols[f]]] });
          } else p[f] = n;
        }
        p.rows.forecast = { sourceIdx: src._idx, sheetRow };
        if (p.actual !== null) p.rows.actual = { sourceIdx: src._idx, sheetRow };
        v.series.get(kpi).set(day, p);
        checkRange(src, p, kpi, day, sheetRow, vertical);
      }
    }
    const days = [...seen.keys()];
    if (days.length) { summary.firstDay = Math.min(...days); summary.lastDay = Math.max(...days); }
    flagGaps(src, days, d => seen.get(d), vertical);
  }

  /* ---- Long-format files ---- */
  for (const src of longs) {
    const records = src._records;
    const summary = { label: src.label, origin: src.origin, sourceIdx: src._idx, kind: "kpi_long", vertical: null, verticalsSeen: new Set(), rowCount: 0, blankRows: 0, firstDay: null, lastDay: null };
    summaries.push(summary);
    const header = records[0].map(normHeader);
    const col = {};
    header.forEach((h, i) => { if (!(h in col)) col[h] = i; });
    const missing = ["date", "vertical", "kpi"].filter(c => !(c in col));
    if (missing.length) {
      add({ severity: "error", code: "missing_columns", src, sheetRow: 1, message: `KPI file is missing column${missing.length > 1 ? "s" : ""}: ${missing.join(", ")}`, values: missing });
      continue;
    }
    const get = (cells, c) => (c in col ? (cells[col[c]] ?? "") : "").trim();
    const seen = new Map();           // "vertical|kpi|day" -> sheet row
    const daysByKey = new Map();      // "vertical|kpi" -> Map(day -> sheetRow), for gap checks
    const warnedVertical = new Set(), warnedKpi = new Set();
    for (let r = 1; r < records.length; r++) {
      const cells = records[r];
      const sheetRow = r + 1;
      if (!cells.some(c => c.trim())) { summary.blankRows++; continue; }
      const rawDate = get(cells, "date");
      let day = parseAnyDate(rawDate);
      if (day === null && (day = parseSlashDate(rawDate)) !== null) {
        add({ severity: "warning", code: "date_format", src, day, sheetRow, id: get(cells, "vertical"), message: `Date "${rawDate}" was read as ${fmtDay(day)} (day/month/year). Use YYYY-MM-DD.`, values: [rawDate] });
      }
      if (day === null) { add({ severity: "error", code: "kpi_bad_date", src, sheetRow, id: get(cells, "vertical"), message: `Date "${rawDate}" can't be read. Use YYYY-MM-DD.`, values: [rawDate] }); continue; }
      let vertical = get(cells, "vertical") || KPI_TOTAL;
      const known = knownVerticals.find(k => k.toLowerCase() === vertical.toLowerCase());
      if (known) vertical = known;
      else if (!warnedVertical.has(vertical)) {
        warnedVertical.add(vertical);
        add({ severity: "warning", code: "kpi_unknown_vertical", src, sheetRow, message: `KPI vertical "${vertical}" isn't a known vertical (${knownVerticals.join(", ")}).`, values: [vertical] });
      }
      const rawKpi = get(cells, "kpi");
      const kpi = baseKpis.find(k => k.toLowerCase() === rawKpi.toLowerCase());
      if (!kpi) {
        if (!warnedKpi.has(rawKpi)) {
          warnedKpi.add(rawKpi);
          const derived = Object.keys(defs).find(k => k.toLowerCase() === rawKpi.toLowerCase());
          add({ severity: "warning", code: "kpi_unknown_kpi", src, sheetRow,
            message: derived ? `KPI "${rawKpi}" is calculated by the tracker (${defs[derived].derived.join(" ÷ ")}); rows for it are ignored.` : `KPI "${rawKpi}" isn't defined in kpiDefinitions; its rows are ignored.`, values: [rawKpi] });
        }
        continue;
      }
      const key = `${vertical}|${kpi}|${day}`;
      if (seen.has(key)) {
        add({ severity: "error", code: "kpi_duplicate_date", src, day, sheetRow, field: kpi, id: vertical, message: `${vertical} ${defs[kpi].label || kpi} on ${fmtDay(day)} appears more than once (rows ${seen.get(key)} and ${sheetRow}); the first row is used.`, values: [vertical, kpi, seen.get(key), sheetRow] });
        continue;
      }
      seen.set(key, sheetRow);
      if (!daysByKey.has(`${vertical}|${kpi}`)) daysByKey.set(`${vertical}|${kpi}`, new Map());
      daysByKey.get(`${vertical}|${kpi}`).set(day, sheetRow);
      summary.rowCount++;
      summary.verticalsSeen.add(vertical);
      summary.firstDay = summary.firstDay === null ? day : Math.min(summary.firstDay, day);
      summary.lastDay = summary.lastDay === null ? day : Math.max(summary.lastDay, day);

      const vals = {};
      for (const [f, c] of [["forecast", "forecast"], ["bear", "forecast_bear"], ["bull", "forecast_bull"], ["actual", "actual"]]) {
        const n = parseNumber(get(cells, c));
        if (Number.isNaN(n)) add({ severity: "error", code: "kpi_bad_number", src, day, sheetRow, field: kpi, id: vertical, message: `${c} "${get(cells, c)}" for ${vertical} ${defs[kpi].label || kpi} on ${fmtDay(day)} isn't a number.`, values: [vertical, kpi, c, get(cells, c)] });
        else vals[f] = n;
      }
      const v = vEntry(vertical, src.statusMode);
      if (!v.sources.includes(src._idx)) v.sources.push(src._idx);
      const series = v.series.get(kpi);
      const p = series.get(day) || { forecast: null, bear: null, bull: null, actual: null, rows: {} };
      // A forecast and its bear/bull belong together: only fill them, as a set,
      // when nothing has supplied a forecast for this day yet.
      if (vals.forecast != null && p.forecast == null) {
