<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Tracker</title>
<script>
/* ============================================================
   CONFIG — edit this block to point the tracker at your data.
   ============================================================
   mode: "local" — drag CSV files onto the page or pick them with the file
                   picker. The browser remembers them until "Clear data".
         "urls"  — fetch every source that has a `url` on load. Use the CSV
                   link from Google Sheets: File > Share > Publish to web >
                   (pick the tab) > Comma-separated values.

   sources: one entry per sheet. Every field is optional except label.
     label     Name shown in the tracker.
     type      "moments", "campaigns" or "kpi". Leave out to let the
               tracker work it out from the file's contents.
     url       Published CSV link (used when mode is "urls").
     file      Local mode: file name pattern that identifies this sheet's
               export, * = anything. e.g. "*L1*Total*.csv"
     editUrl   The sheet's normal link, ending in /edit. Enables the
               "Edit in sheet" buttons.
     gid       The tab's id: the number after #gid= in the address bar
               when the tab is open.
     vertical  KPI sources only: whose numbers these are ("Total",
               "Grocery", ...). A Layer 1 engine file defaults to "Total".
     statusMode KPI sources only: "scenarios" (default; uses the bear and
               bull columns) or "threshold" (uses kpiStatus.thresholdPct).
*/
const CONFIG = {
  mode: "local",
  sources: [
    // { label: "Seasonal Moments", type: "moments", file: "seasonal_moments*.csv",
    //   url: "https://docs.google.com/spreadsheets/d/e/.../pub?gid=0&single=true&output=csv",
    //   editUrl: "https://docs.google.com/spreadsheets/d/<sheet id>/edit", gid: 0 },
    // { label: "S Market", type: "campaigns", file: "s_market*.csv", editUrl: "...", gid: 0 },
    // { label: "KPI forecast – Total App", type: "kpi", vertical: "Total", file: "*L1*Total*.csv", editUrl: "...", gid: 0 },
  ],

  // Values allowed in relevant_verticals that are audiences, not campaign verticals.
  informationalAudiences: ["Brand", "City"],

  // KPI definitions. unit: "count" or "QAR". agg: "sum" (added up over days).
  // derived: [numerator, denominator]; recalculated from the totals, never summed or averaged.
  kpiDefinitions: {
    orders:  { label: "Orders", unit: "count", agg: "sum", direction: "higher_is_better" },
    gmv_qar: { label: "GMV",    unit: "QAR",   agg: "sum", direction: "higher_is_better" },
    aov_qar: { label: "AOV",    unit: "QAR",   derived: ["gmv_qar", "orders"], direction: "higher_is_better" },
  },

  // Status colours. "scenarios": green at/above forecast, amber below forecast
  // but at/above bear, red below bear, blue above bull. Sources or KPIs without
  // bear/bull (and derived KPIs such as AOV) use the threshold instead:
  // red more than thresholdPct below forecast, blue more than thresholdPct above.
  kpiStatus: { mode: "scenarios", thresholdPct: 5 },
};
</script>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f1f3f6;
  --border: #dfe3e8;
  --border-strong: #c5ccd5;
  --text: #17202b;
  --text-2: #5a6573;
  --text-3: #8a94a1;
  --accent: #1f6feb;
  --error: #c62828;
  --error-bg: #fdecec;
  --warn: #a35c00;
  --warn-bg: #fff4e0;
  --ok: #1b7a3a;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);

  /* Vertical colours (bars, legend, chips) */
  --v-smk: #2563eb;
  --v-rst: #dc2626;
  --v-snm: #d97706;
  --v-grc: #16a34a;
  --v-sld: #0891b2;
  --v-srv: #7c3aed;
  --v-nvt: #db2777;
  --v-cvt: #475569;
  --v-unknown: #9ca3af;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  border-radius: 6px;
  padding: 6px 12px;
}
button:hover { background: var(--surface-2); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { filter: brightness(1.08); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); }
button.link:hover { text-decoration: underline; background: none; }

/* ---------- Header ---------- */
.app-header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
}
.app-header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.app-header .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 14px; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button[aria-pressed="true"] { background: var(--text); color: #fff; }
.issue-badge {
  display: inline-flex; gap: 6px; align-items: center;
}
.count { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 600; text-align: center; }
.count.error { background: var(--error-bg); color: var(--error); }
.count.warning { background: var(--warn-bg); color: var(--warn); }
.count.zero { background: var(--surface-2); color: var(--text-3); }

main { padding: 16px 20px 40px; max-width: 1600px; margin: 0 auto; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card > header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.card > header h2 { font-size: 14px; margin: 0; font-weight: 650; }
.card > header .spacer { flex: 1; }
.card.collapsed > :not(header) { display: none; }
.card.collapsed > header { border-bottom: 0; }
.chev { display: inline-block; transition: transform .15s; color: var(--text-3); }
.card.collapsed .chev { transform: rotate(-90deg); }
.card-toggle { border: 0; background: none; padding: 0; display: flex; gap: 8px; align-items: center; }
.card-toggle:hover { background: none; }

table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.grid th { font-weight: 600; color: var(--text-2); background: var(--surface-2); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.num { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: nowrap; }
.scroll { overflow: auto; max-height: 420px; }

/* ---------- Loader ---------- */
.loader-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dropzone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 48px 20px;
  text-align: center;
  background: var(--surface);
}
.dropzone h2 { margin: 0 0 6px; font-size: 18px; }
.dropzone p { margin: 0 0 16px; color: var(--text-2); }
.drop-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(31, 111, 235, .12);
  border: 3px dashed var(--accent);
  display: none; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 600; color: var(--accent);
  pointer-events: none;
}
body.dragging .drop-overlay { display: flex; }
.kind-tag { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); white-space: nowrap; }
.load-error { color: var(--error); }

/* ---------- Issues ---------- */
.issue-filters { display: inline-flex; gap: 4px; }
.issue-filters button { padding: 2px 10px; font-size: 12px; border-radius: 12px; }
.issue-filters button[aria-pressed="true"] { background: var(--text); color: #fff; border-color: var(--text); }
.sev { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; }
.sev.error { color: var(--error); background: var(--error-bg); }
.sev.warning { color: var(--warn); background: var(--warn-bg); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #f7f9fc; }
.empty-note { padding: 14px; color: var(--text-2); }

/* ---------- Data table ---------- */
tr.has-error td:first-child { box-shadow: inset 3px 0 0 var(--error); }
tr.has-warning td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.flash td { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: #fff3b0; } to { background: transparent; } }
.vdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.bad-value { color: var(--error); text-decoration: underline wavy var(--error); text-underline-offset: 3px; }

/* ---------- Period toolbar (month + week views) ---------- */
.period-bar { flex-wrap: wrap; }
.period-nav { display: inline-flex; align-items: center; gap: 4px; }
.period-nav button { padding: 4px 10px; font-size: 16px; line-height: 1; }
.period-nav h2 { font-size: 16px !important; min-width: 190px; text-align: center; }
input[type="month"] { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); }

/* ---------- Legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text-2); align-items: center; }
.legend .group { display: inline-flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend .group-title { font-weight: 600; color: var(--text); margin-right: 2px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend .sw-bar { width: 26px; height: 12px; border-radius: 3px; display: inline-block; position: relative; }
.legend .sep { width: 1px; align-self: stretch; background: var(--border); }

/* ---------- Timeline ---------- */
.tl-scroll { overflow-x: auto; }
.tl { --label-w: 210px; --row-h: 28px; min-width: 980px; position: relative; font-size: 12px; }
.tl-row { display: flex; min-height: var(--row-h); }
.tl-label { flex: 0 0 var(--label-w); width: var(--label-w); padding: 0 10px 0 14px; display: flex; align-items: center; gap: 6px; border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--surface); position: relative; z-index: 3; }
.tl-track { flex: 1; position: relative; min-width: 0; }

.tl-head { border-bottom: 1px solid var(--border-strong); background: var(--surface); }
.tl-head .tl-row { min-height: 0; }
.tl-weeks .tl-track, .tl-days .tl-track { height: 22px; }
.tl-weeks .tl-label, .tl-days .tl-label { color: var(--text-3); font-size: 11px; }
.wk-label { position: absolute; top: 0; height: 22px; display: flex; align-items: center; padding-left: 6px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid var(--border-strong); }
.wk-label.partial { color: var(--text-3); font-weight: 500; }
.day-cell { position: absolute; top: 0; height: 22px; display: flex; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.day-cell b { color: var(--text-2); font-weight: 600; }
.day-cell.sun { border-left: 1px solid var(--border-strong); }
.day-cell.today b { background: var(--error); color: #fff; border-radius: 9px; padding: 0 5px; }

.tl-body { position: relative; }
.tl-grid { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 0; pointer-events: none; z-index: 0; }
.tl-grid .weekend { position: absolute; top: 0; bottom: 0; background: rgba(23, 32, 43, .025); }
.tl-grid .wk-line { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); }
.tl-grid .today-line { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--error); z-index: 4; }
.tl-grid .today-line::before { content: ""; position: absolute; top: -4px; left: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--error); }

.tl-lane-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px 6px; background: var(--surface-2); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
.tl-lane-head h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; color: var(--text); }
.tl-lane-head .muted { font-size: 12px; }
.tl-group-first { border-top: 1px solid var(--border); }
.tl-campaigns .tl-lane-head + .tl-group-first { border-top: 0; }
.tl-group-head { cursor: pointer; font-weight: 600; color: var(--text); }
.tl-group-head:hover { background: var(--surface-2); }
.tl-group-head .chev { font-size: 10px; width: 10px; }
.tl-group-head.collapsed .chev { transform: rotate(-90deg); }
.tl-group-head .n { color: var(--text-3); font-weight: 500; }
.tl-empty { padding: 8px 14px; color: var(--text-3); font-style: italic; position: relative; z-index: 3; }

.tl-campaigns { position: relative; }
.tl-bands { position: absolute; top: 0; bottom: 0; left: var(--label-w); right: 0; pointer-events: none; z-index: 0; }
.band { position: absolute; top: 0; bottom: 0; background: rgba(71, 85, 105, .045); border-left: 1px dashed rgba(71, 85, 105, .4); border-right: 1px dashed rgba(71, 85, 105, .4); transition: background .15s; }
.band.t1 { background: rgba(71, 85, 105, .1); border-left: 1px solid rgba(71, 85, 105, .6); border-right: 1px solid rgba(71, 85, 105, .6); }
.band.hl { background: rgba(71, 85, 105, .2); border-color: rgba(71, 85, 105, .85); }
.bar.tentative { border-style: dashed; border-color: color-mix(in srgb, var(--c) 80%, #000); }

/* Bars: colour = vertical (--c), style = status */
.bar {
  --c: var(--v-unknown);
  position: absolute; top: 3px; height: calc(var(--row-h) - 6px);
  border-radius: 5px; border: 1.5px solid var(--c);
  padding: 0 7px; display: flex; align-items: center;
  font-size: 12px; font-weight: 600; text-align: left;
  z-index: 2; cursor: pointer; min-width: 6px;
}
.bar:hover { filter: brightness(.95); box-shadow: 0 1px 4px rgba(0,0,0,.18); z-index: 5; }
.bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-label { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; pointer-events: none; }
.bar.lbl-right .bar-label, .bar.lbl-left .bar-label { position: absolute; color: var(--text); overflow: visible; }
.bar.lbl-right .bar-label { left: calc(100% + 5px); }
.bar.lbl-left .bar-label { right: calc(100% + 5px); }

.bar.st-idea     { background: var(--surface); border-style: dashed; color: color-mix(in srgb, var(--c) 75%, #000); }
.bar.st-planning { background: color-mix(in srgb, var(--c) 18%, #fff); border-color: color-mix(in srgb, var(--c) 55%, #fff); color: color-mix(in srgb, var(--c) 60%, #000); }
.bar.st-live     { background: var(--c); color: #fff; }
.bar.st-complete { background: color-mix(in srgb, var(--c) 30%, #fff); border-color: color-mix(in srgb, var(--c) 30%, #fff); color: color-mix(in srgb, var(--c) 35%, #8a94a1); }
.bar.st-paused   { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 32%, #fff) 0 4px, #fff 4px 8px); color: color-mix(in srgb, var(--c) 60%, #000); }
.bar.st-none     { background: var(--surface); border-style: dotted; color: var(--text-2); }
.bar.st-complete .bar-label { text-decoration: none; }
.bar.lbl-right.st-complete .bar-label, .bar.lbl-left.st-complete .bar-label { color: var(--text-3); }

/* Clipped at the month edge: square edge + arrow */
.bar.clip-l { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left-width: 0; padding-left: 16px; }
.bar.clip-r { border-top-right-radius: 0; border-bottom-right-radius: 0; border-right-width: 0; padding-right: 16px; }
.bar.clip-l::before, .bar.clip-r::after { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; line-height: 1; opacity: .85; }
.bar.clip-l::before { content: "◀"; left: 2px; }
.bar.clip-r::after { content: "▶"; right: 2px; }
.bar.lbl-right.clip-r .bar-label { left: calc(100% + 5px); }

.bar .idot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; flex: none; box-shadow: 0 0 0 1.5px #fff; }
.bar .idot.error { background: var(--error); }
.bar .idot.warning { background: #e08a00; }

.mini-bar { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--c); opacity: .55; }

.tl-note { padding: 10px 14px; font-size: 12px; color: var(--text-2); border-top: 1px solid var(--border); }
.tl-note:empty { display: none; }

/* ---------- Status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 10px; border: 1px solid transparent; white-space: nowrap; }
.chip.st-idea { border: 1px dashed #8a94a1; color: #5a6573; background: #fff; }
.chip.st-planning { background: #e6efff; color: #1a4fb5; border-color: #c4d6fb; }
.chip.st-live { background: #1b7a3a; color: #fff; }
.chip.st-complete { background: #eef0f3; color: #8a94a1; }
.chip.st-paused { background: repeating-linear-gradient(135deg, #fde7c2 0 4px, #fff 4px 8px); color: #8a4b00; border-color: #f2c47a; }
.chip.st-none { background: var(--error-bg); color: var(--error); }
.chip.tier { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.chip.prio { background: #fff; color: var(--text); border-color: var(--border-strong); font-variant-numeric: tabular-nums; }
.chip.prio.bad { color: var(--error); border-color: var(--error); }
.chip.tent { background: #fff7e6; color: #8a4b00; border: 1px dashed #d99a3a; }
.tent { color: #8a4b00; }
.chips { display: inline-flex; gap: 4px; flex: none; }
.ch.info { background: #fff; border-style: dashed; color: var(--text-2); }

/* ---------- Weekly view ---------- */
.week-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.week-col { border-right: 1px solid var(--border); min-width: 0; }
.week-col:last-child { border-right: 0; }
.week-col > h3 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); background: var(--surface-2); display: flex; gap: 8px; align-items: baseline; }
.week-col > h3 .muted { font-weight: 500; }
.week-col .wk-empty { padding: 14px; color: var(--text-3); font-style: italic; }
.wk-tier { padding: 10px 14px 2px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.wk-vertical { padding: 6px 14px 4px; font-size: 12px; font-weight: 600; display: flex; align-items: center; }
.wk-card {
  --c: var(--v-unknown);
  display: block; width: calc(100% - 28px); margin: 0 14px 8px; text-align: left;
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px;
  padding: 8px 10px; background: var(--surface);
}
.wk-card:hover { background: #f9fafb; box-shadow: var(--shadow); }
.wk-card .t { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.wk-card .name { font-weight: 650; font-size: 13px; }
.wk-card .meta { color: var(--text-2); font-size: 12px; margin-top: 3px; }
.wk-card .meta b { font-weight: 600; color: var(--text); }
.wk-card .parent { color: var(--text-2); font-size: 12px; margin-top: 3px; }

/* ---------- Filters ---------- */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 14px; }
.filter-bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.filter-bar select, .ms > summary { border: 1px solid var(--border-strong); border-radius: 6px; padding: 4px 8px; background: var(--surface); font-size: 13px; color: var(--text); }
.filter-bar select.active, .ms.active > summary { border-color: var(--accent); background: #eef4ff; }
.ms { position: relative; }
.ms > summary { list-style: none; cursor: pointer; min-width: 150px; }
.ms > summary::-webkit-details-marker { display: none; }
.ms > summary::after { content: "▾"; float: right; margin-left: 8px; color: var(--text-3); }
.ms-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 24px rgba(16,24,40,.14); padding: 6px; min-width: 210px; }
.ms-menu label { display: flex; padding: 5px 8px; border-radius: 5px; color: var(--text); font-size: 13px; cursor: pointer; }
.ms-menu label:hover { background: var(--surface-2); }
.ms-menu .ms-actions { display: flex; gap: 12px; padding: 4px 8px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-size: 12px; }
.filter-note { font-size: 12px; color: var(--text-2); }

/* ---------- Side panel ---------- */
.panel-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, .25); z-index: 40; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); z-index: 41;
  background: var(--surface); box-shadow: -8px 0 32px rgba(16,24,40,.18);
  display: flex; flex-direction: column;
}
.panel-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--border); border-top: 5px solid var(--c, var(--v-unknown)); }
.panel-head .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel-head h2 { margin: 8px 0 4px; font-size: 19px; line-height: 1.25; }
.panel-head .close { margin-left: auto; border: 0; font-size: 22px; line-height: 1; padding: 2px 8px; color: var(--text-2); }
.panel-body { overflow-y: auto; padding: 4px 18px 24px; }
.panel dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin: 12px 0; font-size: 13px; }
.panel dt { color: var(--text-2); }
.panel dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.panel h4 { margin: 18px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.panel .text { white-space: pre-wrap; font-size: 13px; margin: 0; }
.panel .text.empty { color: var(--text-3); font-style: italic; }
.panel ul.bullets { margin: 0; padding-left: 18px; font-size: 13px; }
.panel .rel {
  --c: var(--v-unknown);
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 6px; padding: 7px 10px; margin-bottom: 6px; background: var(--surface);
}
.panel .rel:hover { background: var(--surface-2); }
.panel .rel .grow { flex: 1; min-width: 0; }
.panel .rel .sub { font-size: 12px; color: var(--text-2); }
.panel .issue { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.ch { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); margin: 0 4px 4px 0; }
.bar.pulse { animation: pulse 1.4s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(31,111,235,.7); } 100% { box-shadow: 0 0 0 10px rgba(31,111,235,0); } }

.print-header { display: none; }

@media (max-width: 900px) {
  .week-body { grid-template-columns: 1fr; }
  .week-col { border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 12px 16px 32px; }
  .app-header { padding: 10px 16px; }
}

/* ---------- Print (landscape A4/A3, size set by the Print control) ---------- */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; font-size: 11px; }
  .app-header, #emptyState, #sourcesCard, #issuesCard, #filtersCard, .panel, .panel-backdrop,
  .period-bar input, .period-bar button, .drop-overlay, .tl-note button.link { display: none !important; }
  main { padding: 0; max-width: none; }
  .card { box-shadow: none; border: 0; margin: 0; }
  .print-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--text); }
  .print-header h1 { margin: 0; font-size: 18px; }
  .print-header .sub { font-size: 10px; color: var(--text-2); text-align: right; }
  .period-bar { display: none !important; }
  .legend { padding: 4px 0 6px; border-bottom: 0; }
  .tl-scroll { overflow: visible; }
  .tl { min-width: 0 !important; width: 100%; --label-w: 150px; }
  .tl-head { border-top: 1px solid var(--border-strong); }
  .tl-row, .tl-lane-head, .wk-card { break-inside: avoid; }
  .tl-lane-head { break-after: avoid; }
  .tl-group-head .chev { visibility: hidden; }
  .bar:hover { box-shadow: none; filter: none; }
  .tl-note { border-top: 0; padding: 4px 0; }
  .week-body { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .week-col { border-right: 1px solid var(--border); border-bottom: 0; }
  .wk-card { box-shadow: none; padding: 4px 8px; margin-bottom: 4px; }
  .wk-card .name { font-size: 11px; }
  .wk-card .meta, .wk-card .parent { font-size: 10px; margin-top: 1px; }
  .wk-tier { padding-top: 6px; }
  .wk-vertical { padding: 3px 14px 2px; }
  .week-col > h3 { padding: 6px 10px; }
}

.placeholder { padding: 40px; text-align: center; color: var(--text-2); }
.hidden { display: none !important; }
</style>
</head>
<body>

    <div class="filter-bar" id="filterBar"></div>

    <header class="period-bar">
      <div class="period-nav">
        <button data-nav="-1" aria-label="Previous month">‹</button>

        <button data-nav="1" aria-label="Next month">›</button>
      </div>
      <input type="month" id="monthJump" aria-label="Jump to month">
      <button data-action="today">Today</button>

        <button data-nav="1" aria-label="Next week">›</button>

  </section>
  <section id="viewData" class="card view hidden">
