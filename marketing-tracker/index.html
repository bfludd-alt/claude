function openDay(day) { state.panelKey = null; state.panelBackDay = null; state.panelDay = day; renderPanel(); }

function kpiStatusChip(st) {
  if (st.status === "none") return "";
  if (st.status === "no_actual") return `<span class="chip kst">No actual yet</span>`;
  return `<span class="chip kst s-${st.status}-cell">${esc(statusText(st).replace(" (at or above forecast)", ""))}</span>`;
}

function dayKpiTable(kpi, vertical, label, day) {
  const ctx = { kpi, vertical, label };
  const defs = kpi.defs;
  let rowsHtml = "", firstRows = null;
  for (const [key, def] of Object.entries(defs)) {
    const p = kpiPoint(kpi, vertical, key, day);
    if (!p || p.forecast == null) continue;
    if (!def.derived && !firstRows) firstRows = p.rows;
    const st = kpiStatusOf(ctx, key, p);
    const v = x => fmtKpi(x, def);
    rowsHtml += `<tr>
      <th>${esc(def.label)}</th>
      <td>${v(p.forecast)}${p.bear != null ? `<div class="faint">bear ${fmtNum(Math.round(p.bear))} · bull ${fmtNum(Math.round(p.bull))}</div>` : ""}</td>
      <td class="${p.actual != null ? `s-${st.status}-cell` : "na"}">${p.actual != null ? v(p.actual) : "no actual yet"}${p.actualOverridden ? `<div class="faint">overrides engine ${fmtNum(Math.round(p.actualOverridden.was))}</div>` : ""}</td>
      <td>${p.actual != null ? `${signed(st.delta, x => fmtNum(Math.round(x) || 0))}<div class="faint">${fmtPct(st.deltaPct, true)}</div>` : "—"}</td>
      <td>${kpiStatusChip(st)}</td></tr>`;
  }
  if (!rowsHtml) return "";
  const links = firstRows?.forecast ? editButton(firstRows.forecast.sourceIdx, firstRows.forecast.sheetRow, "Edit in sheet", true) : "";
  const actualLink = firstRows?.actual && firstRows.actual.sourceIdx !== firstRows.forecast?.sourceIdx ? editButton(firstRows.actual.sourceIdx, firstRows.actual.sheetRow, "Edit actual", true) : "";
  return `<div class="day-kpi">
    <div class="day-kpi-head"><strong>${esc(label)}</strong><span class="spacer"></span>${links}${actualLink}</div>
    <table><thead><tr><th></th><th>Forecast</th><th>Actual</th><th>Delta</th><th>Status</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}

function renderDayPanel(root) {
  const day = state.panelDay;
  const [y] = dayParts(day);
  const kpi = state.data.kpi;
  const ctx = kpiContext();
  const live = state.data.rows.filter(r => passes(r) && r._start !== null && r._end !== null && r._start <= day && r._end >= day);
  const tierRank = r => ({ T1: 0, T2: 1, T3: 2 }[momentTier(r)] ?? 3);
  const moments = live.filter(r => r.tier === MOMENT).sort((a, b) => tierRank(a) - tierRank(b) || barName(a).localeCompare(barName(b)));
  const campaigns = live.filter(r => r.tier !== MOMENT);
  const byVertical = new Map();
  for (const r of campaigns) {
    const v = r.vertical || "(no vertical)";
    if (!byVertical.has(v)) byVertical.set(v, []);
    byVertical.get(v).push(r);
  }
  const verticals = uniqueSorted([...byVertical.keys()], ALLOWED.vertical);
  const tierOrder = r => TIER_ORDER.indexOf(r.tier) < 0 ? 9 : TIER_ORDER.indexOf(r.tier);

  // KPI tables: the series in view first, then any other loaded verticals
  const kpiVerticals = ctx ? [ctx.vertical, ...[...kpi.verticals.keys()].filter(v => v !== ctx.vertical)] : [];
  const kpiHtml = kpiVerticals.map(v => dayKpiTable(kpi, v, v === KPI_TOTAL ? "Company total" : v, day)).join("");
  const headline = (() => {
    if (!ctx || !kpi.defs.orders) return "";
    const p = kpiPoint(kpi, ctx.vertical, "orders", day);
    const st = kpiStatusOf(ctx, "orders", p);
    if (st.status === "none") return "";
    return `<div class="day-headline s-${st.status}-cell">${st.status === "no_actual" ? `Orders forecast ${fmtNum(Math.round(p.forecast))} · no actual yet`
      : `Orders ${fmtPct(st.deltaPct, true)} vs forecast · ${esc(statusText(st).replace(" (at or above forecast)", ""))}`}</div>`;
  })();

  root.innerHTML = `
    <div class="panel-backdrop" data-action="close-panel"></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head" style="--c:var(--text)">
        <div class="top">
          <span class="chip tier">Day</span>${day === todayDay() ? `<span class="chip" style="background:var(--error);color:#fff">Today</span>` : ""}
          <span class="spacer" style="flex:1"></span>
          <button class="btn btn-sm" data-day="${day - 1}" aria-label="Previous day">‹</button>
          <button class="btn btn-sm" data-day="${day + 1}" aria-label="Next day">›</button>
          <button class="close" data-action="close-panel" aria-label="Close">×</button>
        </div>
        <h2 id="panelTitle">${DAYS_SHORT[weekday(day)]} ${fmtDay(day)}</h2>
        <div class="muted">Week of ${fmtDayShort(weekStart(day))} ${y}</div>
      </div>
      <div class="panel-body">
        ${headline}
        <h4>KPIs</h4>
        ${kpiHtml || `<p class="text empty">${ctx ? "No forecast for this day." : "No KPI file loaded."}</p>`}

        <h4>Seasonal moments (${moments.length})</h4>
        ${moments.length ? moments.map(relCard).join("") : `<p class="text empty">No seasonal moments on this day</p>`}

        <h4>Campaigns live (${campaigns.length})</h4>
        ${verticals.length ? verticals.map(v => `<div class="day-vertical"><span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)} <span class="faint">${byVertical.get(v).length}</span></div>
          ${byVertical.get(v).sort((a, b) => tierOrder(a) - tierOrder(b) || a._start - b._start).map(relCard).join("")}`).join("")
          : `<p class="text empty">No campaigns live on this day</p>`}
        ${filterParts().length ? `<p class="faint" style="font-size:12px;margin-top:12px">Showing moments and campaigns that match the current filters.</p>` : ""}
      </div>
    </aside>`;
  root.querySelector(".close").focus({ preventScroll: true });
}

/* ---------- Dismissed issues ---------- */

// Dismissals are keyed by issue fingerprint (type + row id or date + the values
// that caused it), so an issue whose data changes comes back on its own.
// Called while `state` is being created, so it can't rely on consts declared below it.
function loadDismissals() {
  const DISMISS_KEY = "marketingTracker.dismissals.v1";
  try {
    const raw = JSON.parse(localStorage.getItem(DISMISS_KEY) || "{}");
    return new Map(Object.entries(raw));
  } catch { return new Map(); }
}
function saveDismissals() {
  try { localStorage.setItem("marketingTracker.dismissals.v1", JSON.stringify(Object.fromEntries(state.dismissals))); } catch { /* storage blocked: dismissals last until the page closes */ }
}
const isDismissed = i => state.dismissals.has(i.fingerprint);
const activeIssues = issues => issues.filter(i => !isDismissed(i));

function dismissIssues(fingerprints, note) {
  const at = new Date().toISOString();
  for (const fp of fingerprints) {
    const i = state.data.issues.find(x => x.fingerprint === fp);
    state.dismissals.set(fp, { note: note || "", at, code: i?.code, severity: i?.severity, message: i?.message, source: i?.source, id: i?.id });
  }
  saveDismissals();
  state.dismissForm = null;
  render();
}
function restoreIssue(fp) { state.dismissals.delete(fp); saveDismissals(); render(); }
function cleanStaleDismissals() {
  const live = new Set(state.data.issues.map(i => i.fingerprint));
  for (const fp of [...state.dismissals.keys()]) if (!live.has(fp)) state.dismissals.delete(fp);
  saveDismissals(); render();
}

function dismissalsJSON() {
  return JSON.stringify({
    type: "marketing-tracker-dismissals", version: 1, exportedAt: new Date().toISOString(),
    dismissals: [...state.dismissals].map(([fingerprint, d]) => ({ fingerprint, ...d })),
  }, null, 2);
}
// Export and import go through a dialog with the JSON as text, so they still
// work where downloads or storage are blocked (e.g. inside Apps Script).
function exportDismissals() {
  dialog(`<h3>Export dismissals</h3>
    <p>${state.dismissals.size} dismissal${state.dismissals.size === 1 ? "" : "s"}. Save them as a <span class="mono">.json</span> file, or copy the text and send it to the team.</p>
    <textarea id="dismissText" readonly rows="12">${esc(dismissalsJSON())}</textarea>
    <div class="dialog-actions"><button class="primary" data-action="dismiss-download">Download .json</button>
      <button data-action="dismiss-copy">Copy text</button><span class="spacer"></span><button data-action="close-dialog">Close</button></div>`);
}
function downloadDismissals() {
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([dismissalsJSON()], { type: "application/json" }));
    a.download = `tracker-dismissals-${dayToISO(todayDay())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    notice("If no download started, use Copy text and save it as a .json file.");
  } catch { notice("Downloads are blocked here. Use Copy text instead.", true); }
}
async function copyDismissals() {
  const ta = $("#dismissText");
  ta.select();
  try { await navigator.clipboard.writeText(ta.value); notice("Copied."); }
  catch { try { document.execCommand("copy"); notice("Copied."); } catch { notice("Select the text and copy it with Ctrl/Cmd+C.", true); } }
}
function openImportDialog() {
  dialog(`<h3>Import dismissals</h3>
    <p>Choose a dismissals <span class="mono">.json</span> file, or paste its text below. Imported dismissals are added to yours.</p>
    <p><button data-action="dismiss-import-file">Choose file…</button></p>
    <textarea id="importText" rows="10" placeholder="Paste exported dismissals here"></textarea>
    <div class="dialog-actions"><button class="primary" data-action="dismiss-import-text">Import pasted text</button><span class="spacer"></span><button data-action="close-dialog">Close</button></div>`);
}
function dialog(html) {
  $("#dialogRoot").innerHTML = html ? `<div class="panel-backdrop" data-action="close-dialog"></div><div class="dialog" role="dialog" aria-modal="true">${html}</div>` : "";
}
async function importDismissals(file) {
  return importDismissalsText(await file.text(), file.name);
}
function importDismissalsText(text, name = "pasted text") {
  const file = { name };
  try {
    const data = JSON.parse(text);
    if (data?.type !== "marketing-tracker-dismissals" || !Array.isArray(data.dismissals)) throw new Error("not a dismissals file");
    let added = 0;
    for (const d of data.dismissals) {
      if (!d.fingerprint) continue;
      const { fingerprint, ...rest } = d;
      if (!state.dismissals.has(fingerprint)) added++;
      state.dismissals.set(fingerprint, rest);
    }
    saveDismissals();
    render();
    const matching = data.dismissals.filter(d => state.data.issues.some(i => i.fingerprint === d.fingerprint)).length;
    dialog("");
    notice(`Imported ${data.dismissals.length} dismissal${data.dismissals.length === 1 ? "" : "s"} from ${esc(file.name)} (${added} new; ${matching} match current issues).`);
  } catch (e) {
    notice(`Couldn't import ${esc(file.name)}: ${esc(e.message)}. Expected a file made with Export dismissals.`, true);
  }
}

// Marker for a row's issues: active error / active warning / a dismissed error only.
function rowIssueState(r) {
  const act = activeIssues(r._issues);
  if (act.some(i => i.severity === "error")) return "error";
  if (act.length) return "warning";
  if (r._issues.some(i => i.severity === "error")) return "dismissed";
  return "";
}
function issueDot(r) {
  const s = rowIssueState(r);
  return s ? `<span class="idot ${s}" title="${s === "dismissed" ? "Has a dismissed error" : `Has ${s}s`}"></span>` : "";
}

function issueRowHTML(i, sameType) {
  const where = `${esc(i.source)}${i.sheetRow ? ` <span class="muted">· row ${i.sheetRow}</span>` : ` <span class="muted">· file</span>`}`;
  const target = i.rowKey ? `data-row="${esc(i.rowKey)}"` : i.day != null ? `data-day="${i.day}"` : "";
  const form = state.dismissForm && state.dismissForm.fingerprints.includes(i.fingerprint) && state.dismissForm.anchor === i.fingerprint;
  return `<tr class="${target ? "clickable" : ""}" ${target}>
      <td><span class="sev ${i.severity}">${i.severity === "error" ? "Error" : "Warning"}</span></td>
      <td style="white-space:nowrap">${where}</td>
      <td class="mono">${esc(i.id)}</td>
      <td>${esc(i.message)}</td>
      <td class="issue-actions">${editButton(i.sourceIdx, i.sheetRow, "Edit in sheet", true)}
        <button class="btn btn-sm" data-action="dismiss" data-fp="${esc(i.fingerprint)}">Dismiss</button>
        ${sameType > 1 ? `<button class="btn btn-sm" data-action="dismiss-type" data-fp="${esc(i.fingerprint)}" title="${esc(ISSUE_TYPES[i.code] || i.code)}">All ${sameType} like this</button>` : ""}</td>
    </tr>${form ? `<tr class="dismiss-form"><td colspan="5">
      <label>${state.dismissForm.fingerprints.length > 1 ? `Dismiss all ${state.dismissForm.fingerprints.length} “${esc(ISSUE_TYPES[i.code] || i.code)}” ${i.severity}s showing now.` : `Dismiss this ${i.severity}.`}
      Note (optional): <input id="dismissNote" type="text" placeholder="e.g. Intentional: standalone occasion" maxlength="200"></label>
      <button class="btn btn-sm primary" data-action="dismiss-confirm">Dismiss</button>
      <button class="btn btn-sm" data-action="dismiss-cancel">Cancel</button>
      ${state.dismissForm.fingerprints.length > 1 ? `<span class="faint">New issues of this type will still show.</span>` : ""}</td></tr>` : ""}`;
}

/* ---------- Weekly view ---------- */

const TIER_ORDER = [MOMENT, BRAND, TACTICAL];
const TIER_PLURAL = { [MOMENT]: "Seasonal Moments", [BRAND]: "Brand Campaigns", [TACTICAL]: "Tactical Campaigns" };

function prioChip(r) {
  return r.priority ? `<span class="chip prio ${r._bad_priority ? "bad" : ""}" title="Priority">${esc(r.priority)}</span>` : "";
}
function statusChip(status) {
  const known = STATUS_LABELS.includes(status);
  return `<span class="chip st-${known ? status.toLowerCase() : "none"}">${esc(status || "No status")}</span>`;
}

function weekCard(r, ws, we, kind) {
  const p = r._parent ? state.data.byKey.get(r._parent) : null;
  let when;
  if (kind === "launching") {
    when = `Launches <b>${fmtDayShort(r._start)}</b>` +
      (r._end === r._start ? " · one day" : r._end <= we ? ` · ends ${fmtDayShort(r._end)}` : ` · runs to ${fmtDay(r._end)}`);
  } else if (kind === "ending") {
    when = `Ends <b>${fmtDayShort(r._end)}</b> · started ${fmtDay(r._start)}`;
  } else {
    when = `Since ${fmtDay(r._start)} · until <b>${fmtDay(r._end)}</b>`;
  }
  const facts = [
    `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>${esc(r.vertical || "No vertical")}`,
    r.campaign_type ? esc(r.campaign_type) : "",
    `Owner: ${r.owner ? `<b>${esc(r.owner)}</b>` : `<span class="faint">none</span>`}`,
  ].filter(Boolean).join(" · ");
  let parent = "";
  if (p) parent = `↳ Parent: ${esc(p.name || p.id)}`;
  else if (r.parent_id) parent = `↳ Parent: <span class="bad-value">${esc(r.parent_id)}</span> (not found)`;
  else if (r.tier !== MOMENT) parent = `↳ <span class="faint">No parent</span>`;
  return `<button class="wk-card" data-row="${esc(r._key)}" style="--c:${verticalColor(r.vertical)}">
    <div class="t"><span class="name">${issueDot(r)}${esc(barName(r))}</span><span class="chips">${prioChip(r)}${statusChip(r.status)}</span></div>
    <div class="meta">${when}${r._tentative ? ` · <span class="tent">date tentative</span>` : ""}</div>
    <div class="meta">${facts}</div>
    <div class="meta">Channels: ${r._channels.length ? esc(r._channels.join(", ")) : `<span class="faint">none</span>`}</div>
    ${parent ? `<div class="parent">${parent}</div>` : ""}
  </button>`;
}

function weekSection(items, ws, we, kind) {
  let html = "";
  const tiers = [...TIER_ORDER, null];
  for (const tier of tiers) {
    const inTier = items.filter(r => tier ? r.tier === tier : !TIER_ORDER.includes(r.tier));
    if (!inTier.length) continue;
    html += `<div class="wk-tier">${tier ? TIER_PLURAL[tier] : "Unclassified (missing or invalid tier)"}</div>`;
    const verticals = uniqueSorted(inTier.map(r => r.vertical || "(no vertical)"), ALLOWED.vertical);
    for (const v of verticals) {
      const list = inTier.filter(r => (r.vertical || "(no vertical)") === v)
        .sort((a, b) => a._start - b._start || a._end - b._end || barName(a).localeCompare(barName(b)));
      if (tier !== MOMENT) html += `<div class="wk-vertical"><span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</div>`;
      html += list.map(r => weekCard(r, ws, we, kind)).join("");
    }
  }
  return html;
}

function renderWeek() {
  const ws = weekStart(state.cursor), we = ws + 6;
  const endDate = dayToDate(we);
  $("#weekTitle").textContent = `Week of ${fmtDayShort(ws)}`;
  $("#weekRange").textContent = `${fmtDayShort(ws)} – ${fmtDayShort(we)} ${endDate.getUTCFullYear()}`;
  $("#weekJump").value = dayToISO(state.cursor);

  renderWeekKpi(ws);
  const rows = state.data.rows.filter(passes);
  const dated = rows.filter(r => r._start !== null && r._end !== null);
  // Each initiative lands in exactly one section.
  const sections = [
    ["launching", "Launching this week", dated.filter(r => r._start >= ws && r._start <= we), "Nothing launching this week"],
    ["live", "Live this week", dated.filter(r => r._start < ws && r._end > we), "Nothing running through this week"],
    ["ending", "Ending this week", dated.filter(r => r._start < ws && r._end >= ws && r._end <= we), "Nothing ending this week"],
  ];
  $("#weekBody").innerHTML = sections.map(([kind, title, items, empty]) => `
    <div class="week-col">
      <h3>${title} <span class="muted">${items.length}</span></h3>
      ${items.length ? weekSection(items, ws, we, kind) : `<div class="wk-empty">${empty}</div>`}
    </div>`).join("");
  renderUndatedNote("#weekNote", rows);
}

function renderUndatedNote(sel, rows) {
  const undated = rows.filter(r => r._start === null || r._end === null);
  $(sel).innerHTML = undated.length
    ? `${undated.length} initiative${undated.length === 1 ? " isn't" : "s aren't"} shown because of missing or invalid dates:
       ${undated.map(r => `<button class="link" data-row="${esc(r._key)}">${esc(r.id || barName(r))}</button>`).join(", ")}. See Data issues.`
    : "";
}

/* ---------- Side panel ---------- */

function openPanel(key) {
  state.panelBackDay = state.panelDay ?? (state.panelKey ? state.panelBackDay : null);
  state.panelDay = null;
  state.panelKey = key;
  renderPanel();
}
function closePanel() { state.panelKey = null; state.panelDay = null; state.panelBackDay = null; renderPanel(); }

function relCard(r) {
  const dates = r._start !== null && r._end !== null ? `${fmtDay(r._start)} – ${fmtDay(r._end)}` : "invalid dates";
  return `<button class="rel" data-row="${esc(r._key)}" style="--c:${verticalColor(r.vertical)}">
    <span class="grow"><strong>${esc(barName(r))}</strong>
      <div class="sub">${[r.tier, r.vertical, dates].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="sub faint">${esc(r._source)} · row ${r._sheetRow}</div></span>
    ${statusChip(r.status)}</button>`;
}

function renderPanel() {
  const root = $("#panelRoot");
  if (state.panelDay != null && state.data) { renderDayPanel(root); return; }
  const r = state.panelKey && state.data ? state.data.byKey.get(state.panelKey) : null;
  if (!r) { root.innerHTML = ""; return; }
  const { byKey } = state.data;
  const p = r._parent ? byKey.get(r._parent) : null;
  const children = r._children.map(k => byKey.get(k)).sort((a, b) => (a._start ?? 1e9) - (b._start ?? 1e9) || barName(a).localeCompare(barName(b)));
  const bad = f => r[`_bad_${f}`];
  const val = (f, text = r[f]) => text ? (bad(f) ? `<span class="bad-value">${esc(text)}</span>` : esc(text)) : `<span class="faint">—</span>`;
  const days = r._start !== null && r._end !== null ? r._end - r._start + 1 : null;
  const textBlock = (label, f) => {
    const v = r[f];
    let body;
    if (!v) body = `<p class="text empty">Not filled in</p>`;
    else if (f === "top_highlights" && v.includes(";")) body = `<ul class="bullets">${v.split(";").map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
    else body = `<p class="text">${esc(v)}</p>`;
    return `<h4>${label}</h4>${body}`;
  };

  root.innerHTML = `
    <div class="panel-backdrop" data-action="close-panel"></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head" style="--c:${verticalColor(r.vertical)}">
        <div class="top">
          <span class="chip tier">${esc(r.tier || "No tier")}</span>${prioChip(r)}${statusChip(r.status)}${r._tentative ? `<span class="chip tent">Date tentative</span>` : ""}
          <button class="close" data-action="close-panel" aria-label="Close">×</button>
        </div>
        ${state.panelBackDay != null ? `<button class="link" data-day="${state.panelBackDay}">← Back to ${fmtDayShort(state.panelBackDay)}</button>` : ""}
        <h2 id="panelTitle">${esc(barName(r))}</h2>
        <div class="muted"><span class="mono">${esc(r.id || "no id")}</span> · ${esc(r._source)}, row ${r._sheetRow}</div>
      </div>
      <div class="panel-body">
        <dl>
          <dt>Vertical</dt><dd>${r.vertical ? `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>` : ""}${val("vertical")}</dd>
          ${r.sub_vertical ? `<dt>Sub-vertical</dt><dd>${esc(r.sub_vertical)}</dd>` : ""}
          ${r.tier === MOMENT ? `<dt>Relevant to</dt><dd>${r._relevantAll && !r._relevant.size ? `<span class="ch">All verticals</span>` : ""}${[...r._relevant].map(v => `<span class="ch"><span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</span>`).join("")}${r._audiences.map(a => `<span class="ch info" title="Audience, not a campaign vertical">${esc(a)}</span>`).join("")}</dd>` : ""}
          <dt>${r.tier === MOMENT ? "Moment type" : "Campaign type"}</dt><dd>${val("campaign_type")}</dd>
          <dt>Priority</dt><dd>${val("priority")}</dd>
          <dt>Dates</dt><dd>${r._start !== null ? fmtDayShort(r._start) + " " + dayToDate(r._start).getUTCFullYear() : val("start_date")} – ${r._end !== null ? fmtDayShort(r._end) + " " + dayToDate(r._end).getUTCFullYear() : val("end_date")}${days ? ` <span class="muted">(${days} day${days === 1 ? "" : "s"})</span>` : ""}</dd>
          ${r.date_confidence || r.tier === MOMENT ? `<dt>Date confidence</dt><dd>${val("date_confidence")}${r._tentative ? ` <span class="chip tent">Date tentative</span>` : ""}</dd>` : ""}
          <dt>Owner</dt><dd>${val("owner")}</dd>
          <dt>Channels</dt><dd>${r._channels.length ? r._channels.map(c => `<span class="ch">${esc(c)}</span>`).join("") : `<span class="faint">—</span>`}</dd>
          <dt>Budget</dt><dd>${r._budget !== null ? `QAR ${r._budget.toLocaleString("en-US")}` : r.budget_qar ? `<span class="bad-value">${esc(r.budget_qar)}</span>` : `<span class="faint">—</span>`}</dd>
          <dt>Source</dt><dd>${esc(r._source)} · row ${r._sheetRow}</dd>
        </dl>
        <div class="panel-actions">${editButton(r._sourceIdx, r._sheetRow)}
        ${r._start !== null && r._end !== null ? `<button data-action="locate" data-key="${esc(r._key)}">Show on month roadmap</button>` : ""}</div>

        ${r._issues.length ? `<h4>Data issues (${activeIssues(r._issues).length}${r._issues.length > activeIssues(r._issues).length ? ` + ${r._issues.length - activeIssues(r._issues).length} dismissed` : ""})</h4>${r._issues.map(i => `<div class="issue ${isDismissed(i) ? "is-dismissed" : ""}"><span class="sev ${i.severity}">${i.severity === "error" ? "Error" : "Warning"}</span><span>${esc(i.message)}${isDismissed(i) ? ` <em class="faint">Dismissed${state.dismissals.get(i.fingerprint).note ? `: ${esc(state.dismissals.get(i.fingerprint).note)}` : ""}</em>` : ""}</span></div>`).join("")}` : ""}

        <h4>Parent</h4>
        ${p ? relCard(p) : r.parent_id ? `<p class="text"><span class="bad-value">${esc(r.parent_id)}</span> doesn't match any loaded id.</p>` : `<p class="text empty">${r.tier === MOMENT ? "Seasonal moments have no parent" : "No parent"}</p>`}

        <h4>Children (${children.length})</h4>
        ${children.length ? children.map(relCard).join("") : `<p class="text empty">No initiatives link to this one</p>`}

        ${textBlock("Objective", "objective")}
        ${textBlock("Brief", "brief")}
        ${textBlock("Target audience", "target_audience")}
        ${textBlock("Goal", "goal")}
        ${textBlock("KPIs", "kpis")}
        ${textBlock("Key message", "key_message")}
        ${textBlock("Top highlights", "top_highlights")}
        ${textBlock("Notes", "notes")}
      </div>
    </aside>`;
  root.querySelector(".close").focus({ preventScroll: true });
}

function locate(key) {
  const r = state.data.byKey.get(key);
  if (!r || r._start === null) return;
  state.panelKey = null;
  state.view = "month";
  const visibleStart = r._start;
  state.cursor = visibleStart;
  render();
  const bar = document.querySelector(`.bar[data-row="${CSS.escape(key)}"]`);
  if (bar) {
    bar.scrollIntoView({ block: "center", behavior: "smooth" });
    bar.classList.remove("pulse"); void bar.offsetWidth; bar.classList.add("pulse");
  }
}

/* ---------- Print ---------- */

const PAPER_WIDTH_MM = { A4: 297, A3: 420 };
const PRINT_MARGIN_MM = 10;

function applyPaperSize() {
  const size = $("#paperSize").value;
  let el = document.getElementById("pageSize");
  if (!el) { el = document.createElement("style"); el.id = "pageSize"; document.head.appendChild(el); }
  el.textContent = `@page { size: ${size} landscape; margin: ${PRINT_MARGIN_MM}mm; }`;
  try { localStorage.setItem("marketingTracker.paper", size); } catch { /* ignore */ }
}

function renderPrintHeader() {
  let title;
  if (state.view === "week") {
    const ws = weekStart(state.cursor);
    title = `Marketing plan · Week of ${fmtDayShort(ws)} ${dayToDate(ws).getUTCFullYear()}`;
  } else if (state.view === "month") {
    const [y, m] = cursorMonth();
    title = `Marketing plan · ${MONTHS_LONG[m]} ${y}`;
  } else title = "Marketing plan · All initiatives";
  const parts = filterParts();
  $("#printHeader").innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="sub">${parts.length ? esc(parts.join(" · ")) + "<br>" : ""}
      Sources: ${esc(state.data.sources.map(s => s.label).join(", "))}<br>
      Printed ${fmtDay(todayDay())}</div>`;
}

window.addEventListener("beforeprint", () => {
  // Re-pack bars for the paper width so labels beside bars don't collide.
  const mm = PAPER_WIDTH_MM[$("#paperSize").value] - 2 * PRINT_MARGIN_MM;
  state.printWidth = Math.floor(mm / 25.4 * 96);
  if (state.view === "month" && state.data?.rows.length) renderMonth();
});
window.addEventListener("afterprint", () => {
  state.printWidth = null;
  if (state.view === "month" && state.data?.rows.length) renderMonth();
});

/* ---------- Events ---------- */

document.addEventListener("click", e => {
  if (state.openMenu && !e.target.closest(".ms")) { state.openMenu = null; renderFilters(); }
  if (e.target.closest("a[href]")) return;   // links (Edit in sheet) open on their own
  const t = e.target.closest("[data-action],[data-view],[data-toggle],[data-sev],[data-row],[data-day],[data-nav],[data-group]");
  if (!t) return;
  const a = t.dataset.action;
  if (a === "pick") pickFiles();
  else if (a === "clear") clearData();
  else if (a === "reload") reloadData();
  else if (a === "close-notice") $("#notice").classList.add("hidden");
  else if (a === "dismiss" || a === "dismiss-type") {
    const i = state.data.issues.find(x => x.fingerprint === t.dataset.fp);
    const fps = a === "dismiss" ? [i.fingerprint] : activeIssues(state.data.issues).filter(x => x.code === i.code && x.severity === i.severity).map(x => x.fingerprint);
    state.dismissForm = { anchor: i.fingerprint, fingerprints: fps };
    renderIssues();
  }
  else if (a === "dismiss-confirm") dismissIssues(state.dismissForm.fingerprints, $("#dismissNote")?.value.trim());
  else if (a === "dismiss-cancel") { state.dismissForm = null; renderIssues(); }
  else if (a === "restore") restoreIssue(t.dataset.fp);
  else if (a === "clean-dismissals") cleanStaleDismissals();
  else if (a === "export-dismissals") exportDismissals();
  else if (a === "import-dismissals") openImportDialog();
  else if (a === "dismiss-import-file") $("#dismissImport").click();
  else if (a === "dismiss-import-text") importDismissalsText($("#importText").value);
  else if (a === "dismiss-download") downloadDismissals();
  else if (a === "dismiss-copy") copyDismissals();
  else if (a === "close-dialog") dialog("");
  else if (t.dataset.action === "today") { state.cursor = todayDay(); render(); }
  else if (t.dataset.action === "close-panel") closePanel();
  else if (t.dataset.action === "locate") locate(t.dataset.key);
  else if (t.dataset.action === "print") { if (state.view === "data") { state.view = "month"; render(); } window.print(); }
  else if (t.dataset.action === "clear-filters") { state.filters = defaultFilters(); render(); }
  else if (t.dataset.action === "all-verticals") { state.filters.verticals = null; render(); }
  else if (t.dataset.nav) { step(+t.dataset.nav); }
  else if (t.dataset.group) {
    const k = t.dataset.group;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    render();
  }
  else if (t.dataset.view) { state.view = t.dataset.view; render(); }
  else if (t.dataset.toggle) $(`#${t.dataset.toggle}`).classList.toggle("collapsed");
  else if (t.dataset.sev) { state.issueFilter = t.dataset.sev; renderIssues(); }
  else if (t.dataset.row) openPanel(t.dataset.row);
  else if (t.dataset.day) openDay(+t.dataset.day);
});
$("#dismissImport").addEventListener("change", e => { if (e.target.files[0]) importDismissals(e.target.files[0]); e.target.value = ""; });
document.addEventListener("keydown", e => {
  if (e.target.id === "dismissNote" && e.key === "Enter") { e.preventDefault(); dismissIssues(state.dismissForm.fingerprints, e.target.value.trim()); }
});
document.addEventListener("toggle", e => {
  if (e.target.matches?.("[data-dismissed-box]")) state.dismissedOpen = e.target.open;
}, true);
$("#filePicker").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });

function step(dir) {
  if (state.view === "week") state.cursor += 7 * dir;
  else { const [y, m] = cursorMonth(); state.cursor = dayFromYMD(y, m + dir, 1); }
  render();
}
$("#weekJump").addEventListener("change", e => {
  const d = parseISODate(e.target.value || "");
  if (d !== null) { state.cursor = d; render(); }
});
$("#paperSize").addEventListener("change", applyPaperSize);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("#dialogRoot").innerHTML) dialog("");
  else if (state.panelKey || state.panelDay != null) closePanel();
});
$("#monthJump").addEventListener("change", e => {
  const [y, m] = (e.target.value || "").split("-").map(Number);
  if (y && m) { state.cursor = dayFromYMD(y, m - 1, 1); render(); }
});
document.addEventListener("keydown", e => {
  const g = e.target.closest?.("[data-group]");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); g.click(); }
});
// Hovering a seasonal moment highlights its band behind the campaigns
document.addEventListener("mouseover", e => {
  const m = e.target.closest?.("[data-moment]");
  document.querySelectorAll(".band.hl").forEach(b => b.classList.remove("hl"));
  if (m) document.querySelector(`.band[data-band="${CSS.escape(m.dataset.moment)}"]`)?.classList.add("hl");
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.view === "month" && state.data?.rows.length) renderMonth(); }, 120);
});

let dragDepth = 0;
document.addEventListener("dragenter", e => { if (e.dataTransfer?.types.includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove("dragging"); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  if (!e.dataTransfer?.files?.length) return;
  const files = [...e.dataTransfer.files];
  // Ask for file handles while the drop event is live (Chrome/Edge), so Reload can re-read them.
  const pending = [...e.dataTransfer.items].filter(i => i.kind === "file" && i.getAsFileSystemHandle).map(i => i.getAsFileSystemHandle().catch(() => null));
  Promise.all(pending).then(hs => addFiles(files, new Map(hs.filter(h => h && h.kind === "file").map(h => [h.name, h]))));
});

/* ---------- Start ---------- */

try { const paper = localStorage.getItem("marketingTracker.paper"); if (paper) $("#paperSize").value = paper; } catch { /* ignore */ }
applyPaperSize();
handleStore.all().then(h => { state.handles = h; });

try {
  if (MODE === "appsScript") {
    loadFromAppsScript().catch(e => showScriptError(String(e && (e.stack || e.message) || e)));
  } else if (MODE === "urls") {
    render();
    loadUrls().catch(e => showScriptError(String(e && (e.stack || e.message) || e)));
  } else {
    const saved = storageGet();
    if (Array.isArray(saved)) state.sources = saved.map(s => ({ ...s, origin: "file" }));
    rebuild();
  }
} catch (e) {
  showScriptError(String(e && (e.stack || e.message) || e));
}
</script>
</body>
</html>
