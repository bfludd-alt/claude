/* ---------- Filters ---------- */

const NO_OWNER = "(no owner)";

// Campaigns: every filter applies.
// Seasonal moments ignore the type and owner filters. With a vertical filter,
// a moment shows when its relevant_verticals include a selected vertical (or
// All), or when it is the parent or grandparent of a visible campaign. Linked
// moments also bypass the moment tier filter, since the campaign depends on them.
function campaignPasses(r) {
  const f = state.filters;
  if (f.tier && r.tier !== f.tier) return false;
  if (f.status && r.status !== f.status) return false;
  if (f.verticals && !f.verticals.has(r.vertical)) return false;
  if (f.campaign_type && r.campaign_type !== f.campaign_type) return false;
  if (f.owner && (r.owner || NO_OWNER) !== f.owner) return false;
  return true;
}
const momentTier = r => (r._bad_priority ? "" : r.priority) || "";
function momentPasses(r, linked) {
  const f = state.filters;
  if (f.tier && f.tier !== MOMENT) return false;
  if (f.status && r.status !== f.status) return false;
  if (linked.has(r._key)) return true;
  if (!f.momentTiers.has(momentTier(r))) return false;
  if (f.verticals && !f.showAllMoments) return r._relevantAll || [...f.verticals].some(v => r._relevant.has(v));
  return true;
}
function computeVisible() {
  const { rows, byKey } = state.data;
  const visible = new Set(), linked = new Set();
  for (const r of rows) {
    if (r.tier === MOMENT || !campaignPasses(r)) continue;
    visible.add(r._key);
    for (let k = r._parent, hops = 0; k && hops < 5; hops++) {
      const p = byKey.get(k);
      if (!p) break;
      if (p.tier === MOMENT) linked.add(p._key);
      k = p._parent;
    }
  }
  for (const r of rows) if (r.tier === MOMENT && momentPasses(r, linked)) visible.add(r._key);
  state.visibleKeys = visible;
  state.linkedMoments = linked;
}
const passes = r => state.visibleKeys.has(r._key);

function filterParts() {
  const f = state.filters, parts = [];
  if (f.verticals) parts.push(`Vertical: ${f.verticals.size ? [...f.verticals].join(", ") : "none"}`);
  if (f.tier) parts.push(`Tier: ${f.tier}`);
  if (f.campaign_type) parts.push(`Type: ${f.campaign_type}`);
  if (f.status) parts.push(`Status: ${f.status}`);
  if (f.owner) parts.push(`Owner: ${f.owner}`);
  const tiersNow = MOMENT_TIERS.filter(t => f.momentTiers.has(t));
  if (tiersNow.join() !== "T1,T2,") parts.push(`Moment tiers: ${tiersNow.map(t => t || "no tier").join(", ") || "none"}`);
  if (f.showAllMoments) parts.push("All moments shown");
  return parts;
}

function uniqueSorted(values, order) {
  const set = [...new Set(values)];
  return set.sort((a, b) => {
    const ia = order ? order.indexOf(a) : -1, ib = order ? order.indexOf(b) : -1;
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
}

function renderFilters() {
  const rows = state.data.rows, f = state.filters;
  const campaigns = rows.filter(r => r.tier !== MOMENT);
  const vOpts = uniqueSorted(campaigns.map(r => r.vertical).filter(Boolean), ALLOWED.vertical);
  const typeOpts = uniqueSorted(campaigns.map(r => r.campaign_type).filter(Boolean), ALLOWED.campaign_type);
  const ownerOpts = uniqueSorted(campaigns.map(r => r.owner || NO_OWNER));

  const sel = (name, label, options) => `
    <label>${label}
      <select data-filter="${name}" class="${f[name] ? "active" : ""}">
        <option value="">All</option>
        ${uniqueSorted([...options, ...(f[name] ? [f[name]] : [])], options).map(o => `<option ${f[name] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
      </select>
    </label>`;

  const vSummary = !f.verticals ? "All" : !f.verticals.size ? "None" : f.verticals.size <= 2 ? [...f.verticals].join(", ") : `${f.verticals.size} selected`;
  const tiersNow = MOMENT_TIERS.filter(t => f.momentTiers.has(t));
  const mSummary = tiersNow.length === MOMENT_TIERS.length ? "All tiers" : tiersNow.length ? tiersNow.map(t => t || "No tier").join(", ") : "None";
  const shown = rows.filter(passes).length;
  const momentCounts = Object.fromEntries(MOMENT_TIERS.map(t => [t, rows.filter(r => r.tier === MOMENT && momentTier(r) === t).length]));
  $("#filterBar").innerHTML = `
    <label>Vertical
      <details class="ms ${f.verticals ? "active" : ""}" data-menu="vertical" ${state.openMenu === "vertical" ? "open" : ""}>
        <summary>${esc(vSummary)}</summary>
        <div class="ms-menu">
          <div class="ms-actions"><button class="link" data-action="all-verticals">All verticals</button></div>
          ${vOpts.map(v => `<label><input type="checkbox" data-vertical="${esc(v)}" ${!f.verticals || f.verticals.has(v) ? "checked" : ""}>
            <span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</label>`).join("") || `<div class="faint" style="padding:6px 8px">No campaigns loaded</div>`}
        </div>
      </details>
    </label>
    ${sel("tier", "Tier", ALLOWED.tier)}
    ${sel("campaign_type", "Type", typeOpts)}
    ${sel("status", "Status", ALLOWED.status)}
    ${sel("owner", "Owner", ownerOpts)}
    <label>Moments
      <details class="ms ${tiersNow.join() !== "T1,T2," ? "active" : ""}" data-menu="moments" ${state.openMenu === "moments" ? "open" : ""}>
        <summary>${esc(mSummary)}</summary>
        <div class="ms-menu">
          ${MOMENT_TIERS.map(t => `<label><input type="checkbox" data-moment-tier="${t}" ${f.momentTiers.has(t) ? "checked" : ""}>
            ${t ? `<span class="chip prio">${t}</span>` : "No tier"} <span class="faint">${momentCounts[t]}</span></label>`).join("")}
        </div>
      </details>
    </label>
    <label title="Show seasonal moments for every vertical, not only those relevant to the selected verticals">
      <input type="checkbox" data-show-all-moments ${f.showAllMoments ? "checked" : ""}> Show all moments</label>
    <span class="filter-note">Showing ${shown} of ${rows.length}${filterParts().length ? ` · <button class="link" data-action="clear-filters">Clear filters</button>` : ""}</span>`;
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.filter) {
    state.filters[t.dataset.filter] = t.value;
    render();
  } else if (t.dataset.momentTier !== undefined) {
    t.checked ? state.filters.momentTiers.add(t.dataset.momentTier) : state.filters.momentTiers.delete(t.dataset.momentTier);
    render();
  } else if (t.dataset.showAllMoments !== undefined) {
    state.filters.showAllMoments = t.checked;
    render();
  } else if (t.dataset.vertical !== undefined) {
    const all = [...document.querySelectorAll("[data-vertical]")];
    const checked = all.filter(c => c.checked).map(c => c.dataset.vertical);
    state.filters.verticals = checked.length === all.length ? null : new Set(checked);
    render();
  }
});
document.addEventListener("toggle", e => {
  if (e.target.classList?.contains("ms")) {
    if (e.target.open) state.openMenu = e.target.dataset.menu;
    else if (state.openMenu === e.target.dataset.menu) state.openMenu = null;
  }
}, true);

/* ---------- Weekly view ---------- */

const TIER_ORDER = [MOMENT, BRAND, TACTICAL];
const TIER_PLURAL = { [MOMENT]: "Seasonal Moments", [BRAND]: "Brand Campaigns", [TACTICAL]: "Tactical Campaigns" };

function prioChip(r) {
  return r.priority ? `<span class="chip prio ${r._bad_priority ? "bad" : ""}" title="Priority">${esc(r.priority)}</span>` : "";
}
function statusChip(status) {
  const known = STATUS_LABELS.includes(status);
  return `<span class="chip st-${known ? status.toLowerCase() : "none"}">${esc(status || "No status")}</span>`;
}

function weekCard(r, ws, we, kind) {
  const p = r._parent ? state.data.byKey.get(r._parent) : null;
  let when;
  if (kind === "launching") {
    when = `Launches <b>${fmtDayShort(r._start)}</b>` +
      (r._end === r._start ? " · one day" : r._end <= we ? ` · ends ${fmtDayShort(r._end)}` : ` · runs to ${fmtDay(r._end)}`);
  } else if (kind === "ending") {
    when = `Ends <b>${fmtDayShort(r._end)}</b> · started ${fmtDay(r._start)}`;
  } else {
    when = `Since ${fmtDay(r._start)} · until <b>${fmtDay(r._end)}</b>`;
  }
  const facts = [
    `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>${esc(r.vertical || "No vertical")}`,
    r.campaign_type ? esc(r.campaign_type) : "",
    `Owner: ${r.owner ? `<b>${esc(r.owner)}</b>` : `<span class="faint">none</span>`}`,
  ].filter(Boolean).join(" · ");
  let parent = "";
  if (p) parent = `↳ Parent: ${esc(p.name || p.id)}`;
  else if (r.parent_id) parent = `↳ Parent: <span class="bad-value">${esc(r.parent_id)}</span> (not found)`;
  else if (r.tier !== MOMENT) parent = `↳ <span class="faint">No parent</span>`;
  return `<button class="wk-card" data-row="${esc(r._key)}" style="--c:${verticalColor(r.vertical)}">
    <div class="t"><span class="name">${r._issues.length ? `<span class="idot ${r._issues.some(i => i.severity === "error") ? "error" : "warning"}" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:${r._issues.some(i => i.severity === "error") ? "var(--error)" : "#e08a00"}"></span>` : ""}${esc(barName(r))}</span><span class="chips">${prioChip(r)}${statusChip(r.status)}</span></div>
    <div class="meta">${when}${r._tentative ? ` · <span class="tent">date tentative</span>` : ""}</div>
    <div class="meta">${facts}</div>
    <div class="meta">Channels: ${r._channels.length ? esc(r._channels.join(", ")) : `<span class="faint">none</span>`}</div>
    ${parent ? `<div class="parent">${parent}</div>` : ""}
  </button>`;
}

function weekSection(items, ws, we, kind) {
  let html = "";
  const tiers = [...TIER_ORDER, null];
  for (const tier of tiers) {
    const inTier = items.filter(r => tier ? r.tier === tier : !TIER_ORDER.includes(r.tier));
    if (!inTier.length) continue;
    html += `<div class="wk-tier">${tier ? TIER_PLURAL[tier] : "Unclassified (missing or invalid tier)"}</div>`;
    const verticals = uniqueSorted(inTier.map(r => r.vertical || "(no vertical)"), ALLOWED.vertical);
    for (const v of verticals) {
      const list = inTier.filter(r => (r.vertical || "(no vertical)") === v)
        .sort((a, b) => a._start - b._start || a._end - b._end || barName(a).localeCompare(barName(b)));
      if (tier !== MOMENT) html += `<div class="wk-vertical"><span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</div>`;
      html += list.map(r => weekCard(r, ws, we, kind)).join("");
    }
  }
  return html;
}

function renderWeek() {
  const ws = weekStart(state.cursor), we = ws + 6;
  const endDate = dayToDate(we);
  $("#weekTitle").textContent = `Week of ${fmtDayShort(ws)}`;
  $("#weekRange").textContent = `${fmtDayShort(ws)} – ${fmtDayShort(we)} ${endDate.getUTCFullYear()}`;
  $("#weekJump").value = dayToISO(state.cursor);

  const rows = state.data.rows.filter(passes);
  const dated = rows.filter(r => r._start !== null && r._end !== null);
  // Each initiative lands in exactly one section.
  const sections = [
    ["launching", "Launching this week", dated.filter(r => r._start >= ws && r._start <= we), "Nothing launching this week"],
    ["live", "Live this week", dated.filter(r => r._start < ws && r._end > we), "Nothing running through this week"],
    ["ending", "Ending this week", dated.filter(r => r._start < ws && r._end >= ws && r._end <= we), "Nothing ending this week"],
  ];
  $("#weekBody").innerHTML = sections.map(([kind, title, items, empty]) => `
    <div class="week-col">
      <h3>${title} <span class="muted">${items.length}</span></h3>
      ${items.length ? weekSection(items, ws, we, kind) : `<div class="wk-empty">${empty}</div>`}
    </div>`).join("");
  renderUndatedNote("#weekNote", rows);
}

function renderUndatedNote(sel, rows) {
  const undated = rows.filter(r => r._start === null || r._end === null);
  $(sel).innerHTML = undated.length
    ? `${undated.length} initiative${undated.length === 1 ? " isn't" : "s aren't"} shown because of missing or invalid dates:
       ${undated.map(r => `<button class="link" data-row="${esc(r._key)}">${esc(r.id || barName(r))}</button>`).join(", ")}. See Data issues.`
    : "";
}

/* ---------- Side panel ---------- */

function openPanel(key) { state.panelKey = key; renderPanel(); }
function closePanel() { state.panelKey = null; renderPanel(); }

function relCard(r) {
  const dates = r._start !== null && r._end !== null ? `${fmtDay(r._start)} – ${fmtDay(r._end)}` : "invalid dates";
  return `<button class="rel" data-row="${esc(r._key)}" style="--c:${verticalColor(r.vertical)}">
    <span class="grow"><strong>${esc(barName(r))}</strong>
      <div class="sub">${[r.tier, r.vertical, dates].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="sub faint">${esc(r._source)} · row ${r._sheetRow}</div></span>
    ${statusChip(r.status)}</button>`;
}

function renderPanel() {
  const root = $("#panelRoot");
  const r = state.panelKey && state.data ? state.data.byKey.get(state.panelKey) : null;
  if (!r) { root.innerHTML = ""; return; }
  const { byKey } = state.data;
  const p = r._parent ? byKey.get(r._parent) : null;
  const children = r._children.map(k => byKey.get(k)).sort((a, b) => (a._start ?? 1e9) - (b._start ?? 1e9) || barName(a).localeCompare(barName(b)));
  const bad = f => r[`_bad_${f}`];
  const val = (f, text = r[f]) => text ? (bad(f) ? `<span class="bad-value">${esc(text)}</span>` : esc(text)) : `<span class="faint">—</span>`;
  const days = r._start !== null && r._end !== null ? r._end - r._start + 1 : null;
  const textBlock = (label, f) => {
    const v = r[f];
    let body;
    if (!v) body = `<p class="text empty">Not filled in</p>`;
    else if (f === "top_highlights" && v.includes(";")) body = `<ul class="bullets">${v.split(";").map(s => s.trim()).filter(Boolean).map(s => `<li>${esc(s)}</li>`).join("")}</ul>`;
    else body = `<p class="text">${esc(v)}</p>`;
    return `<h4>${label}</h4>${body}`;
  };

  root.innerHTML = `
    <div class="panel-backdrop" data-action="close-panel"></div>
    <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div class="panel-head" style="--c:${verticalColor(r.vertical)}">
        <div class="top">
          <span class="chip tier">${esc(r.tier || "No tier")}</span>${prioChip(r)}${statusChip(r.status)}${r._tentative ? `<span class="chip tent">Date tentative</span>` : ""}
          <button class="close" data-action="close-panel" aria-label="Close">×</button>
        </div>
        <h2 id="panelTitle">${esc(barName(r))}</h2>
        <div class="muted"><span class="mono">${esc(r.id || "no id")}</span> · ${esc(r._source)}, row ${r._sheetRow}</div>
      </div>
      <div class="panel-body">
        <dl>
          <dt>Vertical</dt><dd>${r.vertical ? `<span class="vdot" style="background:${verticalColor(r.vertical)}"></span>` : ""}${val("vertical")}</dd>
          ${r.sub_vertical ? `<dt>Sub-vertical</dt><dd>${esc(r.sub_vertical)}</dd>` : ""}
          ${r.tier === MOMENT ? `<dt>Relevant to</dt><dd>${r._relevantAll && !r._relevant.size ? `<span class="ch">All verticals</span>` : ""}${[...r._relevant].map(v => `<span class="ch"><span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</span>`).join("")}${r._audiences.map(a => `<span class="ch info" title="Audience, not a campaign vertical">${esc(a)}</span>`).join("")}</dd>` : ""}
          <dt>${r.tier === MOMENT ? "Moment type" : "Campaign type"}</dt><dd>${val("campaign_type")}</dd>
          <dt>Priority</dt><dd>${val("priority")}</dd>
          <dt>Dates</dt><dd>${r._start !== null ? fmtDayShort(r._start) + " " + dayToDate(r._start).getUTCFullYear() : val("start_date")} – ${r._end !== null ? fmtDayShort(r._end) + " " + dayToDate(r._end).getUTCFullYear() : val("end_date")}${days ? ` <span class="muted">(${days} day${days === 1 ? "" : "s"})</span>` : ""}</dd>
          ${r.date_confidence || r.tier === MOMENT ? `<dt>Date confidence</dt><dd>${val("date_confidence")}${r._tentative ? ` <span class="chip tent">Date tentative</span>` : ""}</dd>` : ""}
          <dt>Owner</dt><dd>${val("owner")}</dd>
          <dt>Channels</dt><dd>${r._channels.length ? r._channels.map(c => `<span class="ch">${esc(c)}</span>`).join("") : `<span class="faint">—</span>`}</dd>
          <dt>Budget</dt><dd>${r._budget !== null ? `QAR ${r._budget.toLocaleString("en-US")}` : r.budget_qar ? `<span class="bad-value">${esc(r.budget_qar)}</span>` : `<span class="faint">—</span>`}</dd>
          <dt>Source</dt><dd>${esc(r._source)} · row ${r._sheetRow}</dd>
        </dl>
        ${r._start !== null && r._end !== null ? `<button data-action="locate" data-key="${esc(r._key)}">Show on month roadmap</button>` : ""}

        ${r._issues.length ? `<h4>Data issues (${r._issues.length})</h4>${r._issues.map(i => `<div class="issue"><span class="sev ${i.severity}">${i.severity === "error" ? "Error" : "Warning"}</span><span>${esc(i.message)}</span></div>`).join("")}` : ""}

        <h4>Parent</h4>
        ${p ? relCard(p) : r.parent_id ? `<p class="text"><span class="bad-value">${esc(r.parent_id)}</span> doesn't match any loaded id.</p>` : `<p class="text empty">${r.tier === MOMENT ? "Seasonal moments have no parent" : "No parent"}</p>`}

        <h4>Children (${children.length})</h4>
        ${children.length ? children.map(relCard).join("") : `<p class="text empty">No initiatives link to this one</p>`}

        ${textBlock("Objective", "objective")}
        ${textBlock("Brief", "brief")}
        ${textBlock("Target audience", "target_audience")}
        ${textBlock("Goal", "goal")}
        ${textBlock("KPIs", "kpis")}
        ${textBlock("Key message", "key_message")}
        ${textBlock("Top highlights", "top_highlights")}
        ${textBlock("Notes", "notes")}
      </div>
    </aside>`;
  root.querySelector(".close").focus({ preventScroll: true });
}

function locate(key) {
  const r = state.data.byKey.get(key);
  if (!r || r._start === null) return;
  state.panelKey = null;
  state.view = "month";
  const visibleStart = r._start;
  state.cursor = visibleStart;
  render();
  const bar = document.querySelector(`.bar[data-row="${CSS.escape(key)}"]`);
  if (bar) {
    bar.scrollIntoView({ block: "center", behavior: "smooth" });
    bar.classList.remove("pulse"); void bar.offsetWidth; bar.classList.add("pulse");
  }
}

/* ---------- Print ---------- */

const PAPER_WIDTH_MM = { A4: 297, A3: 420 };
const PRINT_MARGIN_MM = 10;

function applyPaperSize() {
  const size = $("#paperSize").value;
  let el = document.getElementById("pageSize");
  if (!el) { el = document.createElement("style"); el.id = "pageSize"; document.head.appendChild(el); }
  el.textContent = `@page { size: ${size} landscape; margin: ${PRINT_MARGIN_MM}mm; }`;
  try { localStorage.setItem("marketingTracker.paper", size); } catch { /* ignore */ }
}

function renderPrintHeader() {
  let title;
  if (state.view === "week") {
    const ws = weekStart(state.cursor);
    title = `Marketing plan · Week of ${fmtDayShort(ws)} ${dayToDate(ws).getUTCFullYear()}`;
  } else if (state.view === "month") {
    const [y, m] = cursorMonth();
    title = `Marketing plan · ${MONTHS_LONG[m]} ${y}`;
  } else title = "Marketing plan · All initiatives";
  const parts = filterParts();
  $("#printHeader").innerHTML = `
    <h1>${esc(title)}</h1>
    <div class="sub">${parts.length ? esc(parts.join(" · ")) + "<br>" : ""}
      Sources: ${esc(state.data.sources.map(s => s.label).join(", "))}<br>
      Printed ${fmtDay(todayDay())}</div>`;
}

window.addEventListener("beforeprint", () => {
  // Re-pack bars for the paper width so labels beside bars don't collide.
  const mm = PAPER_WIDTH_MM[$("#paperSize").value] - 2 * PRINT_MARGIN_MM;
  state.printWidth = Math.floor(mm / 25.4 * 96);
  if (state.view === "month" && state.data?.rows.length) renderMonth();
});
window.addEventListener("afterprint", () => {
  state.printWidth = null;
  if (state.view === "month" && state.data?.rows.length) renderMonth();
});

/* ---------- Events ---------- */

document.addEventListener("click", e => {
  if (state.openMenu && !e.target.closest(".ms")) { state.openMenu = null; renderFilters(); }
  const t = e.target.closest("[data-action],[data-view],[data-toggle],[data-sev],[data-row],[data-nav],[data-group]");
  if (!t) return;
  if (t.dataset.action === "pick") $("#filePicker").click();
  else if (t.dataset.action === "clear") clearData();
  else if (t.dataset.action === "reload") loadUrls();
  else if (t.dataset.action === "today") { state.cursor = todayDay(); render(); }
  else if (t.dataset.action === "close-panel") closePanel();
  else if (t.dataset.action === "locate") locate(t.dataset.key);
  else if (t.dataset.action === "print") { if (state.view === "data") { state.view = "month"; render(); } window.print(); }
  else if (t.dataset.action === "clear-filters") { state.filters = defaultFilters(); render(); }
  else if (t.dataset.action === "all-verticals") { state.filters.verticals = null; render(); }
  else if (t.dataset.nav) { step(+t.dataset.nav); }
  else if (t.dataset.group) {
    const k = t.dataset.group;
    state.collapsed.has(k) ? state.collapsed.delete(k) : state.collapsed.add(k);
    render();
  }
  else if (t.dataset.view) { state.view = t.dataset.view; render(); }
  else if (t.dataset.toggle) $(`#${t.dataset.toggle}`).classList.toggle("collapsed");
  else if (t.dataset.sev) { state.issueFilter = t.dataset.sev; renderIssues(); }
  else if (t.dataset.row) openPanel(t.dataset.row);
});
$("#filePicker").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });

function step(dir) {
  if (state.view === "week") state.cursor += 7 * dir;
  else { const [y, m] = cursorMonth(); state.cursor = dayFromYMD(y, m + dir, 1); }
  render();
}
$("#weekJump").addEventListener("change", e => {
  const d = parseISODate(e.target.value || "");
  if (d !== null) { state.cursor = d; render(); }
});
$("#paperSize").addEventListener("change", applyPaperSize);
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.panelKey) closePanel(); });
$("#monthJump").addEventListener("change", e => {
  const [y, m] = (e.target.value || "").split("-").map(Number);
  if (y && m) { state.cursor = dayFromYMD(y, m - 1, 1); render(); }
});
document.addEventListener("keydown", e => {
  const g = e.target.closest?.("[data-group]");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); g.click(); }
});
// Hovering a seasonal moment highlights its band behind the campaigns
document.addEventListener("mouseover", e => {
  const m = e.target.closest?.("[data-moment]");
  document.querySelectorAll(".band.hl").forEach(b => b.classList.remove("hl"));
  if (m) document.querySelector(`.band[data-band="${CSS.escape(m.dataset.moment)}"]`)?.classList.add("hl");
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (state.view === "month" && state.data?.rows.length) renderMonth(); }, 120);
});

let dragDepth = 0;
document.addEventListener("dragenter", e => { if (e.dataTransfer?.types.includes("Files")) { dragDepth++; document.body.classList.add("dragging"); } });
document.addEventListener("dragleave", () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove("dragging"); });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging");
  if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
});

/* ---------- Start ---------- */

try { const paper = localStorage.getItem("marketingTracker.paper"); if (paper) $("#paperSize").value = paper; } catch { /* ignore */ }
applyPaperSize();

if (CONFIG.mode === "urls") {
  render();
  loadUrls();
} else {
  const saved = storageGet();
  if (Array.isArray(saved)) state.sources = saved.map(s => ({ ...s, origin: "file" }));
  rebuild();
}
</script>
</body>
</html>
