        p.forecast = vals.forecast; p.bear = vals.bear ?? null; p.bull = vals.bull ?? null;
        p.rows.forecast = { sourceIdx: src._idx, sheetRow };
      }
      if (vals.actual != null) {
        if (p.actual != null && p.rows.actual?.sourceIdx !== src._idx) p.actualOverridden = { was: p.actual, from: p.rows.actual };
        p.actual = vals.actual;
        p.rows.actual = { sourceIdx: src._idx, sheetRow };
      }
      if (!p.rows.forecast) p.rows.forecast = { sourceIdx: src._idx, sheetRow };
      series.set(day, p);
      checkRange(src, vals, kpi, day, sheetRow, vertical);
    }
    summary.vertical = [...summary.verticalsSeen].join(", ");
    // Gaps only matter for files that carry forecasts, not for actuals-only overrides.
    const hasForecasts = records.slice(1).some(c => (c[col.forecast] || "").trim());
    if (hasForecasts) for (const [vk, m] of daysByKey) flagGaps(src, [...m.keys()], d => m.get(d), vk.split("|")[0]);
  }

  /* ---- Past days with no actual (after merging) ---- */
  for (const v of verticals.values()) {
    const byDay = new Map();   // day -> { kpis: [], row }
    for (const kpi of baseKpis) {
      for (const [day, p] of v.series.get(kpi) || []) {
        if (day >= today || p.forecast == null || p.actual != null) continue;
        if (!byDay.has(day)) byDay.set(day, { kpis: [], row: p.rows.forecast });
        byDay.get(day).kpis.push(kpi);
      }
    }
    for (const [day, { kpis, row }] of [...byDay].sort((a, b) => a[0] - b[0])) {
      const src = sources.find(s => s._idx === row?.sourceIdx) || sources[0];
      add({ severity: "warning", code: "kpi_missing_actual", src, day, sheetRow: row?.sheetRow ?? null, id: v.name,
        message: `${v.name}: no actual for ${kpis.map(k => defs[k]?.label || k).join(" and ")} on ${fmtDayShort(day)} ${dayParts(day)[0]}.`, values: [v.name, ...kpis] });
    }
  }

  return { verticals, defs, issues, summaries, today };
}

/* ---------- KPI calculations ---------- */

const ratio = (a, b) => (a != null && b != null && b !== 0 ? a / b : null);

// One day's forecast/bear/bull/actual for a KPI. Derived KPIs (AOV) are
// recalculated from their parts; they have no bear/bull of their own.
function kpiPoint(kpi, vertical, key, day) {
  const def = kpi.defs[key];
  const v = kpi.verticals.get(vertical);
  if (!def || !v) return null;
  if (def.derived) {
    const [n, d] = def.derived;
    const pn = kpiPoint(kpi, vertical, n, day), pd = kpiPoint(kpi, vertical, d, day);
    if (!pn || !pd) return null;
    return { forecast: ratio(pn.forecast, pd.forecast), bear: null, bull: null,
      actual: pn.actual != null && pd.actual != null ? ratio(pn.actual, pd.actual) : null,
      rows: pn.rows, derived: true };
  }
  return v.series.get(key)?.get(day) || null;
}

/**
 * Status of an actual against its forecast.
 *   scenarios: green >= forecast; amber < forecast but >= bear; red < bear; over = above bull
 *   threshold: green >= forecast; amber up to t% below; red more than t% below; over = more than t% above
 * Scenario mode needs bear and bull; without them the threshold is used.
 * Returns { status: "over"|"green"|"amber"|"red"|"no_actual"|"none", delta, deltaPct, vsBear, vsBull, basis }.
 */
function kpiStatus(point, def, mode = "scenarios", thresholdPct = 5) {
  if (!point || point.forecast == null) return { status: "none" };
  const { forecast, bear, bull, actual } = point;
  if (actual == null) return { status: "no_actual" };
  const sign = def?.direction === "lower_is_better" ? -1 : 1;
  const delta = actual - forecast;
  const deltaPct = forecast ? delta / forecast : null;
  const useScenarios = mode === "scenarios" && bear != null && bull != null;
  let status, over;
  if (useScenarios) {
    over = sign * (actual - bull) > 0;
    status = sign * (actual - forecast) >= 0 ? "green" : sign * (actual - bear) >= 0 ? "amber" : "red";
  } else {
    const t = thresholdPct / 100, rel = sign * (deltaPct ?? 0);
    over = rel > t;
    status = rel >= 0 ? "green" : rel >= -t ? "amber" : "red";
  }
  return { status: over ? "over" : status, delta, deltaPct, vsBear: ratio(actual, bear), vsBull: ratio(actual, bull), basis: useScenarios ? "scenarios" : "threshold" };
}

function kpiStatusMode(kpi, vertical, options) {
  return kpi.verticals.get(vertical)?.statusMode || options?.mode || "scenarios";
}

/**
 * Totals over a range of days, e.g. month-to-date or a week.
 * Days without an actual are never counted as zero: actual, forecast, bear and
 * bull are summed over the days that have an actual; the forecast for the
 * other days is the "remaining" forecast used for the month-end projection.
 *   projected = actual + remaining forecast × attainment
 * Derived KPIs are recalculated from their summed parts.
 */
function kpiPeriod(kpi, vertical, key, fromDay, toDay) {
  const def = kpi.defs[key];
  if (!def || !kpi.verticals.get(vertical)) return null;
  if (def.derived) {
    const [n, d] = def.derived;
    const a = kpiPeriod(kpi, vertical, n, fromDay, toDay), b = kpiPeriod(kpi, vertical, d, fromDay, toDay);
    if (!a || !b) return null;
    return {
      derived: true, daysWithActual: a.daysWithActual, days: a.days,
      actual: ratio(a.actual, b.actual), forecast: ratio(a.forecast, b.forecast), bear: null, bull: null,
      forecastAll: ratio(a.forecastAll, b.forecastAll), projected: ratio(a.projected, b.projected),
      attainment: ratio(ratio(a.actual, b.actual), ratio(a.forecast, b.forecast)), vsBear: null,
      projectedAttainment: ratio(ratio(a.projected, b.projected), ratio(a.forecastAll, b.forecastAll)),
    };
  }
  let A = 0, F = 0, B = 0, U = 0, R = 0, all = 0, n = 0, days = 0, bearOk = true, bullOk = true;
  for (let day = fromDay; day <= toDay; day++) {
    const p = kpiPoint(kpi, vertical, key, day);
    if (!p || p.forecast == null) continue;
    days++;
    all += p.forecast;
    if (p.actual != null) {
      n++; A += p.actual; F += p.forecast;
      if (p.bear == null) bearOk = false; else B += p.bear;
      if (p.bull == null) bullOk = false; else U += p.bull;
    } else R += p.forecast;
  }
  if (!days) return null;
  const has = n > 0;
  const attainment = has ? ratio(A, F) : null;
  const projected = has ? A + R * attainment : null;
  return {
    daysWithActual: n, days,
    actual: has ? A : null, forecast: has ? F : null,
    bear: has && bearOk ? B : null, bull: has && bullOk ? U : null,
    forecastAll: all, remainingForecast: R, attainment,
    vsBear: has && bearOk ? ratio(A, B) : null,
    projected, projectedAttainment: projected != null ? ratio(projected, all) : null,
  };
}

// Latest day with any actual for a vertical.
function kpiLatestActual(kpi, vertical) {
  const v = kpi.verticals.get(vertical);
  if (!v) return null;
  let latest = null;
  for (const series of v.series.values()) for (const [day, p] of series) if (p.actual != null && (latest === null || day > latest)) latest = day;
  return latest;
}

/* ---------- Number formatting ---------- */

function fmtNum(n, decimals = 0) {
  if (n == null || Number.isNaN(n)) return "—";
  return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtPct(x, signed = false) {
  if (x == null || Number.isNaN(x)) return "—";
  const v = (x * 100).toFixed(1);
  return `${signed && x > 0 ? "+" : ""}${v}%`;
}
// Value in a KPI's unit: QAR without decimals, counts with separators.
function fmtKpi(value, def, signed = false) {
  if (value == null || Number.isNaN(value)) return "—";
  const s = `${signed && value > 0 ? "+" : ""}${fmtNum(Math.round(value))}`;
  return def?.unit === "QAR" ? `QAR ${s}` : s;
}
// Short form for narrow cells: 104k, 10.1M, 97. mDecimals: decimals for millions.
function fmtCompact(value, mDecimals = 1) {
  if (value == null || Number.isNaN(value)) return "—";
  const a = Math.abs(value);
  if (a >= 1e6) return `${(value / 1e6).toFixed(a >= 1e8 ? 1 : mDecimals)}M`;
  if (a >= 1e4) return `${Math.round(value / 1e3)}k`;
  if (a >= 1e3) return `${(value / 1e3).toFixed(1)}k`;
  return fmtNum(value);
}

/* ---------- Sources from the config ---------- */

const normName = s => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
// "S Laundry" -> "SLaundry": tab names match verticals ignoring spaces and case.
function canonicalVertical(name) { return ALLOWED.vertical.find(v => normName(v) === normName(name)) || null; }
// "*L1*Total*.csv" -> regex; case-insensitive, * = anything.
function globToRegex(glob) {
  return new RegExp(`^${glob.split("*").map(p => p.replace(/[.+?^${}()|[\]\\]/g, "\\$&")).join(".*")}$`, "i");
}

// { label, type, sheetUrl } + the spreadsheet's publishedId -> everything else:
//   editUrl  https://docs.google.com/spreadsheets/d/<sheet id>/edit
//   gid      the tab id from sheetUrl
//   url      https://docs.google.com/spreadsheets/d/e/<publishedId>/pub?gid=<gid>&single=true&output=csv
//   tabVertical  campaign tabs: the vertical named after the tab
// Advanced overrides (url, editUrl, gid, file, vertical, statusMode) still win when given.
const SHEETS_BASE = "https://docs.google.com/spreadsheets";
function resolveConfigSource(c, publishedId) {
  const sheetUrl = c.sheetUrl || "";
  const sheetId = (/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/.exec(sheetUrl) || [])[1];
  const gid = c.gid ?? (/[?#&]gid=(\d+)/.exec(sheetUrl) || [])[1];
  return {
    label: c.label,
    type: c.type,
    gid,
    // Plain string joins, not `template literals`: Apps Script strips "//" comments
    // when serving the page and mistakes a "//" inside a template literal for one.
    editUrl: c.editUrl || (sheetId ? SHEETS_BASE + "/d/" + sheetId + "/edit" : undefined),
    url: c.url || (publishedId && gid != null ? SHEETS_BASE + "/d/e/" + publishedId + "/pub?gid=" + gid + "&single=true&output=csv" : undefined),
    file: c.file,
    tabVertical: c.type === "campaigns" ? canonicalVertical(c.vertical || c.label) || c.vertical || c.label : undefined,
    vertical: c.type === "kpi_engine" || c.type === "kpi" ? c.vertical : undefined,
    statusMode: c.statusMode,
  };
}

// The config entry for a loaded source. URL sources match by url. Dropped files
// match a `file` pattern if one is set, otherwise the tab name in the file name:
// Google names a downloaded tab "<spreadsheet> - <tab>.csv", so "… - S Market.csv"
// and "s_market.csv" both match "S Market". The longest matching name wins.
function configForSource(src, resolved) {
  if (src.origin === "url") return resolved.find(c => c.url && c.url === src.url) || null;
  if (src.origin === "appsScript") return resolved.find(c => c.label === src.label) || null;
  const base = src.label.replace(/\.csv$/i, "");
  const name = normName(base.includes(" - ") ? base.split(" - ").pop() : base);
  const hits = resolved.filter(c => (c.file ? globToRegex(c.file).test(src.label) : normName(c.label) && name.includes(normName(c.label))));
  return hits.sort((a, b) => normName(b.label).length - normName(a.label).length)[0] || null;
}
function applySourceConfig(src, resolved) {
  const c = configForSource(src, resolved);
  if (!c) return src;
  return {
    ...src,
    type: c.type,
    kind: c.type === "moments" ? "moments" : c.type === "campaigns" ? "vertical" : src.kind,
    tabVertical: c.tabVertical,
    vertical: c.vertical ?? src.vertical,
    statusMode: c.statusMode ?? src.statusMode,
  };
}

// Why a published-CSV response can't be used, or null if it can.
// A restricted "Publish to web" link answers 401/403 or a Google sign-in page.
const SIGN_IN_PROBLEM = "Google asked for a sign-in instead of returning the CSV. Publishing is restricted to signed-in people in your organisation, which the tracker can't use. Remove that restriction in File > Share > Publish to web (or ask your Workspace admin), or download the tabs as CSV and drop them on the page";
function publishedCsvProblem(status, text) {
  const isHtml = /^\s*<(!doctype|html)/i.test(text || "");
  if (status === 401 || status === 403 || (isHtml && /sign in to access this content|accounts\.google\.com\/ServiceLogin/i.test(text))) return SIGN_IN_PROBLEM;
  if (status >= 400) return `HTTP ${status} from Google Sheets`;
  if (isHtml) return "got a web page instead of CSV. Use the 'Publish to web' CSV link";
  return null;
}

/* ---------- Everything together ---------- */

// Read a source's CSV once and decide what it is. Config type wins; otherwise
// the contents decide (engine title/header, long KPI header, else plan rows).
function classifySource(src) {
  // A source that failed to load is reported by the plan step ("Could not load").
  if (src.loadError) return { ...src, _fileType: "plan", _records: [] };
  // Apps Script hands over the tab's display values as a 2D array: same pipeline, no CSV step.
  const { records, unterminated } = src.records
    ? { records: src.records.map(row => row.map(v => (v == null ? "" : String(v)))), unterminated: false }
    : parseCSV(src.text || "");
  let fileType = detectFileType(records);
  if (src.type === "moments" || src.type === "campaigns") fileType = "plan";
  else if (src.type === "kpi_engine") fileType = "kpi_engine";
  else if (src.type === "kpi" && fileType === "plan") fileType = "kpi_unknown";
  return { ...src, _records: records, _unterminated: unterminated, _fileType: fileType };
}

// Which KPI series a file feeds, so a fresh export can replace the old one
// even when its file name differs. Returns null for non-engine files.
function kpiIdentity(src) {
  const c = classifySource(src);
  return c._fileType === "kpi_engine" ? { vertical: engineVertical(src, c._records) || `layer-${engineLayer(c._records)}` } : null;
}

/**
 * Everything loaded, merged and checked.
 * sources: [{ label, text, origin, type?, kind?, vertical?, statusMode?, loadError? }] in load order.
 * options: { informationalAudiences, kpiDefinitions, kpiStatus, today }
 * Returns { rows, byKey, byId, kpi, issues, sources } where sources are per-file summaries.
 */
function buildDataset(sources, options = {}) {
  const indexed = sources.map((s, i) => classifySource({ ...s, _idx: i }));
  const planSources = indexed.filter(s => s._fileType === "plan");
  const kpiSources = indexed.filter(s => s._fileType === "kpi_engine" || s._fileType === "kpi_long");
  const plan = buildPlan(planSources, options);
  const kpi = buildKpi(kpiSources, options);
  const summaries = [...plan.summaries, ...kpi.summaries];
  const issues = [...plan.issues, ...kpi.issues];
  for (const s of indexed.filter(s => s._fileType === "kpi_unknown")) {
    summaries.push({ label: s.label, origin: s.origin, sourceIdx: s._idx, kind: "kpi_unknown", rowCount: 0, blankRows: 0 });
    issues.push(makeIssue({ severity: "error", code: "kpi_not_kpi_file", src: s, sheetRow: 1,
      message: "Configured as a KPI source, but it's neither a forecasting engine export (title row + Date/Day/Bear header) nor a long-format file (date, vertical, kpi, forecast, actual)." }));
  }
  for (const s of summaries) { s.errors = 0; s.warnings = 0; }
  for (const i of issues) {
    const s = summaries.find(x => x.sourceIdx === i.sourceIdx);
    if (s) s[i.severity === "error" ? "errors" : "warnings"]++;
  }
  // File-level first, then by source order and row
  issues.sort((a, b) => (a.sourceIdx - b.sourceIdx) || ((a.sheetRow ?? 0) - (b.sheetRow ?? 0)) || (a.severity === b.severity ? 0 : a.severity === "error" ? -1 : 1));
  summaries.sort((a, b) => a.sourceIdx - b.sourceIdx);
  return { rows: plan.rows, byKey: plan.byKey, byId: plan.byId, kpi, issues, sources: summaries };
}

/* CORE:END */

</script>

<script>
/* ================= UI ================= */

// Inside the Apps Script web app, google.script.run reads the tabs server-side.
const IN_APPS_SCRIPT = typeof google !== "undefined" && !!(google.script && google.script.run);
const MODE = IN_APPS_SCRIPT ? "appsScript" : CONFIG.mode === "appsScript" ? "local" : CONFIG.mode;
// Storage can be blocked (e.g. in the Apps Script iframe). Everything that uses it must cope.
const STORAGE_OK = (() => { try { const k = "marketingTracker.probe"; localStorage.setItem(k, k); localStorage.removeItem(k); return true; } catch { return false; } })();

const STORAGE_KEY = "marketingTracker.localSources.v1";
const VERTICAL_VAR = {
  "S Market": "--v-smk", "Restaurants": "--v-rst", "Snoomart": "--v-snm", "Grocery": "--v-grc",
  "SLaundry": "--v-sld", "Services": "--v-srv", "New Ventures": "--v-nvt", "Cross-vertical": "--v-cvt",
};
const verticalColor = v => `var(${VERTICAL_VAR[v] || "--v-unknown"})`;

const MOMENT_TIERS = ["T1", "T2", "T3", ""];   // "" = no tier
function defaultFilters() {
  return {
    verticals: null,                          // null = all, else Set
    tier: "", campaign_type: "", status: "", owner: "",
    momentTiers: new Set(["T1", "T2", ""]),   // T3 hidden by default
    showAllMoments: false,                    // ignore the vertical filter for moments
  };
}

const state = {
  sources: [],          // [{ label, text, origin, kind?, loadError? }]
  data: null,           // result of buildDataset
  view: "month",
  issueFilter: "all",
  cursor: todayDay(),   // day number; the month/week shown is the one containing it
  collapsed: new Set(), // "lane|vertical" keys of collapsed vertical groups
  filters: defaultFilters(),
  openMenu: null,       // which filter dropdown is open: "vertical" | "moments" | null
  visibleKeys: new Set(), // rows passing the filters, recomputed on every render
  panelKey: null,       // row shown in the side panel
  printWidth: null,     // px width of the printable area while printing
  kpiShow: new Set(Object.keys(CONFIG.kpiDefinitions)),   // KPI rows shown in the month strip
  tint: false,          // tint month days by orders status
  panelDay: null,       // day shown in the side panel (day number)
  panelBackDay: null,   // day panel to return to from an initiative opened there
  dismissals: loadDismissals(),   // fingerprint -> { note, at, ... }
  dismissForm: null,    // { anchor, fingerprints } while the dismiss note form is open
  dismissedOpen: false,
  handles: new Map(),   // file name -> FileSystemFileHandle (Chrome/Edge)
};

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------- Loading ---------- */

function storageGet() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch { return null; }
}
function storageSet(v) {
  try { v ? localStorage.setItem(STORAGE_KEY, JSON.stringify(v)) : localStorage.removeItem(STORAGE_KEY); } catch { /* storage unavailable */ }
}

async function addFiles(fileList, handles = new Map()) {
  for (const f of [...fileList].filter(f => /\.json$/i.test(f.name))) await importDismissals(f);
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === "text/csv");
  if (!files.length) return;
  for (const f of files) {
    const h = handles.get(f.name);
    if (h) { state.handles.set(f.name, h); handleStore.put(f.name, h); }
  }
  const loaded = await Promise.all(files.map(f => f.text().then(
    text => ({ label: f.name, text, origin: "file" }),
    err => ({ label: f.name, text: "", origin: "file", loadError: String(err) }),
  )));
  // A file with the same name replaces the earlier one, so re-dropping an updated export just works.
  // A KPI engine export also replaces the previous export for the same vertical, whatever its name.
  for (const s of loaded) {
    const id = s.loadError ? null : kpiIdentity(withConfig(s));
    if (id) state.sources = state.sources.filter(x => x.label === s.label || x.origin !== "file" || kpiIdentity(withConfig(x))?.vertical !== id.vertical);
    const i = state.sources.findIndex(x => x.label === s.label);
    if (i >= 0) state.sources[i] = s; else state.sources.push(s);
  }
  if (MODE === "local") storageSet(state.sources.filter(s => s.origin === "file" && !s.loadError).map(({ label, text }) => ({ label, text })));
  rebuild();
}

async function loadUrls() {
  state.loading = true;
  render();
  const fetched = await Promise.all(configuredSources().filter(s => s.url).map(fetchUrlSource));
  state.loading = false;
  // Keep any files dropped on top of the URL sources
  state.sources = [...fetched, ...state.sources.filter(s => s.origin === "file")];
  rebuild();
}

function clearData() {
  state.sources = state.sources.filter(s => s.origin === "url");
  storageSet(null);
  state.handles = new Map();
  handleStore.clear();
  rebuild();
}

/* ---------- Config matching ---------- */

// CONFIG.sources resolved into urls, edit links and verticals (see resolveConfigSource).
// In the Apps Script web app the edit link and each tab's gid come from the spreadsheet itself.
const configuredSources = () => CONFIG.sources.map(c => {
  const r = resolveConfigSource(c, CONFIG.publishedId);
  const info = state.sheetInfo;
  if (info) {
    r.editUrl = (/^(.*?\/edit)/.exec(info.url) || [])[1] || info.url.replace(/[?#].*$/, "");
    const tab = info.tabs.find(t => normName(t.name) === normName(c.label));
    if (tab) r.gid = String(tab.gid);
  }
  return r;
});
const configFor = src => configForSource(src, configuredSources());
// Source as handed to the core: type, vertical and status mode from its config entry.
const withConfig = src => applySourceConfig(src, configuredSources());
const coreOptions = () => ({
  informationalAudiences: CONFIG.informationalAudiences,
  kpiDefinitions: CONFIG.kpiDefinitions,
  kpiStatus: CONFIG.kpiStatus,
  today: todayDay(),
});

function rebuild() {
  state.data = buildDataset(state.sources.map(withConfig), coreOptions());
  render();
}

/* ---------- Rendering ---------- */

function render() {
  renderLoaderBar();
  const has = state.sources.length > 0;
  const allFailed = has && state.sources.every(s => s.loadError);
  $("#emptyState").classList.toggle("hidden", has && !allFailed);
  $("#emptyState").innerHTML = state.loading && !has
    ? `<h2>Loading the marketing plan…</h2><p>Reading ${MODE === "appsScript" ? CONFIG.sources.length : configuredSources().filter(c => c.url).length} tabs from Google Sheets.</p>`
    : allFailed
    ? `<h2>Couldn't load the Google Sheets</h2><p>${esc(state.sources[0].loadError.replace(/^./, c => c.toUpperCase()))}.</p>
       <p>${state.sources[0].loadError === SIGN_IN_PROBLEM ? "Once the links are public, click Reload data." : MODE === "appsScript" ? "Click Reload data to try again, or drop CSV exports of the tabs here instead." : "Check your connection and click Reload data, or drop CSV exports of the tabs here instead."}</p>
       <button data-action="reload">Reload data</button> <button class="primary" data-action="pick">Choose CSV files</button>`
    : `<h2>Load your marketing plan</h2><p>Drop the CSV exports here: the Seasonal Moments tab, one tab per vertical, and the KPI forecast.</p>
       <button class="primary" data-action="pick">Choose CSV files</button>`;
  $("#sourcesCard").classList.toggle("hidden", !has);
  $("#issuesCard").classList.toggle("hidden", !has);
  $("#filtersCard").classList.toggle("hidden", !has);
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
  if (!has) return;
  computeVisible();
  renderSources();
  renderIssues();
  renderFilters();
  renderActualsThrough();
  renderPrintHeader();
  const viewEl = { month: "#viewMonth", week: "#viewWeek", data: "#viewData" }[state.view];
  $(viewEl).classList.remove("hidden");
  if (state.view === "data") renderData();
  else if (state.view === "month") renderMonth();
  else if (state.view === "week") renderWeek();
  renderPanel();
}

/* ---------- Monthly roadmap ---------- */

const LANES = [
  { tier: MOMENT, title: "Seasonal Moments", empty: "No seasonal moments this month" },
  { tier: BRAND, title: "Brand Campaigns", empty: "No brand campaigns this month" },
  { tier: TACTICAL, title: "Tactical Campaigns", empty: "No tactical campaigns this month" },
];
const STATUS_LABELS = ["Idea", "Planning", "Live", "Complete", "Paused"];

function cursorMonth() { const d = dayToDate(state.cursor); return [d.getUTCFullYear(), d.getUTCMonth()]; }

let measureCtx = null;
function textWidth(s) {
  if (!measureCtx) {
    measureCtx = document.createElement("canvas").getContext("2d");
    measureCtx.font = `600 12px ${getComputedStyle(document.body).fontFamily}`;
  }
  return measureCtx.measureText(s).width;
}

const barName = r => r.name || r.id || "(no name)";

// Greedy row packing. Each bar claims its own span plus its label when the
// label doesn't fit inside and has to sit beside the bar.
// rank (optional) packs lower-ranked items first, so they take the top rows.
function packBars(items, mStart, mEnd, pxPerDay, trackPx, rank = () => 0) {
  const sorted = [...items].sort((a, b) => rank(a) - rank(b) || a._start - b._start || b._end - a._end || barName(a).localeCompare(barName(b)));
  const rowEnds = [], rows = [];
  for (const r of sorted) {
    const s = Math.max(r._start, mStart), e = Math.min(r._end, mEnd);
    const x0 = (s - mStart) * pxPerDay, x1 = (e - mStart + 1) * pxPerDay;
    const clipPad = (r._start < mStart ? 16 : 0) + (r._end > mEnd ? 16 : 0);
    const labelW = textWidth(barName(r)) + 16 + clipPad + (r._issues.length ? 12 : 0);
    let pos = "in", ext0 = x0, ext1 = x1;
    if (labelW > x1 - x0) {
      const outW = labelW - clipPad;
      if (x1 + 5 + outW <= trackPx) { pos = "right"; ext1 = x1 + 5 + outW; }
      else if (x0 - 5 - outW >= 0) { pos = "left"; ext0 = x0 - 5 - outW; }
    }
    let i = rowEnds.findIndex(end => end + 6 <= ext0);
    if (i < 0) { i = rowEnds.length; rowEnds.push(0); rows.push([]); }
    rowEnds[i] = ext1;
    rows[i].push({ r, s, e, pos });
  }
  return rows;
}

const pct = (d, mStart, n) => `${((d - mStart) / n) * 100}%`;

function barTitle(r) {
  const p = r._parent ? state.data.byKey.get(r._parent) : null;
  return [
    barName(r),
    `${fmtDay(r._start)} – ${fmtDay(r._end)}`,
    [r.vertical, r.campaign_type, r.priority, r.status].filter(Boolean).join(" · "),
    r._tentative ? `Date tentative (${r.date_confidence})` : "",
    p ? `Parent: ${p.name || p.id}` : "",
    r._issues.length ? `${r._issues.length} data issue${r._issues.length > 1 ? "s" : ""}` : "",
  ].filter(Boolean).join("\n");
}

function barHTML(b, mStart, n) {
  const { r } = b;
  const cls = [
    "bar",
    `st-${STATUS_LABELS.includes(r.status) ? r.status.toLowerCase() : "none"}`,
    r._start < b.s ? "clip-l" : "",
    r._end > b.e ? "clip-r" : "",
    b.pos !== "in" ? `lbl-${b.pos}` : "",
    r._tentative ? "tentative" : "",
  ].filter(Boolean).join(" ");
  const width = ((b.e - b.s + 1) / n) * 100;
  return `<button class="${cls}" data-row="${esc(r._key)}" ${r.tier === MOMENT ? `data-moment="${esc(r._key)}"` : ""}
    style="left:${pct(b.s, mStart, n)};width:${width}%;--c:${verticalColor(r.vertical)}" title="${esc(barTitle(r))}">
    <span class="bar-label">${issueDot(r)}${esc(barName(r))}</span></button>`;
}

function renderMonth() {
  const [y, m] = cursorMonth();
  const mStart = dayFromYMD(y, m, 1), mEnd = dayFromYMD(y, m + 1, 1) - 1, n = mEnd - mStart + 1;
  const today = todayDay();
  $("#monthTitle").textContent = `${MONTHS_LONG[m]} ${y}`;
  $("#monthJump").value = `${y}-${String(m + 1).padStart(2, "0")}`;

  const allRows = state.data.rows;
  const rows = allRows.filter(passes);
  const dated = rows.filter(r => r._start !== null && r._end !== null);
  const undated = rows.filter(r => r._start === null || r._end === null);
  const inMonth = dated.filter(r => r._start <= mEnd && r._end >= mStart);
  $("#monthCount").textContent = `${inMonth.length} initiative${inMonth.length === 1 ? "" : "s"} this month`;

  // Legend: verticals present in the data, then status styles, then KPI colours
  const verticals = ALLOWED.vertical.filter(v => allRows.some(r => r.vertical === v));
  const kpiKey = kpiContext() ? `<span class="sep"></span><span class="group"><span class="group-title">KPI</span>
    <span class="item"><span class="sw s-green-cell"></span>At/above forecast</span>
    <span class="item"><span class="sw s-amber-cell"></span>Below forecast, above bear</span>
    <span class="item"><span class="sw s-red-cell"></span>Below bear</span>
    <span class="item"><span class="sw s-over-cell"></span>Above bull</span>
    <span class="item"><span class="sw" style="box-shadow:inset 0 0 0 1px var(--border-strong)"></span>No actual yet</span></span>` : "";
  $("#monthLegend").innerHTML = `
    <span class="group"><span class="group-title">Vertical</span>${verticals.map(v =>
      `<span class="item"><span class="sw" style="background:${verticalColor(v)}"></span>${esc(v)}</span>`).join("")}</span>
    <span class="sep"></span>
    <span class="group"><span class="group-title">Status</span>${STATUS_LABELS.map(s =>
      `<span class="item"><span class="sw-bar bar st-${s.toLowerCase()}" style="position:relative;top:0;height:12px;--c:var(--v-smk);padding:0"></span>${s}</span>`).join("")}</span>
    <span class="sep"></span>
    <span class="group"><span class="item"><span class="sw" style="background:rgba(71,85,105,.2);border:1px solid rgba(71,85,105,.6)"></span>T1 moment period</span>
    <span class="item"><span class="sw" style="background:rgba(71,85,105,.08);border:1px dashed rgba(71,85,105,.45)"></span>T2/T3 moment period</span>
    <span class="item"><span class="sw-bar" style="background:#eef0f3;border:1.5px dashed var(--v-cvt)"></span>Date tentative</span>
    <span class="item">◀ ▶ Continues past the month</span></span>${kpiKey}`;

  // KPI strip: shown when a KPI source is loaded and at least one KPI is ticked
  const kctx = kpiContext();
  const showStrip = !!kctx && shownKpis(kctx).length > 0;
  renderKpiToggles(kctx);

  // Pixel geometry, used only to decide label placement and row packing
  const tl = $("#timeline");
  tl.classList.toggle("has-kpi", showStrip);
  const labelW = state.printWidth ? 150 : 210;   // matches --label-w on screen and in print
  const mtdW = showStrip ? (state.printWidth ? 150 : 172) : 0;   // matches --mtd-w
  const trackPx = (state.printWidth || Math.max(980, tl.parentElement.clientWidth)) - labelW - mtdW;
  const pxPerDay = trackPx / n;

  // Header: week labels (weeks start Sunday) and day numbers
  let weeks = "", days = "";
  for (let ws = weekStart(mStart); ws <= mEnd; ws += 7) {
    const a = Math.max(ws, mStart), b = Math.min(ws + 6, mEnd);
    const partial = ws < mStart;
    weeks += `<div class="wk-label ${partial ? "partial" : ""}" style="left:${pct(a, mStart, n)};width:${((b - a + 1) / n) * 100}%"
      title="Week of ${fmtDayShort(ws)}">${(b - a + 1) * pxPerDay > 120 ? `Week of ${fmtDayShort(ws)}` : fmtDayShort(ws)}</div>`;
  }
  for (let d = mStart; d <= mEnd; d++) {
    const wd = weekday(d);
    days += `<div class="day-cell ${wd === 0 ? "sun" : ""} ${d === today ? "today" : ""}" data-day="${d}" style="left:${pct(d, mStart, n)};width:${100 / n}%">
      ${pxPerDay >= 30 ? `<span>${"SMTWTFS"[wd]}</span>` : ""}<b>${dayToDate(d).getUTCDate()}</b></div>`;
  }

  // Background grid: Fri/Sat weekend shading, Sunday week lines, today
  let grid = "";
  for (let d = mStart; d <= mEnd; d++) {
    const wd = weekday(d);
    if (wd === 5) grid += `<div class="weekend" style="left:${pct(d, mStart, n)};width:${(Math.min(2, mEnd - d + 1) / n) * 100}%"></div>`;
    if (wd === 0 && d > mStart) grid += `<div class="wk-line" style="left:${pct(d, mStart, n)}"></div>`;
  }
  if (state.tint && kctx) {
    const key = tintKpi(kctx);
    for (let d = mStart; d <= mEnd; d++) {
      const st = kpiStatusOf(kctx, key, kpiPoint(kctx.kpi, kctx.vertical, key, d)).status;
      if (["green", "amber", "red", "over"].includes(st)) grid += `<div class="tint t-${st}" style="left:${pct(d, mStart, n)};width:${100 / n}%"></div>`;
    }
  }
  if (today >= mStart && today <= mEnd) grid += `<div class="today-line" style="left:calc(${pct(today, mStart, n)} + ${100 / n / 2}%)" title="Today, ${fmtDay(today)}"></div>`;

  // The first packed row carries the group label (if any); the rest leave the label column blank.
  const barRows = (items, firstLabel = "", rank) => packBars(items, mStart, mEnd, pxPerDay, trackPx, rank)
    .map((row, i) => `<div class="tl-row ${i === 0 && firstLabel ? "tl-group-first" : ""}">${i === 0 && firstLabel ? firstLabel : `<div class="tl-label"></div>`}<div class="tl-track">${row.map(b => barHTML(b, mStart, n)).join("")}</div></div>`).join("");

  const laneHead = (lane, count) => `<div class="tl-lane-head"><h3>${lane.title}</h3><span class="muted">${count}</span></div>`;

  // Seasonal moments lane
  const momentLane = LANES[0];
  const moments = inMonth.filter(r => r.tier === MOMENT);
  const tierRank = r => ({ T1: 0, T2: 1, T3: 2 }[momentTier(r)] ?? 3);
  let body = laneHead(momentLane, moments.length) + (moments.length ? barRows(moments, "", tierRank) : `<div class="tl-empty">${momentLane.empty}</div>`);

  // Campaign lanes, grouped by vertical, with moment bands behind them
  const bands = moments.map(r => {
    const s = Math.max(r._start, mStart), e = Math.min(r._end, mEnd);
    return `<div class="band ${momentTier(r) === "T1" ? "t1" : ""}" data-band="${esc(r._key)}" style="left:${pct(s, mStart, n)};width:${((e - s + 1) / n) * 100}%"></div>`;
  }).join("");
  let campaigns = "";
  const unclassified = inMonth.filter(r => !ALLOWED.tier.includes(r.tier));
  const campaignLanes = [...LANES.slice(1)];
  if (unclassified.length) campaignLanes.push({ tier: null, title: "Unclassified (missing or invalid tier)", empty: "" });
  for (const lane of campaignLanes) {
    const items = lane.tier ? inMonth.filter(r => r.tier === lane.tier) : unclassified;
    campaigns += laneHead(lane, items.length);
    if (!items.length) { campaigns += `<div class="tl-empty">${lane.empty}</div>`; continue; }
    const groups = new Map();
    for (const r of items) {
      const v = r.vertical || "(no vertical)";
      if (!groups.has(v)) groups.set(v, []);
      groups.get(v).push(r);
    }
    const order = [...groups.keys()].sort((a, b) => {
      const ia = ALLOWED.vertical.indexOf(a), ib = ALLOWED.vertical.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    for (const v of order) {
      const list = groups.get(v);
      const key = `${lane.title}|${v}`;
      const collapsed = state.collapsed.has(key);
      const minis = collapsed ? list.map(r => {
        const s = Math.max(r._start, mStart), e = Math.min(r._end, mEnd);
        return `<div class="mini-bar" style="left:${pct(s, mStart, n)};width:${((e - s + 1) / n) * 100}%;--c:${verticalColor(r.vertical)}"></div>`;
      }).join("") : "";
      const label = `<div class="tl-label tl-group-head ${collapsed ? "collapsed" : ""}" data-group="${esc(key)}" role="button" aria-expanded="${!collapsed}" tabindex="0"
        title="${collapsed ? "Expand" : "Collapse"} ${esc(v)}"><span class="chev">▾</span><span class="vdot" style="background:${verticalColor(v)};margin:0"></span>${esc(v)} <span class="n">${list.length}</span></div>`;
      if (collapsed) campaigns += `<div class="tl-row tl-group-first">${label}<div class="tl-track">${minis}</div></div>`;
      else campaigns += barRows(list, label);
    }
  }
  body += `<div class="tl-campaigns"><div class="tl-bands">${bands}</div>${campaigns}</div>`;

  tl.innerHTML = `
    <div class="tl-head">
      <div class="tl-row tl-weeks"><div class="tl-label">Week (Sun–Sat)</div><div class="tl-track">${weeks}</div></div>
      <div class="tl-row tl-days"><div class="tl-label"></div><div class="tl-track">${days}</div>${showStrip ? `<div class="mtd-head">Month to date</div>` : ""}</div>
    </div>
    <div class="tl-body"><div class="tl-grid">${grid}</div>${showStrip ? kpiStripHTML(kctx, mStart, mEnd, n, pxPerDay) : kctx ? "" : kpiPrompt()}${body}</div>`;

  $("#monthNote").innerHTML = undated.length
    ? `${undated.length} initiative${undated.length === 1 ? " isn't" : "s aren't"} on the timeline because of missing or invalid dates:
       ${undated.map(r => `<button class="link" data-row="${esc(r._key)}">${esc(r.id || barName(r))}</button>`).join(", ")}. See Data issues.`
    : "";
}

/* ---------- Filters ---------- */

const NO_OWNER = "(no owner)";

// Campaigns: every filter applies.
// Seasonal moments ignore the type and owner filters. With a vertical filter,
// a moment shows when its relevant_verticals include a selected vertical (or
// All), or when it is the parent or grandparent of a visible campaign. Linked
// moments also bypass the moment tier filter, since the campaign depends on them.
function campaignPasses(r) {
  const f = state.filters;
  if (f.tier && r.tier !== f.tier) return false;
  if (f.status && r.status !== f.status) return false;
  if (f.verticals && !f.verticals.has(r.vertical)) return false;
  if (f.campaign_type && r.campaign_type !== f.campaign_type) return false;
  if (f.owner && (r.owner || NO_OWNER) !== f.owner) return false;
  return true;
}
const momentTier = r => (r._bad_priority ? "" : r.priority) || "";
function momentPasses(r, linked) {
  const f = state.filters;
  if (f.tier && f.tier !== MOMENT) return false;
  if (f.status && r.status !== f.status) return false;
  if (linked.has(r._key)) return true;
  if (!f.momentTiers.has(momentTier(r))) return false;
  if (f.verticals && !f.showAllMoments) return r._relevantAll || [...f.verticals].some(v => r._relevant.has(v));
  return true;
}
function computeVisible() {
  const { rows, byKey } = state.data;
  const visible = new Set(), linked = new Set();
  for (const r of rows) {
    if (r.tier === MOMENT || !campaignPasses(r)) continue;
    visible.add(r._key);
    for (let k = r._parent, hops = 0; k && hops < 5; hops++) {
      const p = byKey.get(k);
      if (!p) break;
      if (p.tier === MOMENT) linked.add(p._key);
      k = p._parent;
    }
  }
  for (const r of rows) if (r.tier === MOMENT && momentPasses(r, linked)) visible.add(r._key);
  state.visibleKeys = visible;
  state.linkedMoments = linked;
}
const passes = r => state.visibleKeys.has(r._key);

function filterParts() {
  const f = state.filters, parts = [];
  if (f.verticals) parts.push(`Vertical: ${f.verticals.size ? [...f.verticals].join(", ") : "none"}`);
  if (f.tier) parts.push(`Tier: ${f.tier}`);
  if (f.campaign_type) parts.push(`Type: ${f.campaign_type}`);
  if (f.status) parts.push(`Status: ${f.status}`);
  if (f.owner) parts.push(`Owner: ${f.owner}`);
  const tiersNow = MOMENT_TIERS.filter(t => f.momentTiers.has(t));
  if (tiersNow.join() !== "T1,T2,") parts.push(`Moment tiers: ${tiersNow.map(t => t || "no tier").join(", ") || "none"}`);
  if (f.showAllMoments) parts.push("All moments shown");
  return parts;
}

function uniqueSorted(values, order) {
  const set = [...new Set(values)];
  return set.sort((a, b) => {
    const ia = order ? order.indexOf(a) : -1, ib = order ? order.indexOf(b) : -1;
    return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b);
  });
}

function renderFilters() {
  const rows = state.data.rows, f = state.filters;
  const campaigns = rows.filter(r => r.tier !== MOMENT);
  const vOpts = uniqueSorted(campaigns.map(r => r.vertical).filter(Boolean), ALLOWED.vertical);
  const typeOpts = uniqueSorted(campaigns.map(r => r.campaign_type).filter(Boolean), ALLOWED.campaign_type);
  const ownerOpts = uniqueSorted(campaigns.map(r => r.owner || NO_OWNER));

  const sel = (name, label, options) => `
    <label>${label}
      <select data-filter="${name}" class="${f[name] ? "active" : ""}">
        <option value="">All</option>
        ${uniqueSorted([...options, ...(f[name] ? [f[name]] : [])], options).map(o => `<option ${f[name] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
      </select>
    </label>`;

  const vSummary = !f.verticals ? "All" : !f.verticals.size ? "None" : f.verticals.size <= 2 ? [...f.verticals].join(", ") : `${f.verticals.size} selected`;
  const tiersNow = MOMENT_TIERS.filter(t => f.momentTiers.has(t));
  const mSummary = tiersNow.length === MOMENT_TIERS.length ? "All tiers" : tiersNow.length ? tiersNow.map(t => t || "No tier").join(", ") : "None";
  const shown = rows.filter(passes).length;
  const momentCounts = Object.fromEntries(MOMENT_TIERS.map(t => [t, rows.filter(r => r.tier === MOMENT && momentTier(r) === t).length]));
  $("#filterBar").innerHTML = `
    <label>Vertical
      <details class="ms ${f.verticals ? "active" : ""}" data-menu="vertical" ${state.openMenu === "vertical" ? "open" : ""}>
        <summary>${esc(vSummary)}</summary>
        <div class="ms-menu">
          <div class="ms-actions"><button class="link" data-action="all-verticals">All verticals</button></div>
          ${vOpts.map(v => `<label><input type="checkbox" data-vertical="${esc(v)}" ${!f.verticals || f.verticals.has(v) ? "checked" : ""}>
            <span class="vdot" style="background:${verticalColor(v)}"></span>${esc(v)}</label>`).join("") || `<div class="faint" style="padding:6px 8px">No campaigns loaded</div>`}
        </div>
      </details>
    </label>
    ${sel("tier", "Tier", ALLOWED.tier)}
    ${sel("campaign_type", "Type", typeOpts)}
    ${sel("status", "Status", ALLOWED.status)}
    ${sel("owner", "Owner", ownerOpts)}
    <label>Moments
      <details class="ms ${tiersNow.join() !== "T1,T2," ? "active" : ""}" data-menu="moments" ${state.openMenu === "moments" ? "open" : ""}>
        <summary>${esc(mSummary)}</summary>
        <div class="ms-menu">
          ${MOMENT_TIERS.map(t => `<label><input type="checkbox" data-moment-tier="${t}" ${f.momentTiers.has(t) ? "checked" : ""}>
            ${t ? `<span class="chip prio">${t}</span>` : "No tier"} <span class="faint">${momentCounts[t]}</span></label>`).join("")}
        </div>
      </details>
    </label>
    <label title="Show seasonal moments for every vertical, not only those relevant to the selected verticals">
      <input type="checkbox" data-show-all-moments ${f.showAllMoments ? "checked" : ""}> Show all moments</label>
    <span class="filter-note">Showing ${shown} of ${rows.length}${filterParts().length ? ` · <button class="link" data-action="clear-filters">Clear filters</button>` : ""}</span>`;
}

document.addEventListener("change", e => {

    state.tint = t.checked;

    t.checked ? state.filters.momentTiers.add(t.dataset.momentTier) : state.filters.momentTiers.delete(t.dataset.momentTier);
    render();
  } else if (t.dataset.showAllMoments !== undefined) {
    state.filters.showAllMoments = t.checked;
    render();
  } else if (t.dataset.vertical !== undefined) {
    const all = [...document.querySelectorAll("[data-vertical]")];
    const checked = all.filter(c => c.checked).map(c => c.dataset.vertical);

/* ---------- KPI views ---------- */

// Which KPI series to show: the selected vertical when exactly one is selected
// and it has a KPI source; otherwise the company total.
function kpiContext() {
  const kpi = state.data?.kpi;
  if (!kpi || !kpi.verticals.size) return null;
  const sel = state.filters.verticals;
  if (sel && sel.size === 1 && kpi.verticals.has([...sel][0])) {
    const v = [...sel][0];
    return { kpi, vertical: v, label: v, total: false };
  }
  if (kpi.verticals.has(KPI_TOTAL)) return { kpi, vertical: KPI_TOTAL, label: "Company total", total: true };
  const first = [...kpi.verticals.keys()][0];
  return { kpi, vertical: first, label: first, total: false };
}
const kpiMode = ctx => kpiStatusMode(ctx.kpi, ctx.vertical, CONFIG.kpiStatus);
const kpiStatusOf = (ctx, key, point) => kpiStatus(point, ctx.kpi.defs[key], kpiMode(ctx), CONFIG.kpiStatus.thresholdPct);
const shownKpis = ctx => Object.keys(ctx.kpi.defs).filter(k => state.kpiShow.has(k));

function statusText(st) {
  const t = CONFIG.kpiStatus.thresholdPct;
  const text = st.basis === "threshold"
    ? { over: `More than ${t}% above forecast`, green: "At or above forecast", amber: `Below forecast, within ${t}%`, red: `More than ${t}% below forecast` }
    : { over: "Above bull", green: "At or above forecast", amber: "Below forecast, at or above bear", red: "Below bear" };
  if (st.status === "no_actual") return "No actual yet";
  if (st.status === "none") return "No forecast";
  return text[st.status] + (st.status === "over" && st.basis !== "threshold" ? " (at or above forecast)" : "");
}
const signed = (v, fmt) => (v == null ? "—" : `${Math.round(v) > 0 ? "+" : ""}${fmt(v)}`);

function renderActualsThrough() {
  const ctx = kpiContext();
  const el = $("#actualsThrough");
  if (!ctx) { el.classList.add("hidden"); return; }
  const d = kpiLatestActual(ctx.kpi, ctx.vertical);
  el.textContent = (d != null ? `Actuals through ${fmtDayShort(d)}` : "No actuals yet") + (ctx.total ? "" : ` · ${ctx.label}`);
  el.title = `KPI actuals for ${ctx.label}`;
  el.classList.remove("hidden");
}

// KPI rows under the date axis, on the same day columns as the bars.
function kpiStripHTML(ctx, mStart, mEnd, n, pxPerDay) {
  const today = todayDay();
  const keys = shownKpis(ctx);
  let html = `<div class="tl-kpi-head"><h3>Daily KPIs</h3><span class="kpi-scope">${esc(ctx.label)}</span>
    <span class="muted" style="font-size:11px">Actual, or forecast in grey italics where there's no actual yet</span></div>`;
  for (const key of keys) {
    const def = ctx.kpi.defs[key];
    let cells = "";
    for (let d = mStart; d <= mEnd; d++) {
      const p = kpiPoint(ctx.kpi, ctx.vertical, key, d);
      if (!p || (p.forecast == null && p.actual == null)) continue;
      const st = kpiStatusOf(ctx, key, p);
      const value = p.actual ?? p.forecast;
      cells += `<button class="kc s-${st.status} ${d === today ? "today" : ""} ${pxPerDay < 30 ? "sm" : ""}" data-day="${d}" data-tip="day" data-kpi="${esc(key)}"
        style="left:${pct(d, mStart, n)};width:calc(${100 / n}% - 2px)" aria-label="${esc(def.label)} ${fmtDay(d)}">${pxPerDay >= 21 ? fmtCompact(value) : ""}</button>`;
    }
    const m = kpiPeriod(ctx.kpi, ctx.vertical, key, mStart, mEnd);
    html += `<div class="tl-row kpi-row"><div class="tl-label">${esc(def.label)}${def.unit === "QAR" ? ` <span class="unit">QAR</span>` : ""}</div>
      <div class="tl-track">${cells}</div>${mtdHTML(ctx, key, m, mStart, mEnd)}</div>`;
  }
  return html;
}

function mtdHTML(ctx, key, m, from, to) {
  if (!m) return `<div class="mtd"><span class="sub faint">No forecast this month</span></div>`;
  const attrs = `data-tip="period" data-kpi="${esc(key)}" data-from="${from}" data-to="${to}"`;
  if (m.actual == null) {
    return `<div class="mtd" ${attrs}><div class="top"><span class="st-dot s-none"></span>No actuals yet</div>
      <div class="sub">Month forecast ${fmtCompact(m.forecastAll)}</div></div>`;
  }
  const st = kpiStatusOf(ctx, key, { forecast: m.forecast, bear: m.bear, bull: m.bull, actual: m.actual });
  const complete = m.daysWithActual === m.days;
  return `<div class="mtd" ${attrs}>
    <div class="top"><span class="st-dot s-${st.status}"></span>${complete ? "Month" : "MTD"} ${fmtPct(m.attainment)} <span class="sub" style="font-weight:500">of forecast</span></div>
    <div class="sub">${complete ? `${fmtCompact(m.actual, 2)} vs ${fmtCompact(m.forecast, 2)}` : `Proj. ${fmtCompact(m.projected, 2)} vs ${fmtCompact(m.forecastAll, 2)}`}</div></div>`;
}

// Hover card content for a KPI day cell or an MTD/period summary.
function tipHTML(el) {
  const ctx = kpiContext();
  if (!ctx) return "";
  const key = el.dataset.kpi, def = ctx.kpi.defs[key];

  const v = x => fmtKpi(x, def);

  if (el.dataset.tip === "day") {

    const st = kpiStatusOf(ctx, key, p);
    return `<h5>${esc(def.label)} · ${fmtDayShort(d)} ${dayParts(d)[0]}</h5><table>
      ${line("Forecast", v(p.forecast))}
      ${p.bear != null ? line("Bear", v(p.bear)) : ""}${p.bull != null ? line("Bull", v(p.bull)) : ""}
      ${line("Actual", p.actual != null ? v(p.actual) : "no actual yet")}
      ${p.actual != null ? line("Delta", `${signed(st.delta, x => fmtKpi(x, def))} (${fmtPct(st.deltaPct, true)})`) : ""}
      ${st.vsBear != null ? line("vs bear", fmtPct(st.vsBear)) : ""}${st.vsBull != null ? line("vs bull", fmtPct(st.vsBull)) : ""}
      </table><div class="st">${statusText(st)}${st.basis === "threshold" && p.actual != null ? ` · ±${CONFIG.kpiStatus.thresholdPct}% rule` : ""}</div>
      <div style="opacity:.7;margin-top:2px">${esc(ctx.label)} · click for the day's detail</div>`;
  }
  const from = +el.dataset.from, to = +el.dataset.to;
  const m = kpiPeriod(ctx.kpi, ctx.vertical, key, from, to);
  if (!m) return "";
  const st = m.actual != null ? kpiStatusOf(ctx, key, { forecast: m.forecast, bear: m.bear, bull: m.bull, actual: m.actual }) : { status: "no_actual" };
  return `<h5>${esc(def.label)} · ${fmtDay(from)} – ${fmtDay(to)}</h5><table>
    ${line("Days with actuals", `${m.daysWithActual} of ${m.days}`)}
    ${line("Actual", v(m.actual))}
    ${line("Forecast, same days", v(m.forecast))}
    ${m.bear != null ? line("Bear, same days", v(m.bear)) : ""}
    ${line("Attainment", fmtPct(m.attainment))}
    ${m.vsBear != null ? line("vs bear", fmtPct(m.vsBear)) : ""}
    ${line("Projected period end", v(m.projected))}
    ${line("Period forecast", v(m.forecastAll))}
    </table><div class="st">${statusText(st)}</div>
    <div style="opacity:.7;margin-top:2px">Projection = actual + remaining forecast × attainment</div>`;
}

// Weekly KPI table: KPI × day, forecast / actual / delta / delta %, plus a week total.
function renderWeekKpi(ws) {
  const el = $("#weekKpi");
  const ctx = kpiContext();
  if (!ctx) { el.innerHTML = kpiPrompt(); return; }
  const today = todayDay();
  const days = Array.from({ length: 7 }, (_, i) => ws + i);
  const num = x => (x == null ? "—" : fmtNum(Math.round(x) || 0));   // || 0 turns -0 into 0
  const tone = x => (x == null ? "" : x < 0 ? "neg" : x > 0 ? "pos" : "");
  let body = "";
  for (const [key, def] of Object.entries(ctx.kpi.defs)) {
    const pts = days.map(d => kpiPoint(ctx.kpi, ctx.vertical, key, d));
    const sts = pts.map(p => kpiStatusOf(ctx, key, p));
    const w = kpiPeriod(ctx.kpi, ctx.vertical, key, ws, ws + 6);
    const wst = w && w.actual != null ? kpiStatusOf(ctx, key, { forecast: w.forecast, bear: w.bear, bull: w.bull, actual: w.actual }) : { status: "none" };
    const wDelta = w && w.actual != null ? w.actual - w.forecast : null;
    body += `<tr class="kname"><th colspan="9">${esc(def.label)}${def.unit === "QAR" ? ` <span class="muted" style="font-weight:500">QAR</span>` : ""}</th></tr>
      <tr><th class="rowh">Forecast</th>${pts.map(p => `<td>${num(p?.forecast)}</td>`).join("")}<td class="wk-total">${num(w?.forecastAll)}</td></tr>
      <tr><th class="rowh">Actual</th>${pts.map((p, i) => p?.actual != null
        ? `<td class="s-${sts[i].status}-cell" data-tip="day" data-kpi="${esc(key)}" data-day="${days[i]}">${num(p.actual)}</td>`
        : `<td class="na">${p?.forecast != null ? "no actual" : "—"}</td>`).join("")}
        <td class="wk-total ${w?.actual != null ? `s-${wst.status}-cell` : "na"}" data-tip="period" data-kpi="${esc(key)}" data-from="${ws}" data-to="${ws + 6}">${w?.actual != null ? `${num(w.actual)} <span class="muted" style="font-weight:500">(${w.daysWithActual}/7 d)</span>` : "no actuals"}</td></tr>
      <tr><th class="rowh">Delta</th>${sts.map(s => `<td class="${tone(s.delta)}">${signed(s.delta, num)}</td>`).join("")}<td class="wk-total ${tone(wDelta)}">${signed(wDelta, num)}</td></tr>
      <tr><th class="rowh">Delta %</th>${sts.map(s => `<td class="${tone(s.deltaPct)}">${fmtPct(s.deltaPct, true)}</td>`).join("")}<td class="wk-total ${tone(wDelta)}">${fmtPct(w && w.actual != null ? w.attainment - 1 : null, true)}</td></tr>`;
  }
  el.innerHTML = `<table>
    <thead><tr><th style="text-align:left"><span class="kpi-scope">${esc(ctx.label)}</span></th>
      ${days.map(d => `<th class="dayh ${d === today ? "today" : ""}" data-day="${d}" title="Open ${fmtDay(d)}">${fmtDayShort(d)}</th>`).join("")}
      <th>Week</th></tr></thead>
    <tbody>${body}</tbody></table>
    <div class="foot">The week's delta compares actuals with the forecast for the same days; the Forecast row shows the full week. Days without an actual are never counted as zero.</div>`;
}

// Hover card
(() => {
  const tip = document.getElementById("tip");
  let current = null;
  document.addEventListener("mouseover", e => {
    const t = e.target.closest?.("[data-tip]");
    if (t === current) return;
    current = t;
    if (!t) { tip.style.display = "none"; return; }
    const html = tipHTML(t);
    if (!html) { tip.style.display = "none"; return; }
    tip.innerHTML = html;
    tip.style.display = "block";
  });
  document.addEventListener("mousemove", e => {
    if (tip.style.display !== "block") return;
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > window.innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
  });
  document.addEventListener("scroll", () => { tip.style.display = "none"; current = null; }, true);
})();

/* ---------- Reload data ---------- */

// Remembered file handles (Chrome and Edge), so "Reload data" can re-read the
// same files without picking them again. Kept in IndexedDB; every call is
// best-effort and the page works without it.
const handleStore = {
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("marketingTracker", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("handles");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  },
  async put(label, handle) {
    try { const db = await this.open(); db.transaction("handles", "readwrite").objectStore("handles").put(handle, label); } catch { /* not available */ }
  },
  async all() {
    try {
      const db = await this.open();
      return await new Promise(resolve => {
        const out = new Map();
        const cur = db.transaction("handles").objectStore("handles").openCursor();
        cur.onsuccess = () => { const c = cur.result; if (c) { out.set(c.key, c.value); c.continue(); } else resolve(out); };
        cur.onerror = () => resolve(out);
      });
    } catch { return new Map(); }
  },
  async clear() {
    try { const db = await this.open(); db.transaction("handles", "readwrite").objectStore("handles").clear(); } catch { /* not available */ }
  },
};

async function pickFiles() {
  if (!window.showOpenFilePicker || window.top !== window) { $("#filePicker").click(); return; }
  try {
    const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: "CSV or dismissals JSON", accept: { "text/csv": [".csv"], "application/json": [".json"] } }] });
    const files = await Promise.all(handles.map(h => h.getFile()));
    addFiles(files, new Map(handles.map(h => [h.name, h])));
  } catch (e) {
    if (e.name !== "AbortError") $("#filePicker").click();
  }
}

async function fetchUrlSource(c) {
  const base = { label: c.label || c.url, origin: "url", url: c.url };
  try {
    const res = await fetch(c.url, { cache: "no-store" });
    const text = await res.text();
    const problem = publishedCsvProblem(res.status, text);
    if (problem) throw new Error(problem);
    return { ...base, text };
  } catch (e) {
    // Browsers report network, CORS and blocked-host failures all as a TypeError,
    // including a sign-in-restricted link (Google's sign-in page has no CORS headers).
    const msg = e instanceof TypeError
      ? "couldn't read Google Sheets. Either there's no connection or the network blocks docs.google.com, or the spreadsheet isn't published to the web, or publishing is restricted to signed-in people in your organisation (open the tab's published link in a private window to check)"
      : e.message || String(e);
    return { ...base, text: "", loadError: msg };
  }
}

// google.script.run as a promise.
function callServer(fn, ...args) {
  return new Promise((resolve, reject) =>
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
}
// Every configured tab, read server-side in one round trip. A missing tab
// becomes a "Tab not found" source instead of failing the whole load.
async function fetchAppsScriptSources() {
  const labels = CONFIG.sources.map(c => c.label);
  try {
    const { info, tabs } = await callServer("loadTracker", labels);
    state.sheetInfo = info;
    return labels.map(label => {
      const t = tabs.find(x => x.name === label);
      if (!t || !t.found) {
        return { label, origin: "appsScript", records: [],
          loadError: `Tab not found: there's no tab called "${label}" in "${info.name}". Rename the tab, or update its label in CONFIG. Tabs in the spreadsheet: ${info.tabs.map(x => x.name).join(", ")}` };
      }
      return { label, origin: "appsScript", records: t.values };
    });
  } catch (e) {
    const msg = String(e && e.message || e);
    const loadError = /permission|access|authori[sz]/i.test(msg)
      ? `You don't have access to the Marketing Tracker spreadsheet (${msg}). Ask its owner to share it with you, then reload`
      : `Couldn't read the spreadsheet: ${msg}`;
    return labels.map(label => ({ label, origin: "appsScript", records: [], loadError }));
  }
}
async function loadFromAppsScript() {
  state.loading = true;
  render();
  const tabs = await fetchAppsScriptSources();
  state.loading = false;
  state.sources = [...tabs, ...state.sources.filter(s => s.origin === "file")];
  rebuild();
}

// Re-fetch every URL source and re-read every remembered file. View, period,
// filters and the open panel stay as they are.
async function reloadData() {
  notice("Reloading…", true);
  const urlSources = MODE === "urls" ? await Promise.all(configuredSources().filter(c => c.url).map(fetchUrlSource))
    : MODE === "appsScript" ? await fetchAppsScriptSources() : [];
  const missing = [];
  let reread = 0;
  const files = await Promise.all(state.sources.filter(s => s.origin === "file").map(async s => {
    const h = state.handles.get(s.label);
    if (!h) { missing.push(s.label); return s; }
    try {
      if (h.queryPermission && (await h.queryPermission({ mode: "read" })) !== "granted" && (await h.requestPermission({ mode: "read" })) !== "granted") throw new Error("permission");
      const f = await h.getFile();
      reread++;
      return { label: s.label, text: await f.text(), origin: "file" };
    } catch {
      missing.push(s.label);
      return s;
    }
  }));
  state.sources = [...urlSources, ...files];
  if (MODE === "local") storageSet(state.sources.filter(s => s.origin === "file" && !s.loadError).map(({ label, text }) => ({ label, text })));
  rebuild();
  const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const done = [urlSources.length ? `${urlSources.length} tab${urlSources.length === 1 ? "" : "s"}` : "", reread ? `${reread} file${reread === 1 ? "" : "s"}` : ""].filter(Boolean).join(" and ");
  notice(`${done ? `Reloaded ${done} at ${time}.` : ""}${missing.length
    ? ` ${missing.length === 1 ? "This file" : "These files"} can't be re-read automatically in this browser: ${missing.map(esc).join(", ")}. <button data-action="pick">Choose ${missing.length === 1 ? "it" : "them"} again</button>`
    : ""}`, missing.length > 0);
}

}
